<!DOCTYPE html>

    <!--
        Versión del MOTOR de la plantilla (el código que hace funcionar la
        página, no los datos del supuesto). El editor de Python la compara
        con la suya y, si el archivo se quedó atrás, ofrece ponerlo al día
        al guardar. Subir este número al cambiar el motor.
    -->
    <meta name="motor-plantilla" content="10">
    <title>[TÍTULO DE LA EVALUACIÓN]</title>
    <link rel="stylesheet" href="../fuentes/fuentes.css">

    <link rel="stylesheet" href="../css/base-supuesto.css">

<body>

<!-- NAVEGACIÓN -->
<nav id="nav-header">
    <div id="nav-boxes"></div>

    <!-- Contador «pregunta actual / total» y respondidas (se rellena solo) -->
    <div id="nav-contador" aria-live="off"><span id="nav-actual">1/1</span><small id="nav-respondidas"></small></div>

    <button id="fold-btn" class="home-btn" onclick="togglePlegado()"
            title="Plegar: ver solo el bloque actual" aria-label="Plegar bloques"
            style="display:none;">⌃</button>

    <button id="home-btn-top" class="home-btn" onclick="goHome()"
            title="Volver al menú principal" aria-label="Volver al menú principal">🏠</button>

    <div class="settings-wrap">
        <button id="settings-toggle" onclick="toggleSettings()" title="Configuración del temporizador" aria-label="Configuración" aria-expanded="false" aria-controls="settings-panel">⚙</button>
        <div id="settings-panel">
            <div class="settings-title" id="settings-title">Configuración</div>
            <div class="settings-row" id="row-tiempo">
                <label for="time-input"><span id="lbl-tiempo">Duración del examen (mm:ss)</span></label>
                <div class="time-edit-line">
                    <input type="text" id="time-input" placeholder="30:00">
                    <button class="btn-mini" onclick="applyTimer()">Aplicar</button>
                </div>
            </div>
            <div class="settings-row settings-check" id="row-corregir">
                <label>
                    <input type="checkbox" id="instant-feedback-toggle" onchange="toggleInstantFeedback(this.checked)">
                    <span id="lbl-corregir">Corregir pregunta a pregunta</span>
                </label>
            </div>
            <!--
                UNA CASILLA POR BLOQUE. El examen puede tener un bloque o
                cinco, así que estas casillas las crea sola la página al
                arrancar (ver montarOpcionesUnaEnUna): una por cada bloque
                que salga en el intento y que no esté marcado como oculto
                en el editor. Sin marcar = ese bloque se ve EN CADENA.
            -->
            <div class="settings-row" id="row-una">
                <label><span id="lbl-una">Ver las preguntas de una en una</span></label>
                <div id="una-por-bloque"></div>
            </div>
            <div class="settings-row settings-check settings-sub" id="row-foco">
                <label>
                    <input type="checkbox" id="foco-toggle" onchange="toggleModoFoco(this.checked)">
                    <span id="lbl-foco">Modo foco: solo los hechos de cada pregunta</span>
                </label>
            </div>
            <div class="settings-row settings-check" id="row-qtags">
                <label>
                    <input type="checkbox" id="hide-qtags-toggle" onchange="toggleHideQTags(this.checked)">
                    <span id="lbl-qtags">Ocultar etiquetas de pregunta (q-tag)</span>
                </label>
            </div>
        </div>
    </div>
</nav>

<!-- TEMPORIZADOR -->
<div id="timer" onclick="toggleTimerPause()" title="Clic para pausar / reanudar" role="button" tabindex="0" aria-label="Tiempo restante. Pulsa para pausar o reanudar">
    <span class="timer-label">TIEMPO RESTANTE</span>
    <span id="timer-display">30:00</span>
</div>

<!-- ══════════════════════════════════════════
     CONTENIDO PRINCIPAL
══════════════════════════════════════════ -->
<div class="container">

    <!--
        Título, referencia, ámbito y minutos NO se editan aquí: se rellenan
        automáticamente en el arranque a partir de EXAM_CONFIG (al principio
        de la ZONA EDITABLE del bloque de JavaScript, al final de la
        página). El nº de preguntas se calcula solo, contando
        QUESTIONS_BANK. Así solo hay un sitio donde tocar
        estos datos y nunca queda desactualizado un lugar y otro no.
    -->

    <!-- Título para impresión -->
    <div id="print-title" style="text-align:center; margin-bottom:24px; font-family:'Playfair Display',serif;">
        <h1 id="print-title-h1" style="font-size:1.4rem; color:#3d2a20;"></h1>
        <p id="print-title-sub" style="font-size:0.85rem; color:#555; margin-top:4px;"></p>
        <p id="print-fecha" style="font-size:0.8rem; color:#777; margin-top:4px;"></p>
    </div>

    <!-- CABECERA INSTITUCIONAL -->
    <header class="inst-header">
        <img id="inst-logo" class="logo-img" src="" alt="">
        <div class="organismo" id="inst-organismo"></div>
        <h1 id="inst-title"></h1>
        <div class="meta-strip">
            <span class="meta-pill" id="meta-preguntas"></span>
            <span class="meta-pill" id="meta-minutos"></span>
            <span class="meta-pill" id="meta-legislacion"></span>
            <span class="meta-pill" id="meta-referencia"></span>
        </div>
    </header>

    <!--
        ENUNCIADOS
        ──────────
        Ya no hay un panel fijo de enunciado encima de la página: cada
        enunciado se pinta DENTRO del hilo de preguntas (#quiz-container),
        justo delante del grupo de preguntas al que pertenece y debajo de
        la cabecera de su bloque. Así el documento se lee en su orden
        natural: cabecera del bloque → enunciado 1 → sus preguntas →
        enunciado 2 → sus preguntas…

        Cada pregunta de QUESTIONS_BANK indica a qué enunciado pertenece
        mediante "statementId"; una pregunta con statementId null/ausente es
        una "pregunta suelta" y no muestra ningún bloque de hechos.

        Estructura disponible dentro de cada enunciado (ver STATEMENTS_BANK):
        - factBlocks[]  → bloques de hechos (borde dorado; "red:true" = borde rojo/crítico)
                          cada uno con su "id" (H1, H2…) para poder vincularle preguntas
        - timeline[]    → hitos de la línea de tiempo ("red:true" = hito crítico)
        - "hidden:true" en cualquier factBlock/hito lo omite del renderizado
          (útil para preparar variantes de un mismo supuesto sin borrar datos).

        Cada pregunta puede además vincularse a uno o varios bloques de
        hechos concretos con "factIds": en el MODO FOCO (⚙, dentro de «ver
        las preguntas de una en una») el enunciado se recorta a esos hechos.
    -->

    <!-- BARRA DE PROGRESO -->
    <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>

    <!-- PREGUNTAS -->
    <div id="quiz-container"></div>

    <!-- BOTONERA -->
    <div class="btn-zone" id="btn-zone">
        <button id="prev-btn" class="btn btn-primary" onclick="move(-1)">← Anterior</button>
        <button id="next-btn" class="btn btn-primary" onclick="move(1)">Siguiente →</button>
        <button id="check-btn"   class="btn btn-danger"   onclick="evaluateExam()">✓ Corregir Expediente</button>
        <button id="print-btn"   class="btn btn-success"  onclick="printResults()">🖨 Imprimir / PDF</button>
        <button id="restart-btn" class="btn btn-info"     onclick="openRandomModal()">🔀 Nuevo Intento (Aleatorio)</button>
        <button id="send-btn"    class="btn btn-send"     onclick="enviarResultados()">📤 Enviar Resultados</button>
        <button id="home-btn-bottom" class="btn btn-info" style="display:none;" onclick="goHome()">🏠 Volver al Menú Principal</button>
        <!-- Solo en el móvil y tras corregir: abre las demás acciones en una hoja desde abajo -->
        <button id="more-btn" class="btn btn-info" type="button" onclick="toggleMasAcciones()" aria-expanded="false" aria-controls="btn-zone">⋯ Más</button>
    </div>
</div>

     ──────────────────────────────────────────
     Este bloque JSON es lo ÚNICO que hay que cambiar para crear un
     supuesto nuevo, y lo edita automáticamente el programa Python
     "editor_supuestos.py" (interfaz gráfica). No hace falta tocarlo

       · los textos van entre comillas dobles "así"
       · las comillas dobles DENTRO de un texto se escriben \"
       · true / false / null se escriben en minúscula y sin comillas

       config     → título, referencia, ámbito, minutos, % para APTO y el
                    encabezado (logo y organismo)
       tema       → colores de toda la página (fondos, textos, acentos)
       interfaz   → qué botones se ven y cómo se llaman

                    cada bloque de hechos lleva su "id" (H1, H2…)
       preguntas  → cada pregunta, con el bloque al que pertenece y, si
                    procede, los "factIds" de los hechos concretos de los
                    que depende (modo foco del panel ⚙)
══════════════════════════════════════════ -->

    {
      "bloqueId": "B2",
      "statementId": null,
      "factIds": [],
      "tag": "Caso Práctico 16: Alta asimilada al alta por vacaciones retribuidas no disfrutadas",
      "q": "\u003cspan class=\"al-j\">Mateo finaliza su contrato de trabajo el día 15 de julio. Al liquidar la relación laboral, la empresa le abona la compensación económica correspondiente a 15 días de vacaciones devengadas y no disfrutadas, las cuales abarcan nominalmente hasta el 30 de julio. \u003cb>¿En qué situación se encuentra Mateo respecto a la Seguridad Social durante esos 15 días posteriores al cese?\u003c/b>\u003c/span>",
      "a": [
        "Se encuentra en situación de baja definitiva desde el 15 de julio, sin cotización alguna.",
        "Se encuentra en situación asimilada al alta, existiendo obligación de cotizar por el periodo de vacaciones retribuidas.",
        "Se encuentra en situación de alta de pleno derecho sin obligación de cotizar.",
        "Permanece en alta real ordinaria hasta el 30 de julio, posponiéndose la fecha del cese contractual."
      ],
      "c": 1,
      "correctas": [
        1
      ],
      "multiple": false,
      "respuestas": 0,
      "law": "\u003cspan class=\"al-j\">Conforme al artículo 36.1.b) del Real Decreto 84/1996, de 26 de enero, la situación que retribuye las vacaciones que no hayan sido disfrutadas con anterioridad a la finalización del contrato de trabajo se considera situación asimilada al alta, existiendo la obligación de cotizar por dicho periodo en los términos establecidos por la normativa general.\u003c/span>",
      "tip": ""
    },
    {
      "bloqueId": "B2",
      "statementId": null,
      "factIds": [],
      "tag": "Caso Práctico 17: Alta especial durante el ejercicio de huelga legal",
      "q": "\u003cspan class=\"al-j\">La plantilla de la empresa Metalúrgica Pachi, S.A. secundó una huelga convocada legalmente durante tres días laborables consecutivos. Durante ese periodo de inactividad por ejercitar el derecho de huelga, \u003cb>¿cuál es el encuadramiento de los trabajadores en la Seguridad Social?\u003c/b>\u003c/span>",
      "a": [
        "Se les tramita la baja obligatoria en el Régimen General por cese temporal de actividad.",
        "Permanecen en situación de alta especial, quedando en suspenso la obligación de cotizar por parte del empresario y del trabajador.",
        "Pasan a situación asimilada al alta con cotización íntegra a cargo de la empresa.",
        "Se mantiene el alta real ordinaria debiendo la entidad gestora asumir las cuotas de esos tres días."
      ],
      "c": 1,
      "correctas": [
        1
      ],
      "multiple": false,
      "respuestas": 0,
      "law": "\u003cspan class=\"al-j\">De acuerdo con el artículo 36.3 y artículo 65 del Real Decreto 84/1996, de 26 de enero, la huelga legal y el cierre patronal determinan la inclusión del trabajador en la situación de alta especial, durante la cual se suspende la obligación de cotizar tanto para la empresa como para el trabajador.\u003c/span>",
      "tip": ""
    },
    {
      "bloqueId": "B2",
      "statementId": null,
      "factIds": [],
      "tag": "Caso Práctico 18: Alta de oficio por la TGSS mediante comprobación de datos",
      "q": "\u003cspan class=\"al-j\">La Tesorería General de la Seguridad Social detecta, mediante el cruce telemático de datos con la Agencia Tributaria y sin necesidad de visita presencial de la Inspección de Trabajo, que un ciudadano presta servicios retribuidos en una empresa sin figurar dado de alta. \u003cb>¿De qué herramientas dispone la TGSS?\u003c/b>\u003c/span>",
      "a": [
        "No puede actuar de oficio si no existe un acta previa dictada por la Inspección de Trabajo.",
        "Puede tramitar directamente el alta de oficio del trabajador con base en los datos obrantes en su poder o facilitados por otros organismos.",
        "Concede un plazo de 6 meses a la empresa para que subsane voluntariamente antes de incoar expediente.",
        "Tramita una baja de oficio y deriva las actuaciones a la vía jurisdiccional ordinaria."
      ],
      "c": 1,
      "correctas": [
        1
      ],
      "multiple": false,
      "respuestas": 0,
      "law": "\u003cspan class=\"al-j\">Según el artículo 29.1 y artículo 34.1 del Real Decreto 84/1996, de 26 de enero, las altas de oficio pueden practicarse por la TGSS no solo a propuesta de la Inspección de Trabajo, sino también directamente de oficio por la propia Tesorería cuando compruebe el incumplimiento de la obligación de alta por los datos obrantes en la misma o aportados por las Administraciones Públicas.\u003c/span>",
      "tip": ""
    },
    {
      "bloqueId": "B2",
      "statementId": null,
      "factIds": [],
      "tag": "Caso Práctico 19: Alta asimilada al alta por excedencia forzosa",
      "q": "Lucía es elegida para un cargo público representativo que le impide acudir a su centro de trabajo, por lo que su empresa le concede la excedencia forzosa con reserva de puesto de trabajo. ¿Qué consideración legal tiene la situación de Lucía ante el sistema de la Seguridad Social?",
      "a": [
        "Se mantiene en alta real ordinaria debiendo cotizar por la base máxima.",
        "Se encuentra en situación asimilada al alta a efectos de conservar la protección en determinadas contingencias.",
        "Causa baja definitiva a todos los efectos, sin cómputo de ese periodo.",
        "Pasa a situación de alta presunta o de pleno derecho únicamente para accidentes de trabajo."
      ],
      "c": 1,
      "correctas": [
        1
      ],
      "multiple": false,
      "respuestas": 0,
      "law": "En virtud del artículo 36.1 del Real Decreto 84/1996, de 26 de enero, y el artículo 166.1 del TRLGSS (RDL 8/2015), la excedencia forzosa para el desempeño de un cargo público representativo se equipara a la situación asimilada al alta, permitiendo conservar determinados derechos de protección en el sistema de la Seguridad Social.",
      "tip": ""
    },
    {
      "bloqueId": "B2",
      "statementId": null,
      "factIds": [],
      "tag": "Caso Práctico 20: Efectos del alta previa en caso de no iniciación del trabajo",
      "q": "\u003cspan class=\"al-j\">La empresa \u003ci>CutreHosteles S.A. \u003c/i>tramita el alta previa del trabajador Gabriel el día 10 de marzo con fecha de inicio prevista para el 15 de marzo. Sin embargo, por razones personales, Gabriel notifica el día 14 de marzo que renuncia al empleo y no llega a presentarse ni a trabajar un solo día. \u003cb>¿Qué trámite debe realizar la empresa sobre ese alta previa?\u003c/b>\u003c/span>",
      "a": [
        "Dejar sin efecto la solicitud de alta previa comunicando el no inicio de la prestación de servicios.",
        "Tramitar una baja voluntaria el día 15 de marzo computando al menos un día de cotización.",
        "El alta surte efectos de forma irrevocable por haber sido presentada dentro de plazo.",
        "Solicitar la transformación del alta en un convenio especial provisional."
      ],
      "c": 0,
      "correctas": [
        0
      ],
      "multiple": false,
      "respuestas": 0,
      "law": "\u003cspan class=\"al-j\">Según lo dispuesto en el artículo 32.3.1.º y artículo 35.2 del Real Decreto 84/1996, de 26 de enero, si la prestación de servicios no llega a iniciarse, la comunicación de alta previa carece de valor y el sujeto obligado debe solicitar formalmente dejar sin efecto dicha alta declarando que la actividad no ha comenzado.\u003c/span>",
      "tip": ""
    },
    {
      "bloqueId": "B2",
      "statementId": null,
      "factIds": [],
      "tag": "Caso Práctico 21: Requisito de cotización previa en el Convenio Especial Ordinario",
      "q": "\u003cspan class=\"al-j\">Marcos, de 52 años de edad, agota su prestación por desempleo y queda sin cobertura en el Régimen General. Desea suscribir un Convenio Especial ordinario con la Seguridad Social para seguir cotizando de cara a su futura jubilación. \u003cb>¿Qué requisito de cotización previa debe acreditar?\u003c/b>\u003c/span>",
      "a": [
        "Haber cotizado al menos 1.080 días en los 12 años inmediatamente anteriores a la baja en el régimen.",
        "Acreditar 500 días cotizados en los últimos 5 años naturales.",
        "No se exige período de cotización previa si el trabajador tiene más de 50 años.",
        "Tener cubierto un período mínimo de 15 años de cotización a lo largo de toda su vida laboral."
      ],
      "c": 0,
      "correctas": [
        0
      ],
      "multiple": false,
      "respuestas": 0,
      "law": "\u003cspan class=\"al-j\">El artículo 2.1.a) de la Orden TAS/2865/2003, de 13 de octubre, establece como requisito imprescindible para suscribir el convenio especial ordinario tener cubierto un período mínimo de cotización de 1.080 días dentro de los 12 años inmediatamente anteriores a la baja en el régimen de la Seguridad Social aplicable.\u003c/span>",
      "tip": ""
    },
    {
      "bloqueId": "B2",
      "statementId": null,
      "factIds": [],
      "tag": "Caso Práctico 22: Efectos del Convenio Especial según la fecha de solicitud (superior a 90 días)",
      "q": "\u003cspan class=\"al-j\">Sofía causa baja en la Seguridad Social el 15 de enero. Tras valorarlo detenidamente, decide solicitar la suscripción del Convenio Especial el día 10 de junio del mismo año (transcurridos más de 90 días naturales desde la baja).\u003cb> ¿A partir de qué fecha producirá efectos el convenio?\u003c/b>\u003c/span>",
      "a": [
        "Retrotraerá sus efectos obligatoriamente al día siguiente de la baja (16 de enero).",
        "Producirá efectos desde la fecha de presentación de la solicitud (10 de junio).",
        "Surtirá efectos desde el 1 de enero del año natural siguiente.",
        "La solicitud será denegada por haber transcurrido el plazo máximo impositivo de 90 días."
      ],
      "c": 1,
      "correctas": [
        1
      ],
      "multiple": false,
      "respuestas": 0,
      "law": "De acuerdo con el artículo 5.2 de la Orden TAS/2865/2003, de 13 de octubre, si la solicitud del convenio especial se presenta transcurridos los 90 días naturales siguientes a la baja en la Seguridad Social, el convenio surtirá efectos desde la fecha de presentación de la solicitud.",
      "tip": ""
    },
    {
      "bloqueId": "B2",
      "statementId": null,
      "factIds": [],
      "tag": "Caso Práctico 23: Acción protectora delimitada por el Convenio Especial",
      "q": "\u003cspan class=\"al-j\">Fernando formaliza un Convenio Especial ordinario con la Tesorería General de la Seguridad Social tras haber cesado en su último trabajo por cuenta ajena. \u003cb>¿Qué contingencias quedan protegidas mediante las cuotas que abonará en virtud de este convenio?\u003c/b>\u003c/span>",
      "a": [
        "Exclusivamente la prestación por desempleo y los accidentes de trabajo.",
        "Las prestaciones correspondientes a incapacidad permanente, jubilación y muerte y supervivencia, derivadas de contingencias comunes.",
        "Única y exclusivamente la pensión de jubilación en su modalidad contributiva.",
        "Todas las contingencias del sistema, incluidas la incapacidad temporal y la asistencia sanitaria."
      ],
      "c": 1,
      "correctas": [
        1
      ],
      "multiple": false,
      "respuestas": 2,
      "law": "\u003cspan class=\"al-j\">Conforme al artículo 1.2 de la Orden TAS/2865/2003, de 13 de octubre, la cobertura del convenio especial tiene por objeto la protección de las prestaciones por incapacidad permanente, jubilación, y muerte y supervivencia, derivadas de contingencias comunes.\u003c/span>",
      "tip": ""
    },
    {
      "bloqueId": "B2",
      "statementId": null,
      "factIds": [],
      "tag": "Caso Práctico 24: Elección de la base de cotización en el Convenio Especial",
      "q": "\u003cspan class=\"al-j\">Laura tramita su Convenio Especial tras haber cesado en una empresa donde cotizaba por la base máxima. A la hora de elegir la base por la que cotizará en el convenio, \u003cb>¿cuál de las siguientes opciones \u003cu>NO\u003c/u> está permitida por la normativa?\u003c/b>\u003c/span>",
      "a": [
        "La base máxima del grupo de cotización en el que hubiera estado encuadrada.",
        "El promedio de las bases de cotización de los últimos 12 meses anteriores a la baja.",
        "Una base elegida libremente que resulte inferior a la base mínima de cotización vigente en el régimen.",
        "La base mínima de cotización vigente en el régimen aplicable."
      ],
      "c": 2,
      "correctas": [
        2
      ],
      "multiple": false,
      "respuestas": 0,
      "law": "\u003cspan class=\"al-j\">Según el artículo 6.1 de la Orden TAS/2865/2003, de 13 de octubre, el interesado puede elegir su base de cotización entre la máxima del grupo, el promedio de los 12 meses anteriores o la mínima del régimen, pero en ningún caso la base elegida podrá ser inferior a la base mínima de cotización vigente en el Régimen de que se trate.\u003c/span>",
      "tip": ""
    },
    {
      "bloqueId": "B2",
      "statementId": null,
      "factIds": [],
      "tag": "Caso Práctico 25: Extinción del Convenio Especial por concesión de pensión",
      "q": "\u003cspan class=\"al-j\">Javier mantiene suscrito un convenio especial desde hace cuatro años. Al alcanzar la edad legal establecida, solicita su jubilación y la entidad gestora le reconoce la correspondiente pensión contributiva de jubilación. \u003cb>¿Qué sucede con el convenio especial que tenía suscrito?\u003c/b>\u003c/span>",
      "a": [
        "Se extingue automáticamente por adquirir la condición de pensionista de jubilación.",
        "Queda en suspenso pudiendo reactivarse si vuelve a cotizar en el futuro.",
        "Continúa vigente obligatoriamente si el importe de la pensión es inferior al salario mínimo.",
        "Debe cancelarse mediante penalización equivalente a tres mensualidades de cuotas."
      ],
      "c": 0,
      "correctas": [
        0
      ],
      "multiple": false,
      "respuestas": 0,
      "law": "\u003cspan class=\"al-j\">En virtud del artículo 10.2.a) de la Orden TAS/2865/2003, de 13 de octubre, el convenio especial se extingue, entre otras causas tasadas, por adquirir el suscriptor la condición de pensionista de jubilación o de incapacidad permanente en cualquiera de los regímenes del sistema de la Seguridad Social.\u003c/span>",
      "tip": ""
    },
    {
      "bloqueId": "B3",
      "statementId": null,
      "factIds": [],
      "tag": "Caso Práctico 26: Desempleo total contributivo y subsidiado",
      "q": "\u003cspan class=\"al-j\">Carla finaliza su contrato de trabajo por cuenta ajena y solicita la prestación contributiva por desempleo, la cual se le concede por un período de 12 meses. Finalizada esta, pasa a percibir el subsidio por desempleo para mayores de 52 años.\u003cb> ¿En qué situación se encuentra Carla ante la Seguridad Social mientras percibe estas prestaciones y subsidios por desempleo?\u003c/b>\u003c/span>",
      "a": [
        "Se encuentra en situación de baja absoluta, extinguiéndose su vinculación con el sistema.",
        "Permanece en situación asimilada al alta, manteniéndose la obligación de cotizar a cargo de la entidad gestora o del propio trabajador según la modalidad.",
        "Pasa a situación de alta real ordinaria como trabajadora por cuenta propia.",
        "Permanece en situación de alta especial con suspensión de cotizaciones."
      ],
      "c": 1,
      "correctas": [
        1
      ],
      "multiple": false,
      "respuestas": 0,
      "law": "Conforme al artículo 36.1.a) del Real Decreto 84/1996, de 26 de enero, y el artículo 166.1 del TRLGSS (RDL 8/2015), la situación de desempleo total y legalmente determinado, mientras el trabajador perciba prestación contributiva o subsidio por desempleo, se considera situación asimilada al alta.",
      "tip": ""
    },
    {
      "bloqueId": "B3",
      "statementId": null,
      "factIds": [],
      "tag": "Caso Práctico 27: Traslado de trabajadores por la empresa fuera del territorio nacional",
      "q": "\u003cspan class=\"al-j\">La empresa de ingeniería \u003ci>Obras Globales, S.A\u003c/i>. destina a uno de sus ingenieros, Javier, a una obra en un país extranjero que no tiene suscrito convenio bilateral de Seguridad Social con España. El traslado de Javier tendrá una duración estimada de dos años. \u003cb>¿Qué situación administrativa mantiene Javier en el sistema español de la Seguridad Social durante su desplazamiento?\u003c/b>\u003c/span>",
      "a": [
        "Causa baja automática en el Régimen General español al prestar servicios fuera del territorio nacional.",
        "Se le mantiene en situación asimilada al alta en el Régimen General español durante el período de traslado.",
        "Pasa a situación de alta de pleno derecho o presunta sin obligación de cotizar.",
        "Debe suscribir obligatoriamente un Convenio Especial privado con una entidad aseguradora privada."
      ],
      "c": 1,
      "correctas": [
        1
      ],
      "multiple": false,
      "respuestas": 0,
      "law": "De acuerdo con el artículo 36.1.d) del Real Decreto 84/1996, de 26 de enero, el traslado de trabajadores por parte de sus empresas fuera del territorio nacional se considera situación asimilada al alta en el Régimen General de la Seguridad Social, manteniendo la empresa la obligación de cotizar.",
      "tip": ""
    },
    {
      "bloqueId": "B3",
      "statementId": null,
      "factIds": [],
      "tag": "Caso Práctico 28: Excedencia por cuidado de hijos y familiares",
      "q": "\u003cspan class=\"al-j\">Elena, trabajadora en plantilla de un centro comercial, solicita a su empresa una excedencia por cuidado de su hijo menor de 3 años, suspensión que se extiende durante un año completo. \u003cb>¿Cómo se califica la situación de Elena frente a la Seguridad Social durante este período de excedencia?\u003c/b>\u003c/span>",
      "a": [
        "Causa baja definitiva a todos los efectos, sin consideración de cotizaciones ni asimilación.",
        "Se encuentra en situación asimilada al alta, computándose además dicho período como efectivamente cotizado a efectos de las prestaciones que determine la ley.",
        "Pasa automáticamente a situación de alta especial por huelga o cierre patronal.",
        "Requiere la firma de un documento de adhesión con una Mutua para mantener la cobertura."
      ],
      "c": 1,
      "correctas": [
        1
      ],
      "multiple": false,
      "respuestas": 0,
      "law": "\u003cspan class=\"al-j\">El artículo 36.1.c) del Real Decreto 84/1996, de 26 de enero, en combinación con el artículo 237 del TRLGSS (RDL 8/2015), establece que los períodos de excedencia por cuidado de hijos o familiares con reserva de puesto de trabajo se consideran situaciones asimiladas al alta, reconociéndose además la consideración de período de cotización efectiva para determinadas prestaciones.\u003c/span>",
      "tip": ""
    },
    {
      "bloqueId": "B3",
