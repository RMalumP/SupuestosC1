        Versión del MOTOR de la plantilla (el código que hace funcionar la
        página, no los datos del supuesto). El editor de Python la compara
        con la suya y, si el archivo se quedó atrás, ofrece ponerlo al día
        al guardar. Subir este número al cambiar el motor.
    -->
    <meta name="motor-plantilla" content="10">
    <title>[TÍTULO DE LA EVALUACIÓN]</title>
    <link rel="stylesheet" href="../fuentes/fuentes.css">

    <link rel="stylesheet" href="../css/base-supuesto.css">

<body>

<!-- NAVEGACIÓN -->
<nav id="nav-header">
    <div id="nav-boxes"></div>

    <!-- Contador «pregunta actual / total» y respondidas (se rellena solo) -->
    <div id="nav-contador" aria-live="off"><span id="nav-actual">1/1</span><small id="nav-respondidas"></small></div>

    <button id="fold-btn" class="home-btn" onclick="togglePlegado()"
            title="Plegar: ver solo el bloque actual" aria-label="Plegar bloques"
            style="display:none;">⌃</button>

    <button id="home-btn-top" class="home-btn" onclick="goHome()"
            title="Volver al menú principal" aria-label="Volver al menú principal">🏠</button>

    <div class="settings-wrap">
        <button id="settings-toggle" onclick="toggleSettings()" title="Configuración del temporizador" aria-label="Configuración" aria-expanded="false" aria-controls="settings-panel">⚙</button>
        <div id="settings-panel">
            <div class="settings-title" id="settings-title">Configuración</div>
            <div class="settings-row" id="row-tiempo">
                <label for="time-input"><span id="lbl-tiempo">Duración del examen (mm:ss)</span></label>
                <div class="time-edit-line">
                    <input type="text" id="time-input" placeholder="30:00">
                    <button class="btn-mini" onclick="applyTimer()">Aplicar</button>
                </div>
            </div>
            <div class="settings-row settings-check" id="row-corregir">
                <label>
                    <input type="checkbox" id="instant-feedback-toggle" onchange="toggleInstantFeedback(this.checked)">
                    <span id="lbl-corregir">Corregir pregunta a pregunta</span>
                </label>
            </div>
            <!--
                UNA CASILLA POR BLOQUE. El examen puede tener un bloque o
                cinco, así que estas casillas las crea sola la página al
                arrancar (ver montarOpcionesUnaEnUna): una por cada bloque
                que salga en el intento y que no esté marcado como oculto
                en el editor. Sin marcar = ese bloque se ve EN CADENA.
            -->
            <div class="settings-row" id="row-una">
                <label><span id="lbl-una">Ver las preguntas de una en una</span></label>
                <div id="una-por-bloque"></div>
            </div>
            <div class="settings-row settings-check settings-sub" id="row-foco">
                <label>
                    <input type="checkbox" id="foco-toggle" onchange="toggleModoFoco(this.checked)">
                    <span id="lbl-foco">Modo foco: solo los hechos de cada pregunta</span>
                </label>
            </div>
            <div class="settings-row settings-check" id="row-qtags">
                <label>
                    <input type="checkbox" id="hide-qtags-toggle" onchange="toggleHideQTags(this.checked)">
                    <span id="lbl-qtags">Ocultar etiquetas de pregunta (q-tag)</span>
                </label>
            </div>
        </div>
    </div>
</nav>

<!-- TEMPORIZADOR -->
<div id="timer" onclick="toggleTimerPause()" title="Clic para pausar / reanudar" role="button" tabindex="0" aria-label="Tiempo restante. Pulsa para pausar o reanudar">
    <span class="timer-label">TIEMPO RESTANTE</span>
    <span id="timer-display">30:00</span>
</div>

<!-- ══════════════════════════════════════════
     CONTENIDO PRINCIPAL
══════════════════════════════════════════ -->
<div class="container">

    <!--
        Título, referencia, ámbito y minutos NO se editan aquí: se rellenan
        automáticamente en el arranque a partir de EXAM_CONFIG (al principio
        de la ZONA EDITABLE del bloque de JavaScript, al final de la
        página). El nº de preguntas se calcula solo, contando
        QUESTIONS_BANK. Así solo hay un sitio donde tocar
        estos datos y nunca queda desactualizado un lugar y otro no.
    -->

    <!-- Título para impresión -->
    <div id="print-title" style="text-align:center; margin-bottom:24px; font-family:'Playfair Display',serif;">
        <h1 id="print-title-h1" style="font-size:1.4rem; color:#3d2a20;"></h1>
        <p id="print-title-sub" style="font-size:0.85rem; color:#555; margin-top:4px;"></p>
        <p id="print-fecha" style="font-size:0.8rem; color:#777; margin-top:4px;"></p>
    </div>

    <!-- CABECERA INSTITUCIONAL -->
    <header class="inst-header">
        <img id="inst-logo" class="logo-img" src="" alt="">
        <div class="organismo" id="inst-organismo"></div>
        <h1 id="inst-title"></h1>
        <div class="meta-strip">
            <span class="meta-pill" id="meta-preguntas"></span>
            <span class="meta-pill" id="meta-minutos"></span>
            <span class="meta-pill" id="meta-legislacion"></span>
            <span class="meta-pill" id="meta-referencia"></span>
        </div>
    </header>

    <!--
        ENUNCIADOS
        ──────────
        Ya no hay un panel fijo de enunciado encima de la página: cada
        enunciado se pinta DENTRO del hilo de preguntas (#quiz-container),
        justo delante del grupo de preguntas al que pertenece y debajo de
        la cabecera de su bloque. Así el documento se lee en su orden
        natural: cabecera del bloque → enunciado 1 → sus preguntas →
        enunciado 2 → sus preguntas…

        Cada pregunta de QUESTIONS_BANK indica a qué enunciado pertenece
        mediante "statementId"; una pregunta con statementId null/ausente es
        una "pregunta suelta" y no muestra ningún bloque de hechos.

        Estructura disponible dentro de cada enunciado (ver STATEMENTS_BANK):
        - factBlocks[]  → bloques de hechos (borde dorado; "red:true" = borde rojo/crítico)
                          cada uno con su "id" (H1, H2…) para poder vincularle preguntas
        - timeline[]    → hitos de la línea de tiempo ("red:true" = hito crítico)
        - "hidden:true" en cualquier factBlock/hito lo omite del renderizado
          (útil para preparar variantes de un mismo supuesto sin borrar datos).

        Cada pregunta puede además vincularse a uno o varios bloques de
        hechos concretos con "factIds": en el MODO FOCO (⚙, dentro de «ver
        las preguntas de una en una») el enunciado se recorta a esos hechos.
    -->

    <!-- BARRA DE PROGRESO -->
    <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>

    <!-- PREGUNTAS -->
    <div id="quiz-container"></div>

    <!-- BOTONERA -->
    <div class="btn-zone" id="btn-zone">
        <button id="prev-btn" class="btn btn-primary" onclick="move(-1)">← Anterior</button>
        <button id="next-btn" class="btn btn-primary" onclick="move(1)">Siguiente →</button>
        <button id="check-btn"   class="btn btn-danger"   onclick="evaluateExam()">✓ Corregir Expediente</button>
        <button id="print-btn"   class="btn btn-success"  onclick="printResults()">🖨 Imprimir / PDF</button>
        <button id="restart-btn" class="btn btn-info"     onclick="openRandomModal()">🔀 Nuevo Intento (Aleatorio)</button>
        <button id="send-btn"    class="btn btn-send"     onclick="enviarResultados()">📤 Enviar Resultados</button>
        <button id="home-btn-bottom" class="btn btn-info" style="display:none;" onclick="goHome()">🏠 Volver al Menú Principal</button>
        <!-- Solo en el móvil y tras corregir: abre las demás acciones en una hoja desde abajo -->
        <button id="more-btn" class="btn btn-info" type="button" onclick="toggleMasAcciones()" aria-expanded="false" aria-controls="btn-zone">⋯ Más</button>
    </div>
</div>

     ──────────────────────────────────────────
     Este bloque JSON es lo ÚNICO que hay que cambiar para crear un
     supuesto nuevo, y lo edita automáticamente el programa Python
     "editor_supuestos.py" (interfaz gráfica). No hace falta tocarlo

       · los textos van entre comillas dobles "así"
       · las comillas dobles DENTRO de un texto se escriben \"
       · true / false / null se escriben en minúscula y sin comillas

                    encabezado (logo y organismo)
       tema       → colores de toda la página (fondos, textos, acentos)
       interfaz   → qué botones se ven y cómo se llaman

                    cada bloque de hechos lleva su "id" (H1, H2…)
       preguntas  → cada pregunta, con el bloque al que pertenece y, si
                    procede, los "factIds" de los hechos concretos de los
                    que depende (modo foco del panel ⚙)
══════════════════════════════════════════ -->

      "tag": "Caso Práctico 1: Inscripción inicial y ámbito territorial de la empresa",
      "q": "\u003cspan class=\"al-j\">La sociedad MuchasMultas, S.L., con domicilio en Madrid, va a comenzar sus actividades de transporte de mercancías contratando a sus primeros trabajadores. Tras realizar su inscripción inicial ante la Tesorería General de la Seguridad Social (TGSS) en Madrid, proyecta abrir en los meses siguientes dos nuevos centros de trabajo en Valencia y Sevilla. ¿\u003cb>Debe tramitar una nueva inscripción de empresa al abrir los centros de Valencia y Sevilla?\u003c/b>\u003c/span>",
      "a": [
        "Sí, debe solicitar una nueva inscripción en cada provincia donde abra un centro de trabajo.",
        "No, la inscripción de la empresa es única y válida para todo el territorio del Estado y para toda la vida de la empresa.",
        "No, salvo que las actividades desarrolladas en Valencia y Sevilla pertenezcan a un sector económico distinto.",
        "Sí, debiendo formalizar una inscripción por cada código de cuenta de cotización asignado."
      ],
      "c": 1,
      "correctas": [
        1
      ],
      "multiple": false,
      "respuestas": 0,
      "law": "\u003cspan class=\"al-j\">Conforme al artículo 15.1 del Reglamento General aprobado por el Real Decreto 84/1996, de 26 de enero, la inscripción del empresario es única y válida en los Regímenes del sistema de la Seguridad Social que se determine, para todo el territorio del Estado y para toda la vida de la persona física o jurídica titular de la empresa. Por tanto, la apertura de centros de trabajo en otras provincias no exige una nueva inscripción empresarial.\u003c/span>",
      "tip": ""
    },
    {
      "bloqueId": "B1",
      "statementId": null,
      "factIds": [],
      "tag": "Caso Práctico 2: Asignación de Códigos de Cuenta de Cotización (CCC)",
      "q": "\u003cspan class=\"al-j\">La empresa de calzado ArnedoManda, S.L. se inscribe en la provincia de La Rioja, donde radican sus oficinas centrales. A los dos años, decide abrir una tienda en Vitoria y una instalación lde conservas de alchachofa como actividad secundaria secundaria en la misma provincia de La Rioja \u003cb>¿Cómo gestiona la TGSS los códigos de identificación de esta empresa?\u003c/b>\u003c/span>",
      "a": [
        "Asigna una inscripción y un CCC distinto e independiente para cada una de las tres instalaciones.",
        "Asigna un número único de inscripción que actúa como CCC principal en La Rioja vinculando a este los CCC secundarios de la nueva actividad y de Vitoria.",
        "Mantiene un único CCC para La Rioja y deniega la apertura de cuentas secundarias para Álava.",
        "Exige el cambio del domicilio legal a Alava para mantener unificados los códigos de cotización."
      ],
      "c": 1,
      "correctas": [
        1
      ],
      "multiple": false,
      "respuestas": 0,
      "law": "\u003cspan class=\"al-j\">Según el artículo 13.3 del Real Decreto 84/1996, de 26 de enero, mediante el acto administrativo de inscripción, la TGSS asigna al empresario un número único de inscripción para su individualización, considerado el primer y principal Código de Cuenta de Cotización (CCC). A este se vinculan los demás CCC secundarios que se le asignen en la misma o distinta provincia.\u003c/span>",
      "tip": ""
    },
    {
      "bloqueId": "B1",
      "statementId": null,
      "factIds": [],
      "tag": "Caso Práctico 3: Convenio de asociación frente a convenio de adhesión",
      "q": "\u003cspan class=\"al-j\">Rodolfo es propietario de un taller mecánico e inscribe su empresa contratando \u003cu>a 4 trabajadores por cuenta ajena\u003c/u>. Por su parte, la\u003cu> trabajadora autónoma Elen\u003c/u>a se da de alta en el RETA para ejercer la fontanería por su cuenta. A la hora de formalizar la cobertura de riesgos con una Mutua colaboradora, \u003cb>¿qué documento formaliza cada uno?\u003c/b>\u003c/span>",
      "a": [
        "Tanto Rodolfo para sus trabajadores como Elena para sí misma formalizan un documento de asociación.",
        "Rodolfo formaliza un documento de adhesión para el y sus empleados; y Elena un documento de asociación.",
        "Rodolfo formaliza un documento de asociación para la cobertura de sus empleados, mientras que Elena y el propio Rodolfo formalizan un documento de adhesión para su propia cobertura.",
        "Ambos suscriben un Convenio Especial de cobertura de riesgos profesionales."
      ],
      "c": 2,
      "correctas": [
        2
      ],
      "multiple": false,
      "respuestas": 0,
      "law": "\u003cspan class=\"al-j\">De acuerdo con el artículo 14 del Real Decreto 84/1996, de 26 de enero, y el artículo 83 de la Ley General de la Seguridad Social (TRLGSS, RDL 8/2015), el empresario formaliza un documento de asociación para la protección de los trabajadores a su servicio, mientras que los trabajadores autónomos formalizan un documento de adhesión para su propia cobertura individual.\u003c/span>",
      "tip": ""
    },

      "tag": "Caso Práctico 4: Opción de entidad para la cobertura de contingencias",
      "q": "\u003cspan class=\"al-j\">La mercantil Sin Solución, S.A. acude a la TGSS para solicitar su inscripción de empresa. En la solicitud indica que desea proteger la prestación económica por incapacidad temporal (IT) derivada de contingencias comunes con la Mutua \u003ci>\"MalaMuta S.A.\u003c/i>\", pero mantener la cobertura de accidentes de trabajo y enfermedades profesionales (contingencias profesionales) con la entidad gestora (INSS). \u003cb>¿Es válida esta opción?\u003c/b>\u003c/span>",
      "a": [
        "Sí, el empresario tiene plena libertad para combinar las entidades como desee.",
        "No, porque si se opta por una Mutua para la incapacidad temporal por contingencias comunes, es obligatorio gestionar también las contingencias profesionales con esa misma Mutua.",
        "Sí, siempre que la cifra de trabajadores en plantilla sea inferior a diez.",
        "No, las contingencias comunes deben gestionarse siempre con el INSS y las profesionales con la Mutua."
      ],
      "c": 1,
      "correctas": [
        1
      ],
      "multiple": false,
      "respuestas": 0,
      "law": "\u003cspan class=\"al-j\">El artículo 83 del Texto Refundido de la Ley General de la Seguridad Social (RDL 8/2015) y el artículo 14.2 del Real Decreto 84/1996, en consonancia con el artículo 69 del RD 1993/1995, establecen que si el empresario opta por una Mutua colaboradora para la cobertura de la IT por contingencias comunes, es obligatorio que las contingencias profesionales se gestionen con la misma Mutua (la opción por contingencias comunes arrastra las profesionales).\u003c/span>",
      "tip": ""
    },

      "tag": "Caso Práctico 5: Plazo y antelación en las solicitudes de alta",
      "q": "\u003cspan class=\"al-j\">La empresa SinRumbo, S.L. celebra un contrato de trabajo con Mario para comenzar a prestar servicios el día 1 de noviembre. La empresa quiere planificar los trámites administrativos con suficiente antelación.\u003cb> ¿En qué plazo y con qué margen máximo debe presentar la solicitud de alta de Mario?\u003c/b>\u003c/span>",
      "a": [
        "Puede presentarla en los 3 días naturales posteriores al 1 de noviembre.",
        "Debe presentarla con carácter previo al inicio de la prestación de servicios, con una antelación máxima de 60 días naturales.",
        "Debe presentarla el mismo día en que el trabajador inicia el trabajo, antes de las 24:00 horas.",
        "Puede presentarla con una antelación máxima de 30 días hábiles antes del inicio de la actividad."

      "c": 1,
      "correctas": [

      "multiple": false,
      "respuestas": 0,
      "law": "\u003cspan class=\"al-j\">Conforme al artículo 32.3.1.º del Real Decreto 84/1996, de 26 de enero, las solicitudes de alta deben presentarse por los sujetos obligados con carácter previo al comienzo de la prestación de servicios, sin que en ningún caso puedan formularse con más de 60 días naturales de antelación al inicio previsto de la actividad.\u003c/span>",
      "tip": ""
    },

      "tag": "Caso Práctico 6: Plazo de comunicación de bajas y variaciones de datos del trabajador en alta",
      "q": "\u003cspan class=\"al-j\">La trabajadora Carmen cesa voluntariamente en su empresa el viernes 10 de octubre. Asimismo, en esa misma fecha, otro trabajador de la plantilla cambia su modalidad contractual de contrato temporal a indefinido. \u003cb>¿De qué plazo dispone la empresa para comunicar a la TGSS la baja de Carmen y la variación contractual?\u003c/b>\u003c/span>",
      "a": [
        "Dispone de 3 días naturales siguientes a la fecha del cese o variación.",

      "multiple": false,

      "tag": "Caso Práctico 9: Preaviso en el cambio de entidad colaboradora por la empresa",
      "q": "\u003cspan class=\"al-j\">Una empresa inscrita decide cambiar la Mutua colaboradora con la que tiene cubierta la protección de contingencias profesionales y la prestación de IT común. \u003cb>¿Con qué antelación respecto a su efectividad debe presentar la declaración de la nueva opción y el cese de la anterior a la TGSS?\u003c/b>\u003c/span>",

      "tag": "Caso Práctico 10: Efectos del alta solicitada fuera de plazo",
      "q": "\u003cspan class=\"al-j\">La empresa \u003ci>ConstruccionesPladur S.A. \u003c/i>contrata a un operario que comienza a trabajar efectivamente el día 1 de septiembre. Sin embargo, por un olvido administrativo, la empresa no presenta la solicitud de alta hasta el día 20 de septiembre. \u003cb>¿Desde qué fecha surte efectos el alta y desde cuándo existe la obligación de cotizar?\u003c/b>\u003c/span>",

      "q": "\u003cspan class=\"al-j\">Un trabajador por cuenta ajena sufre un accidente laboral grave en su primer día de trabajo. La empresa no había comunicado previamente su alta en la Seguridad Social. ¿\u003cb>Se encuentra protegido el trabajador ante esta contingencia profesional?\u003c/b>\u003c/span>",
