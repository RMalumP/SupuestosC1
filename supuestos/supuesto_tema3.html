    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <script src="../js/prefs.js"></script>

    <!--
        Versión del MOTOR de la plantilla (el código que hace funcionar la
        página, no los datos del supuesto). El editor de Python la compara
        con la suya y, si el archivo se quedó atrás, ofrece ponerlo al día
        al guardar. Subir este número al cambiar el motor.
    -->
    <meta name="motor-plantilla" content="10">
    <title>[TÍTULO DE LA EVALUACIÓN]</title>
    <link rel="stylesheet" href="../fuentes/fuentes.css">

    <link rel="stylesheet" href="../css/base-supuesto.css">
    <style>
        /* Solo lo propio de esta versión del motor: lo común a todos los supuestos
           está en ../css/base-supuesto.css y el diseño en ../css/tema-supuesto.css. */

        /* Cabecera plegada: la fila del bloque actual ocupa UNA sola línea, por
           largo que sea el bloque; las casillas que no caben se alcanzan deslizando
           la fila. Al cambiar de pregunta, la activa se centra sola
           (ver centrarCasillaActiva). */
        body.nav-plegada .nav-row.fila-actual .nav-row-boxes {
            flex-wrap: nowrap;
            overflow-x: auto; overflow-y: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(var(--gold-rgb),0.45) transparent;
            padding-bottom: 4px;
        }
        body.nav-plegada .nav-row.fila-actual .nav-row-boxes::-webkit-scrollbar { height: 5px; }
        body.nav-plegada .nav-row.fila-actual .nav-row-boxes::-webkit-scrollbar-track { background: transparent; }
        body.nav-plegada .nav-row.fila-actual .nav-row-boxes::-webkit-scrollbar-thumb {
            background: rgba(var(--gold-rgb),0.45); border-radius: 3px;
        }
        /* Sin esto las casillas se encogerían hasta deformarse al no caber */
        body.nav-plegada .nav-row.fila-actual .nav-box { flex: 0 0 auto; }

        /* ── FORMATO DEL TEXTO ────────────────────────────────────────
           Negrita, cursiva, subrayado, tachado, resaltado y tamaños de
           letra que se pueden usar dentro de cualquier texto del supuesto
           (narración de los hechos, hitos, preguntas, respuestas,
           motivación legal y consejo). Las escribe el editor de Python
           con sus botones, pero también valen escritas a mano:

               <b>negrita</b>   <i>cursiva</i>   <u>subrayado</u>
               <s>tachado</s>   <mark>resaltado</mark>
               <mark class="mk-verde">resaltado en verde</mark>
               <span class="fs-l">letra más grande</span>
        ─────────────────────────────────────────────────────────────── */
        b, strong { font-weight: 700; }
        i, em     { font-style: italic; }
        u         { text-decoration: underline; text-underline-offset: 2px; }
        s, del, strike { text-decoration: line-through; }

        /* Rotulador. El color de la letra se fija a oscuro porque hay
           sitios (la cronología, las opciones marcadas) donde el texto es
           claro y sobre el resaltado no se leería. */
        mark { background: #ffe9a8; color: #1f2937; padding: 0 3px; border-radius: 3px;
               box-decoration-break: clone; -webkit-box-decoration-break: clone; }
        mark.mk-verde { background: #c9f0d2; }
        mark.mk-azul  { background: #cfe4fb; }
        mark.mk-rosa  { background: #fbd0e2; }

        /* Tamaños de letra, relativos al texto que los rodea: así una
           pregunta y un párrafo del enunciado guardan su proporción. */
        .fs-xs  { font-size: 0.75em; }
        .fs-s   { font-size: 0.875em; }
        .fs-m   { font-size: 1em; }
        .fs-l   { font-size: 1.15em; }
        .fs-xl  { font-size: 1.35em; }
        .fs-xxl { font-size: 1.6em; }

        /* ── PÁRRAFOS Y JUSTIFICADO ───────────────────────────────────
           Los saltos de línea (Enter) que se escriben en el editor se
           respetan en la página: sin esto el navegador los trata como un
           espacio y junta todo el texto en un solo párrafo.
           pre-line conserva los saltos pero sigue colapsando los espacios
           repetidos, así que el resto del texto se ve igual que antes. */
        .q-text, .statement p, .feedback-body p, .feedback-body .tip,
        .tl-item, .ci-q, .ci-law, .ci-tip, .option > span:last-child { white-space: pre-line; }

        /* Justificado: ajusta el párrafo al ancho de la línea. Lo escribe
           el editor con el botón «Just.»:  <span class="al-j">…</span>
           (la última línea de cada párrafo queda alineada a la izquierda,
           como en cualquier procesador de textos). Es un span en bloque y
           no un div para que sea válido también dentro de un <p>. */
        .al-j { display: block; text-align: justify; text-justify: inter-word; }
        /* En la lista de respuestas de la corrección va en línea, para que
           «A)» no quede solo en una línea y el texto debajo. */
        .ci-answers .al-j { display: inline; text-align: inherit; }

        /* ── SANGRÍA ──────────────────────────────────────────────────
           Mete un párrafo más hacia dentro que el anterior, hasta tres
           niveles. La escribe el editor con los botones «Sang+» y
           «Sang-» (o con Tab y Mayús+Tab):
               <span class="sg-1">…</span>   (sg-2, sg-3: más adentro)
           Puede ir junto al justificado:  class="al-j sg-1" */
        .sg-1 { display: block; margin-left: 1.5em; }
        .sg-2 { display: block; margin-left: 3em; }
        .sg-3 { display: block; margin-left: 4.5em; }
        .ci-answers .sg-1, .ci-answers .sg-2, .ci-answers .sg-3 { display: inline; margin-left: 0; }

        /* ── TIPOGRAFÍAS ──────────────────────────────────────────────
           Se eligen en el editor con el menú «Fuente». Las tres últimas
           ya se cargan arriba desde Google Fonts; cada una lleva una
           fuente de reserva por si no hubiera conexión. */
        .ff-sans   { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
        .ff-titulo { font-family: 'Playfair Display', Georgia, serif; }
        .ff-mono   { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 0.9em; }
        .ff-mano   { font-family: 'Caveat', 'Segoe Script', cursive; font-size: 1.2em; }

        @media print {
            body { background: white !important; color: black !important; }
            #nav-header, #timer, #overlay, #random-modal, .btn-zone, body::before { display:none !important; }
            .container { max-width:100%; padding:20px; }
            .statement { box-shadow:none; border:1px solid #ccc; }
            .question-card { display:block !important; box-shadow:none; border:1px solid #ccc; page-break-inside:avoid; margin-bottom:16px; }
            .block-header { display:flex !important; box-shadow:none; border:1px solid #ccc; page-break-after:avoid; }
            .stmt-panel { display:block !important; page-break-after:avoid; }
            .stmt-foco { display:none !important; }
            .block-header h3 { color:#000 !important; }
            .score-bloques .sb-fila { background:#f3f4f6 !important; }
            .score-bloques .sb-nombre, .score-bloques .sb-detalle, .score-bloques .sb-puntos { color:#111827 !important; }
            .question-card::before { display:none; }
            .feedback { display:block !important; }
            .inst-header { background:#f0f0f0 !important; color:black !important; }
            .inst-header h1, .inst-header .organismo { color:black !important; }
            .inst-header::before { display:none; }
            .progress-bar-wrap { display:none; }
            .fact-block { border-left-color:#999; }
            /* El resaltado tiene que salir también en el PDF: por
               defecto el navegador quita los fondos al imprimir. */
            mark { -webkit-print-color-adjust: exact; print-color-adjust: exact;
                   background:#ffe9a8 !important; color:#1f2937 !important; }
            mark.mk-verde { background:#c9f0d2 !important; }
            mark.mk-azul  { background:#cfe4fb !important; }
            mark.mk-rosa  { background:#fbd0e2 !important; }
            .timeline { display:none; }
            .option { border-color:#ccc; color:black !important; background:white !important; }
            .option.correct { background:#e6f4ea !important; border-color:#2d8c5a !important; color:#1a4731 !important; }
            .option.wrong   { background:#fde8e8 !important; border-color:#8b1a1a !important; color:#8b1a1a !important; }
            .option.selected:not(.correct):not(.wrong) { background:#f0f4ff !important; border-color:#3b5bdb !important; }
            .feedback-body { background:#fafafa !important; }
            .feedback-body .tip { background:#e9f5ee !important; color:#1a4731 !important; }
            .q-num { color:#ddd !important; }
            #print-title { display:block !important; }
        }

        
    </style>
    <link rel="stylesheet" href="../css/tema-supuesto.css">
    <link rel="stylesheet" href="../css/subrayado.css">
</head>
<body>

<!-- NAVEGACIÓN -->
<nav id="nav-header">
    <div id="nav-boxes"></div>

    <!-- Contador «pregunta actual / total» y respondidas (se rellena solo) -->
    <div id="nav-contador" aria-live="off"><span id="nav-actual">1/1</span><small id="nav-respondidas"></small></div>

    <button id="fold-btn" class="home-btn" onclick="togglePlegado()"
            title="Plegar: ver solo el bloque actual" aria-label="Plegar bloques"
            style="display:none;">⌃</button>

    <button id="home-btn-top" class="home-btn" onclick="goHome()"
            title="Volver al menú principal" aria-label="Volver al menú principal">🏠</button>

    <div class="settings-wrap">
        <button id="settings-toggle" onclick="toggleSettings()" title="Configuración del temporizador" aria-label="Configuración" aria-expanded="false" aria-controls="settings-panel">⚙</button>
        <div id="settings-panel">
            <div class="settings-title" id="settings-title">Configuración</div>
            <div class="settings-row" id="row-tiempo">
                <label for="time-input"><span id="lbl-tiempo">Duración del examen (mm:ss)</span></label>
                <div class="time-edit-line">
                    <input type="text" id="time-input" placeholder="30:00">
                    <button class="btn-mini" onclick="applyTimer()">Aplicar</button>
                </div>
            </div>
            <div class="settings-row settings-check" id="row-corregir">
                <label>
                    <input type="checkbox" id="instant-feedback-toggle" onchange="toggleInstantFeedback(this.checked)">
                    <span id="lbl-corregir">Corregir pregunta a pregunta</span>
                </label>
            </div>
            <!--
                UNA CASILLA POR BLOQUE. El examen puede tener un bloque o
                cinco, así que estas casillas las crea sola la página al
                arrancar (ver montarOpcionesUnaEnUna): una por cada bloque
                que salga en el intento y que no esté marcado como oculto
                en el editor. Sin marcar = ese bloque se ve EN CADENA.
            -->
            <div class="settings-row" id="row-una">
                <label><span id="lbl-una">Ver las preguntas de una en una</span></label>
                <div id="una-por-bloque"></div>
            </div>
            <div class="settings-row settings-check settings-sub" id="row-foco">
                <label>
                    <input type="checkbox" id="foco-toggle" onchange="toggleModoFoco(this.checked)">
                    <span id="lbl-foco">Modo foco: solo los hechos de cada pregunta</span>
                </label>
            </div>
            <div class="settings-row settings-check" id="row-qtags">
                <label>
                    <input type="checkbox" id="hide-qtags-toggle" onchange="toggleHideQTags(this.checked)">
                    <span id="lbl-qtags">Ocultar etiquetas de pregunta (q-tag)</span>
                </label>
            </div>
        </div>
    </div>
</nav>

<!-- TEMPORIZADOR -->
<div id="timer" onclick="toggleTimerPause()" title="Clic para pausar / reanudar" role="button" tabindex="0" aria-label="Tiempo restante. Pulsa para pausar o reanudar">
    <span class="timer-label">TIEMPO RESTANTE</span>
    <span id="timer-display">30:00</span>
</div>

<!-- ══════════════════════════════════════════
     CONTENIDO PRINCIPAL
══════════════════════════════════════════ -->
<div class="container">

    <!--
        Título, referencia, ámbito y minutos NO se editan aquí: se rellenan
        automáticamente en el arranque a partir de EXAM_CONFIG (al principio
        de la ZONA EDITABLE del bloque de JavaScript, al final de la
        página). El nº de preguntas se calcula solo, contando
        QUESTIONS_BANK. Así solo hay un sitio donde tocar
        estos datos y nunca queda desactualizado un lugar y otro no.
    -->

    <!-- Título para impresión -->
    <div id="print-title" style="text-align:center; margin-bottom:24px; font-family:'Playfair Display',serif;">
        <h1 id="print-title-h1" style="font-size:1.4rem; color:#3d2a20;"></h1>
        <p id="print-title-sub" style="font-size:0.85rem; color:#555; margin-top:4px;"></p>
        <p id="print-fecha" style="font-size:0.8rem; color:#777; margin-top:4px;"></p>
    </div>

    <!-- CABECERA INSTITUCIONAL -->
    <header class="inst-header">
        <img id="inst-logo" class="logo-img" src="" alt="">
        <div class="organismo" id="inst-organismo"></div>
        <h1 id="inst-title"></h1>
        <div class="meta-strip">
            <span class="meta-pill" id="meta-preguntas"></span>
            <span class="meta-pill" id="meta-minutos"></span>
            <span class="meta-pill" id="meta-legislacion"></span>
            <span class="meta-pill" id="meta-referencia"></span>
        </div>
    </header>

    <!--
        ENUNCIADOS
        ──────────
        Ya no hay un panel fijo de enunciado encima de la página: cada
        enunciado se pinta DENTRO del hilo de preguntas (#quiz-container),
        justo delante del grupo de preguntas al que pertenece y debajo de
        la cabecera de su bloque. Así el documento se lee en su orden
        natural: cabecera del bloque → enunciado 1 → sus preguntas →
        enunciado 2 → sus preguntas…

        Cada pregunta de QUESTIONS_BANK indica a qué enunciado pertenece
        mediante "statementId"; una pregunta con statementId null/ausente es
        una "pregunta suelta" y no muestra ningún bloque de hechos.

        Estructura disponible dentro de cada enunciado (ver STATEMENTS_BANK):
        - factBlocks[]  → bloques de hechos (borde dorado; "red:true" = borde rojo/crítico)
                          cada uno con su "id" (H1, H2…) para poder vincularle preguntas
        - timeline[]    → hitos de la línea de tiempo ("red:true" = hito crítico)
        - "hidden:true" en cualquier factBlock/hito lo omite del renderizado
          (útil para preparar variantes de un mismo supuesto sin borrar datos).

        Cada pregunta puede además vincularse a uno o varios bloques de
        hechos concretos con "factIds": en el MODO FOCO (⚙, dentro de «ver
        las preguntas de una en una») el enunciado se recorta a esos hechos.
    -->

    <!-- BARRA DE PROGRESO -->
    <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>

    <!-- PREGUNTAS -->
    <div id="quiz-container"></div>

    <!-- BOTONERA -->
    <div class="btn-zone" id="btn-zone">
        <button id="prev-btn" class="btn btn-primary" onclick="move(-1)">← Anterior</button>
        <button id="next-btn" class="btn btn-primary" onclick="move(1)">Siguiente →</button>
        <button id="check-btn"   class="btn btn-danger"   onclick="evaluateExam()">✓ Corregir Expediente</button>
        <button id="print-btn"   class="btn btn-success"  onclick="printResults()">🖨 Imprimir / PDF</button>
        <button id="restart-btn" class="btn btn-info"     onclick="openRandomModal()">🔀 Nuevo Intento (Aleatorio)</button>
        <button id="send-btn"    class="btn btn-send"     onclick="enviarResultados()">📤 Enviar Resultados</button>
        <button id="home-btn-bottom" class="btn btn-info" style="display:none;" onclick="goHome()">🏠 Volver al Menú Principal</button>
        <!-- Solo en el móvil y tras corregir: abre las demás acciones en una hoja desde abajo -->
        <button id="more-btn" class="btn btn-info" type="button" onclick="toggleMasAcciones()" aria-expanded="false" aria-controls="btn-zone">⋯ Más</button>
    </div>
</div>

<!-- ══════════════════════════════════════════
     OVERLAY — TIEMPO AGOTADO + CORRECCIÓN
══════════════════════════════════════════ -->

                <rect x="205" y="145" width="3" height="6" rx="1" fill="#94a3b8"/>

            <!-- GREMLIN cuerpo -->

                <ellipse cx="112" cy="80" rx="28" ry="32" fill="#4ade80"/>

                <ellipse cx="112" cy="85" rx="18" ry="20" fill="#86efac"/>
                <!-- Cabeza -->

                <ellipse cx="88" cy="45" rx="10" ry="16" fill="#4ade80" transform="rotate(-20, 88, 45)"/>

          </svg>
        </div>

        <h1 id="overlay-title">¡TIEMPO AGOTADO!</h1>
        <p class="sub" id="overlay-msg">El tiempo del examen ha concluido. El gremlin ha tirado del cable.<br>A continuación se muestra la corrección completa con motivación legal.</p>

        <!-- Resultado: lo primero que se lee tras el aviso -->

        <!-- Botones en overlay: primero «Ver corrección», el resto debajo -->

            <button class="btn btn-danger" id="ov-corr-btn" style="display:inline-flex;" onclick="showCorrectionPanel()">✓ Ver Corrección Completa</button>

º)Sáb 11 y Dom 12 abr: Sábado/DomingoLun 13 abr: 1 día (44.º)\n\u003cb>\u003cmark>Mar 14 abr: 1 día (45.º día hábil - FECHA LÍMITE)\u003c/mark>.\u003c/b>\n\u003cb>Explicación de las Opciones Incorrectas (Distractores):\u003c/b>\n\u003cu>\u003ci>Opción (27 de marzo de 2026) — INCORRECTA\u003c/i>\u003c/u>\n\u003ci>Motivo del error: Esta\u003c/i> fecha resulta de computar los 45 días como días naturales (de corrido, incluyendo sábados y domingos) a partir del 11 de febrero (18 días en febrero + 27 en marzo = 27 de marzo).\n\u003ci>Regla legal\u003c/i>: Los plazos concedidos a los ciudadanos para trámites de comunicación (como dar un alta previa o comunicar una baja) sí se miden en días naturales, pero el plazo que tiene la Administración (TGSS) para resolver un procedimiento rige por la Ley 39/2015, por lo que se cuenta en días hábiles de lunes a viernes.\n\u003ci>\u003cu>Opción (15 de abril de 2026) — INCORRECTA\u003c/u>\u003c/i>\n\u003ci>Motivo del error: \u003c/i>Esta fecha resulta de incorporar un festivo adicional en el calendario (por ejemplo, descontar el Viernes Santo) o de cometer un error al fijar el dies a quo (empezar a contar el mismo día 10 de febrero en lugar del día siguiente, 11 de febrero).\n\u003ci>Regla legal:\u003c/i> Si la indicación expresa del ejercicio es descontar únicamente sábados y domingos, el 45.º día hábil exacto es el martes 14 de abril.\n\u003ci>\u003cu>Opción (10 de mayo de 2026) — INCORRECTA\u003c/u>\u003c/i>\n\u003ci>Motivo del error:\u003c/i> Esta fecha representa un cómputo de fecha a fecha de 3 meses \u003ci>naturales (del 10 de febrero al 10 de mayo).\nRegla legal:\u003c/i> El plazo de 3 meses está reservado de manera excepcional y exclusiva para la resolución de los procedimientos de Convenio Especial (art. 63.1 del RD 84/1996 y Orden TAS/2865/2003). No es aplicable a las solicitudes ordinarias de altas, bajas, afiliación o inscripción de empresas, cuyo plazo general es de 45 días hábiles.",
