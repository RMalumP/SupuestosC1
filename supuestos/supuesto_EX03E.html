      "law": "Artículo 323. Ámbito de aplicación.\n1. Quedarán comprendidos en este sistema especial los trabajadores por cuenta propia agrarios, mayores de 18 años, que reúnan los requisitos establecidos en el artículo siguiente.\n2. El régimen jurídico de este sistema especial se ajustará a lo dispuesto en este título y en sus normas de aplicación y desarrollo, con las particularidades que en ellos se establezcan.\n\nArtículo 324. Reglas de inclusión.\n1. Quedarán incluidos en este sistema especial los trabajadores a que se refiere el artículo anterior que reúnan los siguientes requisitos:\na) Ser titulares de una explotación agraria y obtener, al menos, el 50 por ciento de su renta total de la realización de actividades agrarias u otras complementarias, siempre que la parte de renta procedente directamente de la actividad agraria realizada en su explotación no sea inferior al 25 por ciento de su renta total y el tiempo de trabajo dedicado a actividades agrarias o complementarias de las mismas, sea superior a la mitad de su tiempo de trabajo total.\nb) Que los rendimientos anuales netos obtenidos de la explotación agraria por cada titular de la misma no superen la cuantía equivalente al 75 por ciento del importe, en cómputo anual, de la base máxima de cotización al Régimen General de la Seguridad Social vigente en el ejercicio en que se proceda a su comprobación.\nc) La realización de labores agrarias de forma personal y directa en tales explotaciones agrarias, aun cuando ocupen trabajadores por cuenta ajena, siempre que no se trate de más de dos trabajadores que coticen con la modalidad de bases mensuales o, de tratarse de trabajadores que coticen con la modalidad de bases diarias, a las que se refiere el artículo 255, que el número total de jornadas reales efectivamente realizadas no supere las quinientas cuarenta y seis en un año, computado desde el 1 de enero al 31 de diciembre de cada año. El número de jornadas reales se reducirá proporcionalmente en función del número de días de alta del trabajador por cuenta propia agrario en este Sistema Especial durante el año natural de que se trate.\nLas limitaciones en la contratación de trabajadores por cuenta ajena a que se refiere el párrafo anterior se entienden aplicables por cada explotación agraria. En el caso de que en la explotación agraria existan dos o más titulares, en alta todos ellos en el Sistema Especial para trabajadores por cuenta propia agrarios del Régimen Especial de los Trabajadores por Cuenta Propia o Autónomos, se añadirá al número de trabajadores o jornales previstos en el párrafo anterior un trabajador más con cotización por bases mensuales, o doscientos setenta y tres jornales al año, en caso de trabajadores con cotización por jornadas reales, por cada titular de la explotación agraria, excluido el primero.\nPara determinar el cumplimiento de los requisitos establecidos en las letras a) y b) se podrá tomar en consideración la media simple de las rentas totales y de los rendimientos anuales netos de los tres ejercicios económicos inmediatamente anteriores a aquel en que se efectúe su comprobación, con la excepción del ejercicio o ejercicios afectados por circunstancias excepcionales tenidas en cuenta en aplicación de la normativa reguladora del Impuesto sobre la Renta de las Personas Físicas, en estos casos se tendrá en cuenta el ejercicio o ejercicios inmediatamente anteriores no afectados por tales circunstancias.\n2. A los efectos previstos en este sistema especial, se entiende por explotación agraria el conjunto de bienes y derechos organizados por su titular en el ejercicio de la actividad agraria, y que constituye en sí misma unidad técnico-económica, pudiendo la persona titular o titulares de la explotación serlo por su condición de propietaria, arrendataria, aparcera, cesionaria u otro concepto análogo, de las fincas o elementos materiales de la respectiva explotación agraria.\nA este respecto se entiende por actividad agraria el conjunto de trabajos que se requiere para la obtención de productos agrícolas, ganaderos y forestales.\nA los efectos previstos en este sistema especial, se considerará actividad agraria la venta directa por parte de la agricultora o agricultor de la producción propia sin transformación o la primera transformación de los mismos cuyo producto final esté incluido en el anexo I del artículo 38 del Tratado de Funcionamiento de la Unión Europea, dentro de los elementos que integren la explotación, en mercados municipales o en lugares que no sean establecimientos comerciales permanentes, considerándose también actividad agraria toda aquella que implique la gestión o la dirección y gerencia de la explotación.\nAsimismo, se considerarán actividades complementarias la participación y presencia de la persona titular, como consecuencia de elección pública, en instituciones de carácter representativo, así como en órganos de representación de carácter sindical, cooperativo o profesional, siempre que estos se hallen vinculados al sector agrario.\nIgualmente tendrán la consideración de actividades complementarias las actividades de transformación de los productos de su explotación y venta directa de los productos transformados, siempre y cuando no sea la primera especificada en el apartado anterior, así como las relacionadas con la conservación del espacio natural y protección del medio ambiente, el turismo rural o agroturismo, al igual que las cinemáticas y artesanales realizadas en su explotación.\n3. La incorporación a este sistema especial afectará, además de al titular de la explotación agraria, a su cónyuge y parientes por consanguinidad o afinidad hasta el tercer grado inclusive que no tengan la consideración de trabajadores por cuenta ajena, siempre que sean mayores de dieciocho años y realicen la actividad agraria de forma personal y directa en la correspondiente explotación familiar.\n4. Los hijos del titular de la explotación agraria, menores de treinta años, aunque convivan con él, podrán ser contratados por aquel como trabajadores por cuenta ajena, en los términos previstos en el artículo 12.\n5. Los interesados, en el momento de solicitar su incorporación al Sistema Especial para Trabajadores por Cuenta Propia Agrarios, deberán presentar declaración justificativa de la acreditación de los requisitos establecidos en los apartados anteriores para la inclusión en el mismo. La validez de dicha inclusión estará condicionada a la posterior comprobación por parte de la Tesorería General de la Seguridad Social de la concurrencia efectiva de los mencionados requisitos. La acreditación y posterior comprobación se efectuará en la forma y plazos que reglamentariamente se determinen.",

      "law": "Artículo 15 LGSS. Obligatoriedad y alcance de la afiliación. \nLa afiliación a la Seguridad Social es obligatoria para las personas a que se refiere el artículo 7.1 y única para toda su vida y para todo el sistema, sin perjuicio de las altas y bajas en los distintos regímenes que lo integran, así como de las demás variaciones que puedan producirse con posterioridad a la afiliación.\n\nArtículo 6 RIA. La afiliación al sistema de la Seguridad Social.\n1. Mediante el acto administrativo de afiliación, la Tesorería General de la Seguridad Social reconoce la condición de incluida en el sistema de la Seguridad Social, con los efectos establecidos en la Ley, a la persona física que por vez primera realiza una actividad determinante de su inclusión en el ámbito de aplicación del mismo.\n\n1.º La afiliación al sistema de la Seguridad Social, a efectos de los derechos y obligaciones en su modalidad contributiva, es obligatoria para todas las personas comprendidas en el campo de aplicación del mismo, correspondiendo el cumplimiento de la obligación de solicitarla y de aportar los datos requeridos al efecto o de practicarla de oficio, respectivamente, a las personas y entidades o servicios que se determinan en los artículos 23 y siguientes de este Reglamento.\n\n2.º La afiliación es única y general para todos los Regímenes que componen el sistema aunque las personas incluidas, por razón de su actividad, cambien de uno a otro Régimen del mismo.\n\n3.º La afiliación se extiende a toda la vida de las personas comprendidas en el campo de aplicación del sistema.\n\n4.º La afiliación es, asimismo, exclusiva, sin que por la misma actividad ejercida en igualdad de condiciones pueda estarse obligatoriamente incluido en otro u otros Regímenes obligatorios de previsión, conforme a lo establecido en el artículo 8 de la Ley General de la Seguridad Social.\n\n2. La afiliación al sistema de la Seguridad Social, por sí sola o en unión de otros requisitos o presupuestos, constituirá título jurídico para la adquisición de derechos y el nacimiento de obligaciones y condicionará la aplicación de las normas que regulan dicho sistema.",

      "law": "Artículo 23 RIA. Formas de promover la afiliación a la Seguridad Social.\nLa afiliación a la Seguridad Social podrá realizarse a instancia de los empresarios, a petición de los trabajadores o de oficio por la Tesorería General de la Seguridad Social y se practicará en los términos y condiciones establecidos en este capítulo y, en su caso, en el capítulo VI de este Título.\n\nArtículo 16 LGSS. Afiliación, altas, bajas y variaciones de datos.\n1. La afiliación podrá practicarse a petición de las personas y entidades obligadas a dicho acto, a instancia de los interesados o de oficio por la Administración de la Seguridad Social.\n\n2. Corresponderá a las personas y entidades que reglamentariamente se determinen, el cumplimiento de las obligaciones de solicitar la afiliación y de dar cuenta a los correspondientes organismos de la Administración de la Seguridad Social de los hechos determinantes de las altas, bajas y variaciones a que se refiere el artículo anterior.\n\n3. Si las personas y entidades a quienes incumban tales obligaciones no las cumplieran, podrán los interesados instar directamente su afiliación, alta, baja o variación de datos, sin perjuicio de que se hagan efectivas las responsabilidades en que aquellas hubieran incurrido, incluido, en su caso, el pago a su cargo de las prestaciones, y de que se impongan las sanciones que resulten procedentes.\n\n4. Tanto la afiliación como los trámites determinados por las altas, bajas y variaciones a que se refiere el artículo anterior podrán ser realizados de oficio por los correspondientes organismos de la Administración de la Seguridad Social cuando, a raíz de los datos de que dispongan, de las actuaciones de la Inspección de Trabajo y Seguridad Social o por cualquier otro procedimiento, se compruebe la inobservancia de dichas obligaciones.\n\n5. Cuando, por cualquiera de los procedimientos a que se refiere el apartado anterior, se constate que la afiliación y las altas, bajas y variaciones de datos no son conformes con lo establecido en las leyes y sus disposiciones complementarias, los organismos correspondientes de la Administración de la Seguridad Social podrán revisar de oficio, en cualquier momento, sus actos dictados en las citadas materias, declarándolos indebidos por nulidad o anulabilidad, según proceda, conforme al procedimiento establecido en la normativa reglamentaria reguladora de las mismas, y dictando los actos administrativos necesarios para su adecuación a las citadas leyes y disposiciones complementarias.\n\nProcederá, asimismo, en cualquier momento, la rectificación de los errores materiales o de hecho y aritméticos producidos en los actos dictados en materia de afiliación, altas, bajas y variaciones de datos.\n\n6. Sin perjuicio de lo previsto en el artículo 42 del texto refundido de la Ley del Estatuto de los Trabajadores, los empresarios que contraten o subcontraten con otros la realización de obras o servicios correspondientes a la propia actividad de aquellos o que se presten de forma continuada en sus centros de trabajo deberán comprobar, con carácter previo al inicio de la prestación de la actividad contratada o subcontratada, la afiliación y alta en la Seguridad Social de cada uno de los trabajadores que estos ocupen en los mismos durante el periodo de ejecución de la contrata o subcontrata.\n\n7. El deber de comprobación establecido en el apartado anterior no será exigible cuando la actividad contratada se refiera exclusivamente a la construcción o reparación que pueda contratar el titular de un hogar respecto de su vivienda, así como cuando el propietario de la obra o industria no contrate su realización por razón de una actividad empresarial.",

      "law": "Artículo 2. Suscriptores del convenio especial.\n1. El convenio especial con la Seguridad Social se suscribirá con la Tesorería General de la Seguridad Social a través de los órganos competentes al efecto, de acuerdo con la distribución de competencias que la misma tenga establecida.\n\n2. Podrán suscribir el convenio especial con la Tesorería General de la Seguridad Social:\n\na) Los trabajadores o asimilados que causen baja en el Régimen de la Seguridad Social en que se hallen encuadrados y no estén comprendidos en el momento de la suscripción en el campo de aplicación de cualquier otro Régimen del Sistema de la Seguridad Social.\n\nb) Los trabajadores por cuenta ajena con contrato de trabajo de carácter indefinido, así como los trabajadores por cuenta propia incluidos en el Sistema de la Seguridad Social, siempre que unos y otros continúen en situación de alta y tengan cumplidos 65 o más años de edad y acrediten 35 o más años de cotización efectiva, y queden exentos de la obligación de cotizar a la Seguridad Social, en los términos establecidos en el artículo 112.bis y disposición adicional trigésima segunda del Texto Refundido de la Ley General de la Seguridad Social, a excepción en todo caso de los trabajadores que presten sus servicios en las Administraciones Públicas o en los Organismos Públicos regulados en el Título III de la Ley 6/1997, de 14 de abril, de Organización y Funcionamiento de la Administración General del Estado.\n\nc) Los trabajadores o asimilados en situación de pluriempleo o de pluriactividad que cesen en alguna de las actividades por cuenta ajena determinantes de la situación de pluriempleo o en la actividad o actividades por cuenta propia o en la prestación o prestaciones de servicios por cuenta ajena constitutivas de su situación de pluriactividad, en los términos regulados en el artículo 23.\n\nd) Los trabajadores o asimilados que cesen en su prestación de servicios por cuenta ajena o en su actividad por cuenta propia y que       "law": "Artículo 6. Obligación de cotizar: Base de cotización.\n1. En la situación de convenio especial, la cotización a la Seguridad Social será obligatoria desde la fecha de efectos del convenio y mientras se mantenga la vigencia del mismo.\n\n2. La base de cotización por convenio especial tendrá carácter mensual. En los supuestos en que fuese necesario tomar bases diarias, la base anterior se dividirá por treinta en todos los casos.\n\n2.1 En el momento de suscribir el convenio especial el interesado podrá elegir cualquiera de las siguientes bases mensuales de cotización, sin perjuicio de lo que con carácter de especialidad se establece en el Capítulo II de esta Orden:\n\na) La base máxima de cotización del grupo de cotización correspondiente a la categoría profesional del interesado elegida por el mismo, siempre que haya cotizado por ella al menos durante veinticuatro meses, consecutivos o no, en los últimos cinco años.\n\nb) La base de cotización que sea el resultado de dividir por 12 la suma de las bases por contingencias comunes por las que se hayan efectuado cotizaciones, respecto del trabajador solicitante del convenio especial, durante los doce meses consecutivos anteriores a aquel en que haya surtido efectos la baja o se haya extinguido la obligación de cotizar y que sea superior a la base mínima a que se refiere el apartado c) siguiente.\n\nDe tener acreditado un período de cotización inferior a doce meses, esta base estará constituida por el resultado de multiplicar por 30 el cociente de dividir la suma de las bases de cotización entre el número de días cotizados.\n\nc) La base mínima de cotización vigente, en la fecha de efectos del convenio especial, en el Régimen Especial de la Seguridad Social de los Trabajadores por Cuenta Propia o Autónomos.\n\nd) Una base de cotización que esté comprendida entre las bases determinadas conforme a lo dispuesto en los apartados a), b) y c) anteriores.\n\nNo obstante, en el supuesto del párrafo b) del apartado 2 del artículo 2 de esta Orden, la base de cotización estará constituida únicamente por la diferencia entre la base superior por la que se hubiere tenido que cotizar de no gozar de exención y la base a que se refieren, respectivamente, el apartado 6 del artículo 162 y la disposición adicional trigésima segunda de la Ley General de la Seguridad Social.\n\n2.2 Cada vez que, durante el período de vigencia del convenio especial, la base mínima de cotización en el Régimen Especial de la Seguridad Social de los Trabajadores por Cuenta Propia o Autónomos sea modificada la base de cotización correspondiente al convenio será incrementada, como mínimo, en el mismo porcentaje que haya experimentado aquella base mínima o, en su caso, en el porcentaje superior que tenga derecho a elegir el interesado, hasta que la cuantía de la base resultante sea como máximo la base prevista en el apartado 2.1.a) anterior.\n\n2.3 Las personas que suscriban el convenio especial y hayan optado por la base de cotización a que se refieren los apartados 2.1.a), b) y d) anteriores podrán solicitar que, mientras mantengan su situación de alta o asimilada a la de alta por la suscripción del convenio, su base de cotización se incremente automáticamente en el mismo porcentaje en que se aumente en lo sucesivo la base máxima de cotización del Régimen de la Seguridad Social de que se trate.\n\n2.4 Asimismo, en ningún caso la base de cotización resultante podrá ser superior al tope máximo de cotización vigente. En los casos de suspensión del convenio especial en los términos previstos en el apartado 1 del artículo 10, cuando el trabajador o asimilado, por los períodos de actividad, fuere objeto de inclusión en el mismo o en otro Régimen de la Seguridad Social y coincidieren cotizaciones por períodos de actividad laboral y por convenio especial, la suma de ambas bases de cotización no podrá exceder del tope máximo de cotización vigente en cada momento, debiendo, en su caso, rectificarse la base de cotización del convenio especial en la cantidad necesaria para que no se produzca la superación del indicado tope máximo.\n\n2.5 En aquellos Regímenes en que han de tenerse en cuenta, a efectos de cotización, distintas categorías profesionales, las bases mínima o máxima, señaladas en los apartados anteriores, se entenderán referidas a las correspondientes al grupo de cotización en que se encuentre comprendida la categoría que tenía el trabajador antes de la baja, siempre que sean superiores a la base mínima a que se refiere el apartado siguiente.\n\n2.6 En ningún caso el importe de la base de cotización por convenio especial podrá ser inferior al de la base mínima a que se refiere el apartado 2.1.c) de este artículo y surtirá efectos en cada caso desde la fecha de vigencia de la disposición modificadora de la base mínima de cotización.\n\n2.7 Las opciones a que se refieren los apartados 2.1 y 2.3 anteriores que se ejerciten con posterioridad a la suscripción del convenio especial deberán efectuarse antes del primero de octubre de cada año y tendrán efectos desde el día 1 de enero del año siguiente a la fecha de solicitud.\n\nLa renuncia a estas opciones podrá realizarse en el mismo plazo y tendrá efectos desde el 1 de enero del año siguiente al de la formulación de la renuncia.\n\nArtículo 7. Tipo de cotización y determinación de la cuota.\n1. El tipo de cotización por convenio especial será único y estará constituido por el vigente en cada momento en el Régimen General de la Seguridad Social.\n\n2. Para determinar la cuota a ingresar por convenio especial se actuará de la forma siguiente:\n\na) Se calculará la cuota íntegra aplicando a la base de cotización que corresponda el tipo único de cotización vigente en el Régimen General.\n\nb) El resultado obtenido se multiplicará por el coeficiente o coeficientes reductores aplicables, en función de la acción protectora dispensada por el convenio especial, y el producto que resulte constituirá la cuota líquida a ingresar.\n\nA estos efectos, los coeficientes a aplicar para la cotización en la situación de convenio especial serán los fijados anualmente por el Ministerio de Trabajo y Asuntos Sociales.\n\nc) Cuando los efectos iniciales o finales del convenio especial no sean coincidentes con el primero o el último día del mes, la cuota mensual se dividirá por 30 y el cociente se multiplicará por los días del mes que tenga o haya tenido efectos el convenio.",

      "law": "Artículo 10. Recargos.\n1. Las deudas con la Seguridad Social cuyo objeto esté constituido por cuotas, cuando no se abonen en el plazo reglamentario de ingreso, devengarán los siguientes recargos:\n\na) Cuando los sujetos responsables del pago hubieran cumplido dentro de plazo las obligaciones en materia de liquidación establecidas en los apartados 1 y 2 del artículo 29 del texto refundido de la Ley General de la Seguridad Social:\n\n1.º Recargo del 10 por ciento de la deuda, si se abonasen las cuotas debidas dentro del primer mes natural siguiente al del vencimiento del plazo para su ingreso.\n\n2.º Recargo del 20 por ciento de la deuda, si se abonasen las cuotas debidas a partir del segundo mes natural siguiente al del vencimiento del plazo para su ingreso.\n\nb) Cuando los sujetos responsables del pago no hubieran cumplido dentro de plazo las obligaciones en materia de liquidación establecidas en los apartados 1 y 2 del citado artículo 29:\n\n1.º Recargo del 20 por ciento de la deuda, si se abonasen las cuotas debidas antes de la terminación del plazo de ingreso establecido en la reclamación de deuda o acta de liquidación.\n\n2.º Recargo del 35 por ciento de la deuda, si se abonasen las cuotas debidas a partir de la terminación de dicho plazo de ingreso.\n\n2. Las deudas con la Seguridad Social que tengan carácter de ingresos de derecho público y cuyo objeto esté constituido por recursos distintos a cuotas, cuando no se abonen dentro del plazo reglamentario que tengan establecido, se incrementarán con el recargo del 20 por ciento.\n\n3. En ningún caso podrá aplicarse recargo sobre la deuda constituida a su vez por recargos o intereses.\n\n4. Cuando el ingreso fuera del plazo reglamentario sea imputable a error de la Administración, sin que ésta actúe en calidad de empresario, no se aplicará recargo.\n\n5. Los recargos se liquidarán e ingresarán conjuntamente con el principal de las deudas sobre las que recaigan. Cualquiera que sea la naturaleza de dichas deudas, las cantidades recaudadas en concepto de recargos se integrarán en su totalidad en el presupuesto de recursos de la Tesorería General de la Seguridad Social.\n\nLos ingresos del principal de la deuda realizados fuera del plazo reglamentario sin incluir la totalidad o parte del recargo que proceda serán considerados como ingresos a cuenta de la totalidad de la deuda, la cual no se entenderá satisfecha hasta que se produzca el ingreso del importe íntegro, incluidos los recargos.\n\nSin embargo, cuando en plazo reglamentario se hubiera ingresado exclusivamente la aportación de los trabajadores, conforme a lo establecido en este reglamento, el recargo se aplicará sobre la parte de deuda que resulte impagada después del vencimiento del plazo reglamentario de ingreso.",

      "law": "Artículo 80. Reintegro de prestaciones indebidamente percibidas.\n1. Lo establecido en los apartados siguientes para el reintegro de las prestaciones indebidamente percibidas será únicamente aplicable en aquellos supuestos en que no hubiera sido posible la aplicación del procedimiento especial de reintegro por descuento regulado en el Real Decreto 148/1996, de 5 de febrero, por el que se regula el procedimiento especial para el reintegro de las prestaciones de la Seguridad Social indebidamente percibidas, o bien cuando, iniciado éste, no hubiera sido posible efectuar las deducciones necesarias para cancelar la deuda en su totalidad.\n\n2. La Tesorería General de la Seguridad Social recaudará de los sujetos responsables el importe de las prestaciones que hayan sido declaradas como indebidamente percibidas mediante resolución o acuerdo firme en vía administrativa de la entidad gestora o colaboradora, Administración u organismo público correspondiente.\n\n3. A estos efectos, la entidad gestora o colaboradora, administración u organismo solicitará el inicio del procedimiento de reintegro a la Tesorería General de la Seguridad Social comunicando por medios telemáticos, informáticos o electrónicos los datos necesarios para realizar la gestión recaudatoria del importe de las prestaciones indebidamente percibidas. Dicha comunicación de datos, los cuales se considerarán ciertos a efectos de iniciar el correspondiente procedimiento recaudatorio, habilitará a la Tesorería General de la Seguridad Social para dar comienzo a este.\n\nLa entidad gestora o colaboradora, administración u organismo garantizará el acceso de la Tesorería General de la Seguridad Social, preferentemente por medios electrónicos, informáticos o telemáticos, a la resolución o acuerdo firme que declare la prestación como indebidamente percibida y al resto de información y documentación asociada a la deuda que permita la gestión de esta y, en especial, en materia de responsabilidad mortis causa e impugnaciones.\n\n4. Para el reintegro de las citadas prestaciones, la Tesorería General de la Seguridad Social expedirá reclamación de deuda en la que se fijará el plazo reglamentario para el reintegro, que comenzará con la notificación de dicha reclamación y finalizará el último día hábil del mes siguiente al de aquella notificación.\n\nEn el supuesto de falta de ingreso en el plazo indicado en la reclamación de deuda, se iniciará el procedimiento ejecutivo mediante la emisión de la correspondiente providencia de apremio, aplicándose en este caso los correspondientes recargos e intereses.\n\nSin perjuicio de lo indicado anteriormente, el sujeto obligado podrá solicitar, dentro del plazo de ingreso al que se refiere el párrafo primero, el fraccionamiento del pago de la deuda en diversos plazos.\n\nA tal efecto, los órganos de la Tesorería General de la Seguridad Social, conforme al reparto de competencias que lleve a cabo su Director General, establecerán dichos plazos de fraccionamiento, con un importe mínimo de 100 euros mensuales y hasta un máximo de cinco años.\n\nLos beneficiarios del fraccionamiento indicado anteriormente deberán ingresar el importe de los correspondientes vencimientos mediante el sistema de domiciliación en cuenta abierta en una entidad financiera autorizada para actuar como oficina recaudadora de la Seguridad Social, en los términos y condiciones establecidos en los apartados 2, 3 y 4 del artículo 17 bis de la Orden TAS/1562/2005, de 25 mayo, por la que se establecen normas para la aplicación y desarrollo del Reglamento General de Recaudación de la Seguridad Social, aprobado por el Real Decreto 1415/2004, de 11 de junio.\n\nEn el supuesto de falta de ingreso del importe correspondiente a tres de los plazos de fraccionamiento concedidos, se iniciará automáticamente la vía ejecutiva, mediante la emisión de la correspondiente providencia de apremio, por la totalidad del importe que quedara por pagar. En este caso, y a efectos de determinar el cálculo de los intereses de demora que correspondan, se entenderá como plazo reglamentario de ingreso, el correspondiente al primer plazo de fraccionamiento dejado de ingresar.\n\nConcluido el período de pago del último de los plazos de fraccionamiento concedidos, si existiera alguna cantidad pendiente de abono, se iniciará igualmente, de manera automática, la vía ejecutiva, mediante la emisión de la correspondiente providencia de apremio. En este caso, y a efectos de determinar el cálculo de los intereses de demora que correspondan, se entenderá como plazo reglamentario de ingreso el correspondiente al último plazo del fraccionamiento.\n\n5. Las sentencias firmes en el orden jurisdiccional social que recaigan sobre las resoluciones o acuerdos firmes que declaren la obligación de devolver las prestaciones indebidamente percibidas serán, asimismo comunicados a la Tesorería General de la Seguridad Social, al objeto de continuar el procedimiento recaudatorio en los términos que procedan.\n\n6. Los reintegros de prestaciones declarados por resolución judicial, sin que exista previamente resolución de la entidad gestora o colaboradora, Administración u organismo público correspondiente, se efectuarán en los términos establecidos en ella, y en defecto de cumplimiento voluntario, se instará su ejecución judicial, a cuyos efectos deberá ser remitida a la Tesorería General de la Seguridad Social.",

      "law": "Artículo 54. Medidas cautelares.\n1. Para asegurar el cobro de las deudas con la Seguridad Social y antes del inicio del procedimiento de apremio, la Tesorería General de la Seguridad Social podrá adoptar medidas cautelares de carácter provisional cuando existan indicios racionales de que, en otro caso, dicho cobro pueda verse frustrado o gravemente dificultado.\n\n2. Las medidas habrán de ser proporcionadas al daño que se pretenda evitar. En ningún caso se adoptarán aquellas que puedan producir un perjuicio de difícil o imposible reparación.\n\n3. Como medida cautelar, podrá adoptarse alguna de las siguientes:\n\na) Retención del pago de devoluciones de ingresos indebidos o de otros pagos que deba realizar la Tesorería General de la Seguridad Social, en la cuantía estrictamente necesaria para asegurar el cobro de la deuda. La retención cautelar total o parcial de una devolución de ingresos indebidos deberá ser notificada al interesado juntamente con el acuerdo de devolución.\n\nb) Embargo preventivo de bienes o derechos, que se practicará conforme a las reglas establecidas para los embargos ordinarios que le sean de aplicación según su naturaleza, y se asegurará mediante su anotación en los registros públicos correspondientes o mediante el depósito de los bienes muebles embargados.\n\nc) Cualquier otra legalmente prevista.\n\n4. Cuando la deuda con la Seguridad Social no se encuentre todavía liquidada pero haya sido devengada y haya transcurrido el plazo reglamentario para su pago, y siempre que corresponda a cantidades determinables por la aplicación de las bases, tipos y otros datos objetivos previamente establecidos que permitan fijar una cifra máxima de responsabilidad, será precisa la previa autorización, en su respectivo ámbito, del director provincial de la Tesorería General de la Seguridad Social o, en su caso, de su Director General, o autoridad en quien deleguen.\n\nCuando haya vencido el plazo reglamentario de ingreso y el responsable del pago hubiera cumplido dentro de plazo las obligaciones en materia de liquidación de cuotas establecidas en los apartados 1 y 2 del artículo 26 del texto refundido de la Ley General de la Seguridad Social, o se hubiera ya emitido contra él reclamación de deuda o acta de liquidación elevada a definitiva, las medidas cautelares podrán adoptarse sin más trámite y practicarse por las unidades de recaudación ejecutiva de la Seguridad Social.\n\n5. Las medidas cautelares se convertirán en definitivas cuando se dicte providencia de apremio sin que se haya cobrado la deuda. En este caso, el órgano de recaudación ejecutiva notificará dicha circunstancia a los interesados y, en su caso, al registro en que se hubiera anotado la medida cautelar. La sujeción del bien o derecho al procedimiento de apremio se entenderá producida, a todos los efectos, desde la fecha en que se adoptó la medida cautelar.\n\n6. Desaparecidas las circunstancias que justificaron la adopción de las medidas cautelares, acordada su sustitución por otra garantía suficiente o transcurrido el plazo de seis meses desde su adopción sin que se hayan convertido en definitivas dentro del procedimiento administrativo de apremio, dichas medidas se levantarán de oficio por el mismo órgano que las hubiera adoptado.\n\n7. Los gastos ocasionados por la adopción de medidas cautelares convertidas en definitivas tendrán la condición de costas del procedimiento administrativo de apremio.\n\n8. Se podrá acordar el embargo preventivo de dinero y mercancías en cuantía suficiente para asegurar el pago de la deuda con la Seguridad Social que corresponda exigir por actividades y trabajos lucrativos ejercidos sin establecimiento cuando los trabajadores no hayan sido afiliados o, en su caso, no hayan sido dados de alta en la Seguridad Social.\n\nAsimismo, podrán intervenirse los ingresos de los espectáculos públicos de las empresas cuyos trabajadores no hayan sido afiliados ni dados de alta o por los que no hubiesen efectuado sus cotizaciones a la Seguridad Social.",

      "law": "Artículo 44. Caracteres de las prestaciones.\n1. Las prestaciones de la Seguridad Social, así como los beneficios de sus servicios sociales y de la asistencia social, no podrán ser objeto de retención, sin perjuicio de lo previsto en el apartado 2, cesión total o parcial, compensación o descuento, salvo en los dos casos siguientes:\n\na) En orden al cumplimiento de las obligaciones alimenticias a favor del cónyuge e hijos.\n\nb) Cuando se trate de obligaciones contraídas por el beneficiario dentro de la Seguridad Social.\n\nEn materia de embargo se estará a lo establecido en la Ley de Enjuiciamiento Civil.\n\n2. Las percepciones derivadas de la acción protectora de la Seguridad Social estarán sujetas a tributación en los términos establecidos en las normas reguladoras de cada impuesto.\n\n3. No podrá ser exigida ninguna tasa fiscal, ni derecho de ninguna clase, en cuantas informaciones o certificaciones hayan de facilitar los correspondientes organismos de la Administración de la Seguridad Social, y los organismos administrativos, judiciales o de cualquier otra clase, en relación con las prestaciones y beneficios a que se refiere el apartado 1.",

      "law": "Artículo 156. Concepto de accidente de trabajo.\n1. Se entiende por accidente de trabajo toda lesión corporal que el trabajador sufra con ocasión o por consecuencia del trabajo que ejecute por cuenta ajena.\n\n2. Tendrán la consideración de accidentes de trabajo:\n\na) Los que sufra el trabajador al ir o al volver del lugar de trabajo.\n\nb) Los que sufra el trabajador con ocasión o como consecuencia del desempeño de cargos electivos de carácter sindical, así como los ocurridos al ir o al volver del lugar en que se ejerciten las funciones propias de dichos cargos.\n\nc) Los ocurridos con ocasión o por consecuencia de las tareas que, aun siendo distintas a las de su grupo profesional, ejecute el trabajador en cumplimiento de las órdenes del empresario o espontáneamente en interés del buen funcionamiento de la empresa.\n\nd) Los acaecidos en actos de salvamento y en otros de naturaleza análoga, cuando unos y otros tengan conexión con el trabajo.\n\ne) Las enfermedades, no incluidas en el artículo siguiente, que contraiga el trabajador con motivo de la realización de su trabajo, siempre que se pruebe que la enfermedad tuvo por causa exclusiva la ejecución del mismo.\n\nf) Las enfermedades o defectos, padecidos con anterioridad por el trabajador, que se agraven como consecuencia de la lesión constitutiva del accidente.\n\ng) Las consecuencias del accidente que resulten modificadas en su naturaleza, duración, gravedad o terminación, por enfermedades intercurrentes, que constituyan complicaciones derivadas del proceso patológico determinado por el accidente mismo o tengan su origen en afecciones adquiridas en el nuevo medio en que se haya situado el paciente para su curación.\n\n3. Se presumirá, salvo prueba en contrario, que son constitutivas de accidente de trabajo las lesiones que sufra el trabajador durante el tiempo y en el lugar del trabajo.\n\n4. No obstante lo establecido en los apartados anteriores, no tendrán la consideración de accidente de trabajo:\n\na) Los que sean debidos a fuerza mayor extraña al trabajo, entendiéndose por esta la que sea de tal naturaleza que no guarde relación alguna con el trabajo que se ejecutaba al ocurrir el accidente.\n\nEn ningún caso se considerará fuerza mayor extraña al trabajo la insolación, el rayo y otros fenómenos análogos de la naturaleza.\n\nb) Los que sean debidos a dolo o a imprudencia temeraria del trabajador accidentado.\n\n5. No impedirán la calificación de un accidente como de trabajo:\n\na) La imprudencia profesional que sea consecuencia del ejercicio habitual de un trabajo y se derive de la confianza que este inspira.\n\nb) La concurrencia de culpabilidad civil o criminal del empresario, de un compañero de trabajo del accidentado o de un tercero, salvo que no guarde relación alguna con el trabajo.",

      "law": "Artículo 167. Responsabilidad en orden a las prestaciones.\n1. Cuando se haya causado derecho a una prestación por haberse cumplido las condiciones a que se refiere el artículo 165, la responsabilidad correspondiente se imputará, de acuerdo con sus respectivas competencias, a las entidades gestoras, mutuas colaboradoras con la Seguridad Social o empresarios que colaboren en la gestión o, en su caso, a los servicios comunes.\n\n2. El incumplimiento de las obligaciones en materia de afiliación, altas y bajas y de cotización determinará la exigencia de responsabilidad, en cuanto al pago de las prestaciones, previa la fijación de los supuestos de imputación y de su alcance y la regulación del procedimiento para hacerla efectiva.\n\n3. No obstante lo establecido en el apartado anterior, las entidades gestoras, mutuas colaboradoras con la Seguridad Social o, en su caso, los servicios comunes procederán, de acuerdo con sus respectivas competencias, al pago de las prestaciones a los beneficiarios en aquellos casos, incluidos en dicho apartado, en los que así se determine reglamentariamente, con la consiguiente subrogación en los derechos y acciones de tales beneficiarios. El indicado pago procederá aun cuando se trate de empresas desaparecidas o de aquellas que por su especial naturaleza no puedan ser objeto de procedimiento de apremio. Igualmente, las mencionadas entidades, mutuas y servicios asumirán el pago de las prestaciones, en la medida en que se atenúe el alcance de la responsabilidad de los empresarios respecto a dicho pago.\n\nEl anticipo de las prestaciones, en ningún caso, podrá exceder de la cantidad equivalente a dos veces y media el importe del indicador público de renta de efectos múltiples vigente en el momento del hecho causante o, en su caso, del importe del capital coste necesario para el pago anticipado, con el límite indicado por las entidades gestoras, mutuas o servicios. En todo caso, el cálculo del importe de las prestaciones o del capital coste para el pago de las mismas por las mutuas o empresas declaradas responsables de aquellas incluirá el interés de capitalización y el recargo por falta de aseguramiento establecido pero con exclusión del recargo por falta de medidas de seguridad y salud en el trabajo a que se refiere el artículo 164.\n\nLos derechos y acciones que, por subrogación en los derechos y acciones de los beneficiarios, correspondan a aquellas entidades, mutuas o servicios frente al empresario declarado responsable de prestaciones por resolución administrativa o judicial o frente a las entidades de la Seguridad Social en funciones de garantía, únicamente podrán ejercitarse contra el responsable subsidiario tras la previa declaración administrativa o judicial de insolvencia, provisional o definitiva, de dicho empresario.\n\nCuando, en virtud de lo dispuesto en este apartado, las entidades gestoras, las mutuas y, en su caso, los servicios comunes se subrogasen en los derechos y acciones de los beneficiarios, aquellos podrán utilizar frente al empresario responsable la misma vía administrativa o judicial que se hubiera seguido para la efectividad del derecho y de la acción objeto de subrogación.\n\n4. Corresponderá a la entidad gestora competente la declaración, en vía administrativa, de la responsabilidad en orden a las prestaciones cualquiera que sea la prestación de que se trate, así como de la entidad que, en su caso, deba anticipar aquella o constituir el correspondiente capital coste.",

      "law": "Artículo 161. Cuantía de las prestaciones.\n1. La cuantía de las prestaciones económicas no determinada en la presente ley será fijada en sus normas de desarrollo.\n\n2. La cuantía de las pensiones y de las demás prestaciones cuyo importe se calcule sobre una base reguladora se determinará en función de la totalidad de las bases por las que se haya cotizado durante los períodos que se señalen para cada una de ellas.\n\nLa cotización adicional por horas extraordinarias a que se refiere el artículo 149 no será computable a efectos de determinar la base reguladora de las prestaciones.\n\nEn todo caso, la base reguladora de cada prestación no podrá rebasar el tope máximo de la base de cotización previsto en el artículo 148.\n\n3. En los casos de pluriempleo, la base reguladora de las prestaciones se determinará en función de la suma de las bases por las que se haya cotizado en las distintas empresas, siendo de aplicación a la base reguladora así determinada el tope máximo a que se refiere el apartado anterior.\n\n4. Por los períodos de actividad en los que no se hayan efectuado cotizaciones por contingencias comunes, en los términos previstos en el artículo 152, a efectos de determinar la base reguladora de las prestaciones excluidas de cotización, las bases de cotización correspondientes a las mensualidades de cada ejercicio económico exentas de cotización no podrán ser superiores al resultado de incrementar el promedio de las bases de cotización del año natural inmediatamente anterior en el porcentaje de variación media conocida del Índice de Precios de Consumo en el último año indicado más dos puntos porcentuales.",

      "law": "Artículo 197. Base reguladora de las pensiones de incapacidad permanente derivada de contingencias comunes.\n1. La base reguladora de las pensiones de incapacidad permanente derivada de enfermedad común se determinará de conformidad con las siguientes normas:\n\na) Se hallará el cociente que resulte de dividir por 112 las bases de cotización del interesado durante los 96 meses anteriores al mes previo al del hecho causante.\nEl cómputo de dichas bases se realizará conforme a las siguientes reglas, de las que es expresión matemática la fórmula que figura al final de las mismas:\n\n1.ª Las bases correspondientes a los veinticuatro meses anteriores al mes previo al del hecho causante se computarán en su valor nominal.\n\n2.ª Las restantes bases de cotización se actualizarán de acuerdo con la evolución que haya experimentado el Índice de Precios de Consumo desde los meses a que aquellas correspondan hasta el mes inmediato anterior a aquel en que se inicie el período de bases no actualizables a que se refiere la regla anterior.\n\nImagen: /datos/imagenes/disp/2015/261/11724_002.png\n\nSiendo:\n\nBr = Base reguladora.\n\nBi = Base de cotización del mes i-ésimo anterior al mes previo al del hecho causante.\n\nIi = Índice General de Precios al Consumo del mes i-ésimo anterior al mes previo al del hecho causante.\n\nSiendo i = 1,2,...,96.\n\nb) Al resultado obtenido en razón a lo establecido en la norma anterior se le aplicará el porcentaje que corresponda en función de los años de cotización, según la escala prevista en el artículo 210.1, considerándose a tal efecto como cotizados los años que le resten al interesado, en la fecha del hecho causante, para cumplir la edad ordinaria de jubilación vigente en cada momento. En el caso de no alcanzarse quince años de cotización, el porcentaje aplicable será del 50 por ciento.\n\nEl importe resultante constituirá la base reguladora a la que, para obtener la cuantía de la pensión que corresponda, habrá de aplicarse el porcentaje previsto para el grado de incapacidad reconocido.\n\n2. En los supuestos en que se exija un período mínimo de cotización inferior a ocho años, la base reguladora se obtendrá de forma análoga a la establecida en el apartado anterior, pero computando bases mensuales de cotización en número igual al de meses de que conste el período mínimo exigible, sin tener en cuenta las fracciones de mes, y excluyendo, en todo caso, de la actualización las bases correspondientes a los veinticuatro meses inmediatamente anteriores al mes previo a aquel en que se produzca el hecho causante.\n\n3. Respecto a las pensiones de incapacidad permanente absoluta o gran incapacidad derivadas de accidente no laboral a que se refiere artículo 195.4, para el cómputo de su base reguladora, se aplicarán las reglas previstas en el apartado 1.a) del presente artículo.\n\n4. Si en el período que haya de tomarse para el cálculo de la base reguladora aparecieran meses durante los cuales no hubiese existido obligación de cotizar, las primeras cuarenta y ocho mensualidades se integrarán con la base mínima de entre todas las existentes en cada momento, y el resto de mensualidades con el 50 por ciento de dicha base mínima.\n\nEn los supuestos en que en alguno de los meses a tener en cuenta para la determinación de la base reguladora, la obligación de cotizar exista solo durante una parte del mismo, procederá la integración señalada en el párrafo anterior, por la parte del mes en que no exista obligación de cotizar, siempre que la base de cotización correspondiente al primer período no alcance la cuantía de la base mínima mensual señalada. En tal supuesto, la integración alcanzará hasta esta última cuantía.",

      "law": "Artículo 196. Prestaciones económicas.\n1. La prestación económica correspondiente a la incapacidad permanente parcial, consistirá en una cantidad a tanto alzado.\n\n2. La prestación económica correspondiente a la incapacidad permanente total consistirá en una pensión vitalicia, que podrá excepcionalmente ser sustituida por una indemnización a tanto alzado cuando el beneficiario fuese menor de sesenta años.\n\nLos declarados afectos de incapacidad permanente total percibirán la pensión prevista en el párrafo anterior incrementada en el porcentaje que reglamentariamente se determine, cuando por su edad, falta de preparación general o especializada y circunstancias sociales y laborales del lugar de residencia, se presuma la dificultad de obtener empleo en actividad distinta de la habitual anterior.\n\nLa cuantía de la pensión de incapacidad permanente total derivada de enfermedad común no podrá resultar inferior al importe mínimo fijado anualmente en la Ley de Presupuestos Generales del Estado para la pensión de incapacidad permanente total derivada de enfermedad común de titulares menores de sesenta años con cónyuge no a cargo.\n\n3. La prestación económica correspondiente a la incapacidad permanente absoluta consistirá en una pensión vitalicia.\n\n4. Si el trabajador fuese calificado como gran inválido, tendrá derecho a una pensión vitalicia según lo establecido en los apartados anteriores, incrementándose su cuantía con un complemento, destinado a que el inválido pueda remunerar a la persona que le atienda. El importe de dicho complemento será equivalente al resultado de sumar el 45 por ciento de la base mínima de cotización vigente en el momento del hecho causante y el 30 por ciento de la última base de cotización del trabajador correspondiente a la contingencia de la que derive la situación de incapacidad permanente. En ningún caso el complemento señalado podrá tener un importe inferior al 45 por ciento de la pensión percibida, sin el complemento, por el trabajador.\n\n5. En los casos en que el trabajador, con sesenta y siete o más años acceda a la pensión de incapacidad permanente derivada de contingencias comunes, por no reunir los requisitos para el reconocimiento del derecho a pensión de jubilación, la cuantía de la pensión de incapacidad permanente será equivalente al resultado de aplicar a la correspondiente base reguladora el porcentaje que corresponda al período mínimo de cotización que esté establecido, en cada momento, para el acceso a la pensión de jubilación. Cuando la incapacidad permanente derive de enfermedad común, se considerará como base reguladora el resultado de aplicar únicamente lo establecido en la norma a) del apartado 1 del artículo 197.\n\n6. Las prestaciones a que se refiere el presente artículo se harán efectivas en la cuantía y condiciones que se determinen en las normas de desarrollo de esta ley.",

      "law": "Artículo 178. Beneficiarios.\n1. Serán beneficiarios del subsidio por nacimiento y cuidado de menor las personas incluidas en este Régimen General, cualquiera que sea su sexo, que disfruten de los descansos referidos en el artículo anterior, siempre que, además de reunir la condición general exigida en el artículo 165.1 y las demás que reglamentariamente se establezcan, acrediten los siguientes períodos mínimos de cotización:\n\na) Si la persona trabajadora tiene menos de veintiún años de edad en la fecha del nacimiento, o en la fecha de la decisión administrativa de acogimiento o de guarda con fines de adopción o de la resolución judicial por la que se constituye la adopción, no se exigirá período mínimo de cotización.\n\nb) Si la persona trabajadora tiene cumplidos veintiún años de edad y es menor de veintiséis en la fecha del nacimiento, o en la fecha de la decisión administrativa de acogimiento o de guarda con fines de adopción o de la resolución judicial por la que se constituye la adopción, el período mínimo de cotización exigido será de noventa días cotizados dentro de los siete años inmediatamente anteriores al momento de inicio del descanso. Se considerará cumplido el mencionado requisito si, alternativamente, acredita ciento ochenta días cotizados a lo largo de su vida laboral, con anterioridad a esta última fecha.\n\nc) Si la persona trabajadora tiene cumplidos veintiséis años de edad en la fecha del nacimiento, o en la fecha de la decisión administrativa de acogimiento o de guarda con fines de adopción o de la resolución judicial por la que se constituye la adopción, el período mínimo de cotización exigido será de ciento ochenta días cotizados dentro de los siete años inmediatamente anteriores al momento de inicio del descanso. Se considerará cumplido el mencionado requisito si, alternativamente, acredita trescientos sesenta días cotizados a lo largo de su vida laboral, con anterioridad a esta última fecha.\n\n2. En el supuesto de nacimiento, la edad señalada en el apartado anterior será la que tenga cumplida la interesada en el momento de inicio del descanso, tomándose como referente el momento del parto a efectos de verificar la acreditación del período mínimo de cotización que, en su caso, corresponda.\n\n3. En los supuestos de adopción internacional previstos en el tercer párrafo del artículo 48.5 del texto refundido de la Ley del Estatuto de los Trabajadores, y en el párrafo cuarto del artículo 49.b) del texto refundido de la Ley del Estatuto Básico del Empleado Público, la edad señalada en el apartado 1 será la que tengan cumplida los interesados en el momento de inicio del descanso, tomándose como referente el momento de la resolución a efectos de verificar la acreditación del período mínimo de cotización que, en su caso, corresponda.\n\n4. Al inicio de cada uno de los periodos de descanso la persona trabajadora deberá encontrarse en situación de alta o asimilada a la de alta.",

      "law": "Artículo 48. Suspensión con reserva de puesto de trabajo.\n[...]\n4. El nacimiento, que comprende el parto y el cuidado de menor, suspenderá el contrato de trabajo de la madre biológica y el del progenitor distinto de la madre biológica durante diecinueve semanas.\nEn el supuesto de monoparentalidad, por existir una única persona progenitora, el periodo de suspensión será de treinta y dos semanas.\nEn los casos de parto prematuro y en aquellos en que, por cualquier otra causa, el neonato deba permanecer hospitalizado a continuación del parto, el periodo de suspensión podrá computarse, a instancia de la madre biológica o del otro progenitor, a partir de la fecha del alta hospitalaria. Se excluyen de dicho cómputo las seis semanas posteriores al parto, de suspensión obligatoria del contrato de la madre biológica.\nEn los casos de parto prematuro con falta de peso y en aquellos otros en que el neonato precise, por alguna condición clínica, hospitalización a continuación del parto, por un periodo superior a siete días, el periodo de suspensión se ampliará en tantos días como el nacido se encuentre hospitalizado, con un máximo de trece semanas adicionales, y en los términos en que reglamentariamente se desarrolle.\nEn el supuesto de fallecimiento del hijo o hija, el periodo de suspensión no se verá reducido, salvo que, una vez finalizadas las seis semanas de descanso obligatorio, se solicite la reincorporación al puesto de trabajo.\nEn caso de fallecimiento de uno de los progenitores, el otro progenitor podrá hacer uso de la totalidad o, en su caso, de la parte que reste de permiso.\nLa suspensión del contrato de cada uno de los progenitores por el cuidado de menor se distribuye de la siguiente manera:\na) Seis semanas ininterrumpidas inmediatamente posteriores al parto serán obligatorias y habrán de disfrutarse a jornada completa.\nb) Once semanas, veintidós en el caso de monoparentalidad, que podrán distribuirse a voluntad de la persona trabajadora, en períodos semanales a disfrutar de forma acumulada o interrumpida y ejercitarse desde la finalización de la suspensión obligatoria posterior al parto hasta que el hijo o la hija cumpla doce meses. No obstante, la madre biológica podrá anticipar su ejercicio hasta cuatro semanas antes de la fecha previsible del parto.\nc) Dos semanas, cuatro en el caso de monoparentalidad, para el cuidado del menor que podrán distribuirse a voluntad de la persona trabajadora, en períodos semanales de forma acumulada o interrumpida hasta que el hijo o la hija cumpla los ocho años.\nEste derecho es individual de la persona trabajadora sin que pueda transferirse su ejercicio al otro progenitor.\nLas suspensiones previstas en las letras b) y c) podrán disfrutarse en régimen de jornada completa o de jornada parcial, previo acuerdo entre la empresa y la persona trabajadora, y conforme se determine reglamentariamente. La persona trabajadora deberá comunicar a la empresa, con una antelación mínima de quince días, el ejercicio de este derecho en los términos establecidos, en su caso, en los convenios colectivos. Cuando los dos progenitores que ejerzan este derecho trabajen para la misma empresa, la dirección empresarial podrá limitar su ejercicio simultáneo por razones fundadas y objetivas, debidamente motivadas por escrito.\nA efectos de lo dispuesto en este apartado, el término de madre biológica incluye también a las personas trans gestantes.",

      "law": "Artículo treinta y ocho. Incremento de las pensiones de orfandad y de las indemnizaciones especiales a tanto alzado.\n1. En los casos de orfandad absoluta las prestaciones correspondientes a los huérfanos podrán incrementarse en los términos y condiciones siguientes:\n\n1.º Cuando a la muerte del causante no exista beneficiario de la pensión de viudedad, la cuantía de la pensión de orfandad que se reconozca al huérfano se incrementará en el importe resultante de aplicar a la base reguladora el 52 por ciento.\n\n2.º Cuando a la muerte del causante exista algún beneficiario de la pensión de viudedad, la pensión de orfandad que se reconozca podrá, en su caso, incrementarse en el importe resultante de aplicar a la base reguladora el porcentaje de pensión de viudedad que no hubiera sido asignado.\n\n3.º Cuando el progenitor sobreviviente fallezca siendo beneficiario de la pensión de viudedad, procederá incrementar el porcentaje de la pensión que tuviera reconocida el huérfano, sumándole el que se hubiere aplicado para determinar la cuantía de la pensión de viudedad extinguida.\n\n4.º En cualquiera de los supuestos anteriores, en el caso de existir varios huérfanos con derecho a pensión, el porcentaje de incremento que corresponda se distribuirá a partes iguales entre todos ellos.\n\n5.º Los incrementos de las pensiones de orfandad regulados en los párrafos 1.º, 2.º, 3.º y 4.º en ningún caso podrán dar lugar a que se supere el límite establecido en el apartado 4 del artículo 179 de la Ley General de la Seguridad Social, para las pensiones por muerte y supervivencia.\n\nNo obstante, dichos incrementos serán compatibles con la prestación temporal de viudedad, pudiendo, por tanto, ser reconocidos durante el percibo de esta última.\n\n6.º En caso de muerte por accidente de trabajo o enfermedad profesional la indemnización que se reconozca a los huérfanos absolutos se incrementará con la que hubiera correspondido al cónyuge o a quien hubiera sido cónyuge o pareja       "law": "Artículo 224. Pensión de orfandad y prestación de orfandad.\n1. Tendrán derecho a la pensión de orfandad, en régimen de igualdad, cada uno de los hijos e hijas del causante o de la causante fallecida, cualquiera que sea la naturaleza de su filiación, siempre que, en el momento de la muerte, sean menores de veintiún años o estén incapacitados para el trabajo y que el causante se encontrase en alta o situación asimilada a la de alta, o fuera pensionista en los términos del artículo 217.1.c).\n\nSerá de aplicación, asimismo, a las pensiones de orfandad lo previsto en el segundo párrafo del artículo 219.1.\n\nTendrán derecho a la prestación de orfandad, en régimen de igualdad, cada uno de los hijos e hijas de la causante fallecida, cualquiera que sea la naturaleza de su filiación, cuando el fallecimiento se hubiera producido por violencia contra la mujer, en los términos en que se defina por la ley o por los instrumentos internacionales ratificados por España, y en todo caso cuando se deba a la comisión contra la mujer de alguno de los supuestos de violencias sexuales determinados por la Ley Orgánica de garantía integral de la libertad sexual, siempre que los hijos e hijas se hallen en circunstancias equiparables a una orfandad absoluta y no reúnan los requisitos necesarios para causar una pensión de orfandad. La cuantía de esta prestación será el 70 por ciento de su base reguladora, siempre que los rendimientos de la unidad familiar de convivencia, incluidas las personas huérfanas, dividido por el número de miembros que la componen, no superen en cómputo anual el 75 por ciento del Salario Mínimo Interprofesional vigente en cada momento, excluida la parte proporcional de las pagas extraordinarias.\n\nEn el supuesto de que hubiera más de una persona beneficiaria de esta prestación, el importe conjunto de las mismas podrá situarse en el 118 por ciento de la base reguladora, y nunca será inferior al mínimo equivalente a la pensión de viudedad con cargas familiares.\n\n2. El derecho a la pensión de orfandad y al incremento previsto reglamentariamente para los casos de orfandad absoluta y, en su caso, a la prestación de orfandad, se suspenderá en el supuesto de adopción de los hijos e hijas de la causante fallecida como consecuencia de violencia sobre la mujer, cuando los rendimientos de la unidad de convivencia en que se integran, divididos por el número de miembros que la componen, incluidas las personas huérfanas adoptadas, superen en cómputo anual el 75 por ciento del Salario Mínimo Interprofesional vigente en cada momento, excluida la parte proporcional de las pagas extraordinarias.\n\nAsimismo, cuando la muerte por violencia contra la mujer de la causante de la pensión o prestación de orfandad hubiera sido producida por un agresor distinto del progenitor de los hijos e hijas de la causante, se reconocerá el derecho a la pensión de orfandad con el incremento que correspondiese o, en su caso, la prestación de orfandad, cuando los rendimientos de la unidad de convivencia en que se integran no superen el mismo porcentaje establecido en el párrafo anterior. En otro caso, se suspenderá el derecho a su percibo.\n\nEn los supuestos anteriores, la suspensión tendrá efectos desde el día siguiente a aquél en que concurra la causa de la suspensión.\n\nEl derecho a la pensión o a la prestación se recuperará cuando los ingresos de la unidad de convivencia no superen los límites señalados anteriormente. La recuperación tendrá efectos desde el día siguiente a aquél en que se modifique la cuantía de los ingresos percibidos, siempre que se solicite dentro de los tres meses siguientes a la indicada fecha. En caso contrario, la pensión o prestación recuperada tendrá una retroactividad máxima de tres meses, a contar desde la solicitud.\n\nEn los casos en que se haya mantenido el percibo de la pensión o de la prestación de orfandad, aunque se haya constituido la adopción, la nueva pensión o prestación de orfandad que pudiese generarse como consecuencia del fallecimiento de una de las personas adoptantes, será incompatible con la pensión o prestación de orfandad que se venía percibiendo, debiendo optar por una de ellas.\n\nA los efectos previstos en este artículo, se presumirá la orfandad absoluta cuando se hubiera producido abandono de la responsabilidad familiar del progenitor supérstite y se hubiera otorgado el acogimiento o tutela de la persona huérfana por violencia contra la mujer a favor de terceros o familiares, así como en otros supuestos determinados reglamentariamente.\n\n3. Podrá ser beneficiario de la pensión de orfandad o de la prestación de orfandad, siempre que en la fecha del fallecimiento del causante fuera menor de veinticinco años, el hijo del causante que no efectúe un trabajo lucrativo por cuenta ajena o propia, o cuando realizándolo, los ingresos que obtenga resulten inferiores, en cómputo anual, a la cuantía vigente para el salario mínimo interprofesional, también en cómputo anual.\n\nSi el huérfano estuviera cursando estudios y cumpliera los veinticinco años durante el transcurso del curso escolar, la percepción de la pensión y la prestación de orfandad se mantendrá hasta el día primero del mes inmediatamente posterior al de inicio del siguiente al curso académico.\n\n4. La pensión de orfandad y la prestación de orfandad se abonará a quien tenga a su cargo a los beneficiarios según determinación reglamentaria.",

      "respuestas": 0,
      "law": "Artículo 12. Adscripción de bienes inmuebles a las entidades gestoras y los servicios comunes de la Seguridad Social. Procedimiento y efectos.\n1. Compete a la Tesorería General de la Seguridad Social adscribir a las entidades gestoras y a los servicios comunes de la Seguridad Social los inmuebles del patrimonio de la Seguridad Social necesarios para el desenvolvimiento de sus servicios, sin perjuicio de las facultades de dirección, vigilancia y tutela que corresponden al Ministerio de Inclusión, Seguridad Social y Migraciones.\n\n2. Con carácter previo a la adscripción, se incoará un sumario expediente administrativo a instancia de la entidad interesada, que deberá acreditar su necesidad.\n\nEl expediente de adscripción se entenderá implícito en el de adquisición cuando esta se lleve a cabo a solicitud de la entidad gestora o del servicio común de la Seguridad Social que la haya propuesto.\n\n3. Las entidades gestoras y los servicios comunes de la Seguridad Social comunicarán anualmente el plan de necesidades de los inmuebles que precisen para el normal desenvolvimiento de sus servicios a la Tesorería General de la Seguridad Social, sin perjuicio de que, por razón fundada, pueda proponerse en cualquier momento la modificación de dicho plan. La Tesorería General de la Seguridad Social, a la vista de las disponibilidades existentes o mediante la adquisición de los inmuebles pertinentes, procederá a la adscripción a la entidad gestora o al servicio común solicitante.\n\nPor los órganos competentes de la Tesorería General de la Seguridad Social y de la entidad gestora o del servicio común a que los bienes hayan de destinarse, se suscribirá un acta de adscripción, en la que constarán los extremos contenidos en la orden de cuyo cumplimiento se trate.\n\nEl original de dicha acta quedará en poder de la Tesorería General de la Seguridad Social y una copia de esta en la entidad gestora o en el servicio común destinatario del bien adscrito, que lo utilizará de acuerdo con el fin previsto, anotando la citada Tesorería General la adscripción en el Inventario general de bienes y derechos de la Seguridad Social.\n\n4. Corresponderá a la entidad gestora o al servicio común de la Seguridad Social al que se adscriba un inmueble realizar, desde la fecha de adscripción y con cargo a su presupuesto de gastos, todos los actos de conservación, cualquiera que sea su naturaleza y alcance, defensa, mejora, servicios y suministros del inmueble adscrito, así como el abono de todos los tributos que lo graven, bien en su totalidad o bien en la parte que le corresponda cuando se disfrute en régimen de comunidad.\n\nCuando el uso de un inmueble se encuentre compartido por dos o más entidades gestoras o servicios comunes de la Seguridad Social, la administración será ejercida por la entidad gestora o el servicio común que utilice mayor superficie y la totalidad de los gastos señalados en el párrafo anterior se prorrateará, exclusivamente, entre los usuarios en proporción a la superficie que ocupe cada uno de ellos en el inmueble, suscribiéndose, a tal efecto, un convenio.\n\nNo obstante, cuando el inmueble sea utilizado parcialmente por la Tesorería General de la Seguridad Social, su administración corresponderá a dicho servicio común y este asumirá la totalidad de los gastos señalados en el párrafo primero, previa puesta a disposición por las entidades gestoras o los servicios comunes usuarios de los créditos necesarios en proporción a la superficie ocupada.\n\nCorresponderá a la entidad gestora o al servicio común que tenga adscrito un inmueble que sea compartido con otras administraciones públicas o con terceros adoptar o suscribir los convenios necesarios relativos a su uso y mantenimiento, de acuerdo con lo establecido en los párrafos anteriores.\n\nEn el supuesto de que el inmueble se encuentre arrendado, total o parcialmente, a un tercero, la Tesorería General de la Seguridad Social ejercerá su administración, como titular de los derechos derivados de los contratos de arrendamiento. Si el uso del inmueble arrendado parcialmente estuviese compartido, será de aplicación lo dispuesto en el párrafo segundo, debiendo, en su caso, la entidad gestora o el servicio común que ostente la administración del inmueble facilitar a la Tesorería General de la Seguridad Social la documentación e información necesaria para el ejercicio de las funciones que le correspondan como arrendadora.\n\n5. Cuando la entidad gestora o el servicio común que tuviera adscrito el bien inmueble dejare de necesitarlo para el desenvolvimiento de sus servicios, lo pondrá en conocimiento de la Tesorería General de la Seguridad Social para que, por la misma, se disponga sobre dicho bien.\n\nLa entidad gestora o el servicio común deberá comunicar a la Tesorería General de la Seguridad Social, al menos con seis meses de antelación, la fecha en que dejará de necesitar el inmueble.\n\nLa Tesorería General de la Seguridad Social dictará resolución de desadscripción, previa regularización, en su caso, de la situación física y jurídica del inmueble por la entidad gestora o el servicio común que lo tuviera adscrito.\n\nLa entidad gestora o el servicio común al que figuraba adscrito el inmueble seguirá asumiendo los gastos a que se refiere el apartado anterior hasta el final del ejercicio económico en el que se dicte la resolución de desadscripción, salvo que antes de finalizar el mismo se produzca la adscripción a otra entidad gestora o servicio común o sea objeto de explotación por la Tesorería General de la Seguridad Social.",

      "law": "Artículo 214. Pensión de jubilación activa.\n1. Siempre que en la fecha de cumplimiento de la edad que en cada caso resulte de aplicación según lo establecido en el artículo 205.1.a), se hubiera reunido el periodo mínimo de cotización establecido en el artículo 205.1.b), y entre dicha fecha y la del hecho causante de la pensión de jubilación haya transcurrido al menos un año, la percepción de la pensión de jubilación, en su modalidad contributiva, será compatible con la realización de cualquier trabajo por cuenta ajena, a tiempo completo o a tiempo parcial, o por cuenta propia del pensionista. A efectos del cómputo de la edad, no serán admisibles jubilaciones acogidas a bonificaciones o anticipaciones.\n\nSi el periodo mínimo de cotización se reuniera en una fecha posterior a la del cumplimiento de la edad ordinaria de jubilación, el periodo mínimo de un año se computará entre dicha fecha y la del hecho causante de la pensión de jubilación.\n\n2. La cuantía de la pensión de jubilación compatible con el trabajo será equivalente a un porcentaje del importe resultante en el reconocimiento inicial en los términos establecidos en el artículo 210 de esta Ley o la que esté percibiendo, incluido el complemento de maternidad o el de la brecha de género cuando se perciba, y excluido, en todo caso, el complemento por mínimos cualquiera que sea la jornada laboral o la actividad que realice el pensionista; este porcentaje del importe de la pensión de jubilación se calculará en función del número de años que se haya demorado el acceso a dicha pensión de acuerdo con la siguiente escala:\n\na) Si se demora un año el acceso a la pensión de jubilación de acuerdo con lo establecido en el apartado 1.a), el porcentaje será del 45 por ciento de la pensión.\n\nb) Si se demora dos años el acceso a la pensión de jubilación, el porcentaje a percibir será del 55 por ciento de la pensión.\n\nc) Si se demora tres años el acceso a la pensión de jubilación, el porcentaje será del 65 por ciento de la pensión.\n\nd) Si se demora cuatro años el acceso a la pensión de jubilación, el porcentaje será del 80 por ciento de la pensión.\n\ne) Si se demora cinco años o más el acceso a la pensión de jubilación, el porcentaje será del 100 por ciento de la pensión.\n\nEl porcentaje que resulte de la escala anterior se incrementará 5 puntos porcentuales por cada 12 meses ininterrumpidos que permanezca en la situación de jubilación activa, con el máximo del 100 por ciento de la pensión. En el supuesto de trabajadores fijos discontinuos, para acreditar este periodo, se aplicará la regla general prevista en el artículo 247.2, párrafo primero, de esta ley.\n\nEste incremento comenzará a percibirse el día primero del mes de siguiente a aquel en que se haya cumplido dicho periodo de 12 meses.\n\nA efectos de la aplicación de los porcentajes establecidos en este apartado se tomarán años completos, sin que se equiparen a ellos las fracciones de estos.\n\n3. En el supuesto de que la actividad se realice por cuenta propia y se acredite tener contratado para la realización de la propia actividad, al menos, a un trabajador por cuenta ajena con carácter indefinido con una antigüedad mínima de 18 meses, o si se contrata con carácter indefinido a un nuevo trabajador por cuenta ajena que no haya tenido vínculo laboral con el trabajador autónomo en los dos años anteriores al inicio de la jubilación activa, la cuantía de la pensión compatible con el trabajo alcanzará el 75 por ciento, cuando la demora en el acceso a la pensión de jubilación haya sido entre uno y tres años, a partir del cuarto año será de aplicación lo previsto en el apartado anterior. En ambos supuestos, se aplicará el incremento de 5 puntos porcentuales por cada 12 meses ininterrumpidos que permanezca en la situación de jubilación activa en los términos previstos en el apartado 2.\n\nSi no se acreditan las condiciones establecidas en el párrafo anterior, se aplicará la escala prevista en el apartado 2.\n\n4. La cotización efectuada durante la situación de jubilación activa no dará lugar a ningún incremento del porcentaje aplicable a la base reguladora de la pensión que se tenga reconocida, ni tampoco incrementará el complemento económico de demora que hubiera correspondido.\n\n5. La pensión se revalorizará en su integridad en los términos establecidos para las pensiones del sistema de la Seguridad Social. No obstante, en tanto se mantenga el trabajo compatible, al importe de la pensión más las revalorizaciones acumuladas se le aplicará el porcentaje que corresponda conforme a lo dispuesto en este artículo.\n\n6. El pensionista no tendrá derecho a los complementos para pensiones inferiores a la mínima durante el tiempo en el que compatibilice la pensión con el trabajo.\n\n7. El beneficiario tendrá la consideración de pensionista a todos los efectos.\n\n8. Finalizada la relación laboral por cuenta ajena o el trabajo por cuenta propia, se restablecerá el percibo íntegro de la pensión de jubilación.\n\n9. La regulación contenida en este artículo se entenderá aplicable sin perjuicio del régimen jurídico previsto para cualesquiera otras modalidades de compatibilidad entre pensión y trabajo, establecidas legal o reglamentariamente.\n\nLas previsiones de este artículo no serán aplicables en los supuestos de desempeño de un puesto de trabajo o alto cargo en el sector público, delimitado en el párrafo segundo del artículo 1.1 de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del Personal al Servicio de las Administraciones Públicas, que será incompatible con la percepción de la pensión de jubilación.",
