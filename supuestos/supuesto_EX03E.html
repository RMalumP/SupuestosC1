<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
        Versión del MOTOR de la plantilla (el código que hace funcionar la
        página, no los datos del supuesto). El editor de Python la compara
        con la suya y, si el archivo se quedó atrás, ofrece ponerlo al día
        al guardar. Subir este número al cambiar el motor.
    -->
    <meta name="motor-plantilla" content="3">
    <title>[TÍTULO DE LA EVALUACIÓN]</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,600;1,8..60,300&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* ════════════════════════════════════════
           VARIABLES Y RESET
        ════════════════════════════════════════ */
        :root {
            /* Versión "r,g,b" de los colores base: permite construir
               transparencias — rgba(var(--gold-rgb),0.3) — de modo que al
               cambiar la paleta desde el editor cambie TODA la página y no
               solo los colores planos. */
            --gold-rgb:    143,196,217;
            --navy-rgb:    61,42,32;
            --crimson-rgb: 139,26,26;
            --forest-rgb:  26,71,49;

            --navy:     #3d2a20;
            --navy-mid: #5c4033;
            --gold:     #8fc4d9;
            --gold-lt:  #b8dceb;
            --blue-deep: #2f6f93;
            --cream:    #fdf8f0;
            --parch:    #f7ece7;
            --crimson:  #8b1a1a;
            --forest:   #1a4731;
            --slate:    #4a5568;
            --ink:      #1a1a2e;
            --paper:    #fffef9;
            --shadow:   rgba(var(--navy-rgb),0.18);
            --radius:   4px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: var(--navy);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                repeating-linear-gradient(0deg, transparent, transparent 60px,
                    rgba(var(--gold-rgb),0.03) 60px, rgba(var(--gold-rgb),0.03) 61px),
                radial-gradient(ellipse at 20% 80%, rgba(var(--gold-rgb),0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(var(--crimson-rgb),0.06) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }

        /* ════════════════════════════════════════
           NAVEGACIÓN
        ════════════════════════════════════════ */
        #nav-header {
            background: var(--navy-mid);
            padding: 14px 20px;
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 3px solid var(--gold);
            display: flex; align-items: flex-start; gap: 6px; flex-wrap: nowrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        /* Rótulo de cada bloque dentro de la cabecera de navegación.
           Sustituye al antiguo rótulo fijo "PREGUNTAS": ahora cada bloque
           (supuesto o teoría) pone su propio nombre en su propio color. */
        .nav-group-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase;
            opacity: 0.9; line-height: 1.2; cursor: pointer;
            flex: 0 0 150px; text-align: right;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .nav-group-label:hover { opacity: 1; text-decoration: underline; }
        /* Cada bloque del examen ocupa su propia fila: nombre a la izquierda
           y sus casillas numeradas a la derecha. */
        #nav-boxes { display: flex; flex-direction: column; align-items: stretch; gap: 8px; flex: 1; min-width: 0; }
        .nav-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .nav-row + .nav-row { border-top: 1px solid rgba(var(--gold-rgb),0.18); padding-top: 8px; }
        /* Cabecera plegada: solo queda a la vista la fila del bloque actual */
        body.nav-plegada .nav-row { display: none; border-top: none; padding-top: 0; }
        body.nav-plegada .nav-row.fila-actual { display: flex; }
        /* Plegada de verdad: la fila del bloque actual ocupa UNA sola línea,
           por largo que sea el bloque. Las casillas que no caben no bajan a
           una segunda línea: se quedan fuera y se llega a ellas deslizando
           la fila a izquierda y derecha (con el dedo, la rueda o la barra).
           Al cambiar de pregunta o de bloque, la casilla activa se centra
           sola (ver centrarCasillaActiva). */
        body.nav-plegada .nav-row.fila-actual .nav-row-boxes {
            flex-wrap: nowrap;
            overflow-x: auto; overflow-y: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(var(--gold-rgb),0.45) transparent;
            padding-bottom: 4px;
        }
        body.nav-plegada .nav-row.fila-actual .nav-row-boxes::-webkit-scrollbar { height: 5px; }
        body.nav-plegada .nav-row.fila-actual .nav-row-boxes::-webkit-scrollbar-track { background: transparent; }
        body.nav-plegada .nav-row.fila-actual .nav-row-boxes::-webkit-scrollbar-thumb {
            background: rgba(var(--gold-rgb),0.45); border-radius: 3px;
        }
        /* Sin esto las casillas se encogerían hasta deformarse al no caber */
        body.nav-plegada .nav-row.fila-actual .nav-box { flex: 0 0 auto; }
        .nav-row-boxes { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
        .nav-box {
            width: 36px; height: 36px;
            border: 1.5px solid rgba(var(--gold-rgb),0.35);
            color: rgba(255,255,255,0.6);
            display: flex; align-items: center; justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700; font-size: 0.78rem;
            cursor: pointer; transition: all 0.25s; border-radius: var(--radius);
            background: rgba(255,255,255,0.04); user-select: none;
        }
        .nav-box:hover { border-color: var(--gold); color: var(--gold-lt); background: rgba(var(--gold-rgb),0.1); transform: translateY(-2px); }
        .nav-box.active { background: var(--gold); color: var(--ink); border-color: var(--gold); box-shadow: 0 0 12px rgba(var(--gold-rgb),0.4); }
        .nav-box.answered { background: rgba(var(--forest-rgb),0.7); color: #6fcf97; border-color: #2d8c5a; }
        .nav-box.answered.active { background: var(--gold); color: var(--ink); }
        .nav-box.nav-wrong { background: rgba(var(--crimson-rgb),0.75) !important; color: #fecaca !important; border-color: var(--crimson) !important; }
        .nav-box.nav-wrong.active { background: var(--gold) !important; color: var(--ink) !important; }

        /* ════════════════════════════════════════
           PANEL DE CONFIGURACIÓN (temporizador + modo corrección)
        ════════════════════════════════════════ */
        .settings-wrap { position: relative; margin-left: auto; flex-shrink: 0; }
        #settings-toggle {
            width: 36px; height: 36px;
            border: 1.5px solid rgba(var(--gold-rgb),0.35);
            border-radius: var(--radius);
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.7);
            font-size: 1.05rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.25s;
        }
        #settings-toggle:hover, #settings-toggle.open { border-color: var(--gold); color: var(--gold-lt); background: rgba(var(--gold-rgb),0.1); }

        /* Botón volver al menú principal (cabecera) */
        .home-btn {
            width: 36px; height: 36px; flex-shrink: 0;
            border: 1.5px solid rgba(var(--gold-rgb),0.35);
            border-radius: var(--radius);
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.7);
            font-size: 1.05rem; text-decoration: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.25s;
        }
        .home-btn:hover { border-color: var(--gold); color: var(--gold-lt); background: rgba(var(--gold-rgb),0.1); }
        #settings-panel {
            display: none;
            position: absolute; top: 44px; right: 0;
            width: 270px; background: var(--navy-mid);
            border: 1.5px solid var(--gold); border-radius: var(--radius);
            padding: 16px; z-index: 1001;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
        }
        #settings-panel.open { display: block; animation: fadeUp 0.2s ease; }
        .settings-title {
            font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; letter-spacing: 0.2em;
            color: var(--gold); opacity: 0.8; margin-bottom: 12px; text-transform: uppercase;
        }
        .settings-row { margin-bottom: 14px; }
        .settings-row:last-child { margin-bottom: 0; }
        .settings-row label {
            display: block; font-size: 0.78rem; color: rgba(255,255,255,0.75);
            margin-bottom: 6px; line-height: 1.4;
        }
        .settings-row .time-edit-line { display: flex; gap: 8px; }
        #time-input {
            flex: 1; min-width: 0; background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(var(--gold-rgb),0.3); border-radius: var(--radius);
            color: var(--cream); font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
            padding: 8px 10px; text-align: center;
        }
        #time-input:focus { outline: none; border-color: var(--gold); }
        .btn-mini {
            font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 12px;
            border: 1.5px solid var(--gold); border-radius: var(--radius);
            background: var(--gold); color: var(--ink); cursor: pointer; white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-mini:hover { background: var(--gold-lt); }
        .settings-check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .settings-check label { margin-bottom: 0; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .settings-check input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--gold); cursor: pointer; }
        /* Opción dependiente de la de arriba: va sangrada y con un filete
           que la ata a ella. Se apaga sola cuando no puede aplicarse. */
        .settings-row.settings-sub {
            margin-left: 14px; padding-left: 12px;
            border-left: 2px solid rgba(var(--gold-rgb),0.35);
            margin-top: -6px;
        }
        .settings-row.apagada { opacity: 0.45; }
        .settings-row.apagada label { cursor: default; }
        /* Una casilla por bloque dentro de la opción «de una en una» */
        #una-por-bloque { display: flex; flex-direction: column; gap: 6px; }
        #una-por-bloque label {
            display: flex; align-items: center; gap: 8px; margin-bottom: 0;
            cursor: pointer; font-size: 0.74rem; line-height: 1.3;
        }
        #una-por-bloque input[type="checkbox"] {
            width: 15px; height: 15px; accent-color: var(--gold); cursor: pointer; flex-shrink: 0;
        }
        /* Punto del color del bloque, para reconocerlo de un vistazo */
        #una-por-bloque .punto-bloque {
            width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
        }

        /* ════════════════════════════════════════
           TEMPORIZADOR
        ════════════════════════════════════════ */
        #timer {
            position: fixed; right: 24px; top: calc(var(--nav-h, 64px) + 16px);
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem; font-weight: 700; color: var(--gold);
            background: var(--navy-mid); padding: 10px 18px;
            border: 2px solid var(--gold); border-radius: var(--radius);
            z-index: 999; box-shadow: 0 0 30px rgba(var(--gold-rgb),0.2), 0 8px 32px rgba(0,0,0,0.4);
            letter-spacing: 0.05em; line-height: 1; text-align: center;
            min-width: 110px;
        }
        #timer .timer-label {
            display: block; font-size: 0.45rem; letter-spacing: 0.3em;
            color: rgba(var(--gold-rgb),0.6); margin-bottom: 4px;
        }
        #timer.warn10 { color: #f59e0b; border-color: #f59e0b; }
        #timer.warn5  { color: #ef4444; border-color: #ef4444; animation: pulse-timer 0.7s infinite; }
        #timer.warn1  { color: #fff; border-color: #ef4444; background: #7f1d1d; animation: pulse-timer 0.4s infinite; }
        #timer { cursor: pointer; user-select: none; }
        #timer.paused { opacity: 0.55; animation: none !important; }
        #timer.paused .timer-label::after { content: ' · PAUSA'; }
        @keyframes pulse-timer {
            0%,100% { box-shadow: 0 0 10px rgba(239,68,68,0.3); }
            50%      { box-shadow: 0 0 30px rgba(239,68,68,0.8); }
        }

        /* ════════════════════════════════════════
           CONTENEDOR Y ESTRUCTURA
        ════════════════════════════════════════ */
        .container { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; position: relative; z-index: 1; }

        .inst-header {
            background: var(--navy-mid); border: 1px solid rgba(var(--gold-rgb),0.25);
            border-radius: var(--radius); padding: 28px 36px; margin-bottom: 8px;
            text-align: center; position: relative; overflow: hidden;
        }
        .inst-header::before {
            content: ''; position: absolute; top:0; left:0; right:0; height:3px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--crimson), var(--gold), transparent);
        }
        .inst-header .escudo { font-size: 2.2rem; margin-bottom: 8px; display: block; }
        .inst-header .logo-img { max-height: 64px; width: auto; margin-bottom: 10px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35)); }
        .inst-header .organismo { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; letter-spacing: 0.3em; color: var(--gold); opacity: 0.8; padding-top: 8px; border-top: 1px solid rgba(184,220,235,0.3); display: inline-block; }
        .inst-header h1 { font-family: 'Playfair Display', serif; font-size: 1.35rem; font-weight: 900; color: var(--cream); margin: 8px 0 4px; letter-spacing: 0.04em; }
        .inst-header .meta-strip { display: flex; justify-content: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
        .meta-pill { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 0.15em; color: rgba(var(--gold-rgb),0.8); background: rgba(var(--gold-rgb),0.08); border: 1px solid rgba(var(--gold-rgb),0.2); padding: 5px 14px; border-radius: 2px; }

        /* ════════════════════════════════════════
           ENUNCIADO
        ════════════════════════════════════════ */
        .statement {
            background: var(--paper); border: 1px solid rgba(var(--gold-rgb),0.2);
            border-radius: var(--radius); padding: 48px 52px; margin-bottom: 32px;
            position: relative; box-shadow: 0 16px 48px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.8);
            line-height: 1.9;
        }
        .statement::after {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(transparent, transparent 31px, rgba(var(--gold-rgb),0.06) 31px, rgba(var(--gold-rgb),0.06) 32px);
            pointer-events: none; border-radius: var(--radius);
        }
        .statement-header { display: flex; align-items: flex-start; gap: 24px; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 2px solid var(--gold); position: relative; z-index: 1; }
        .exp-number { flex-shrink: 0; width: 64px; height: 64px; background: var(--navy-mid); color: var(--gold); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; border-radius: var(--radius); }
        .statement-title-block h2 { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; color: var(--ink); line-height: 1.3; text-transform: uppercase; letter-spacing: 0.05em; }
        .statement-title-block .ref { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; letter-spacing: 0.2em; color: var(--blue-deep); margin-top: 4px; display: block; }
        .statement p { font-size: 0.95rem; color: #2d3748; margin-bottom: 18px; position: relative; z-index: 1; }
        .statement strong { color: var(--ink); font-weight: 600; }
        .statement em { color: var(--crimson); font-style: italic; }
        .fact-block { background: rgba(var(--navy-rgb),0.04); border-left: 4px solid var(--gold); padding: 16px 20px; margin: 20px 0; border-radius: 0 var(--radius) var(--radius) 0; position: relative; z-index: 1; }
        .fact-block.red { border-left-color: var(--crimson); background: rgba(var(--crimson-rgb),0.04); }
        .fact-block .fact-title { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; letter-spacing: 0.25em; color: var(--blue-deep); text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
        .fact-block.red .fact-title { color: var(--crimson); }
        .timeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 2px; margin: 24px 0; position: relative; z-index: 1; }
        .tl-item { background: var(--navy-mid); color: var(--cream); padding: 12px 14px; text-align: center; font-size: 0.75rem; line-height: 1.4; }
        .tl-item:first-child { border-radius: var(--radius) 0 0 var(--radius); }
        .tl-item:last-child  { border-radius: 0 var(--radius) var(--radius) 0; }
        .tl-item .tl-date { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--gold); font-weight: 700; display: block; margin-bottom: 4px; }
        .tl-item.red-event { background: var(--crimson); }
        .tl-item.red-event .tl-date { color: var(--gold-lt); }

        /* Panel de enunciado incrustado en el hilo del examen.
           Cada grupo de preguntas lleva el suyo justo delante, de modo que
           en el modo "en cadena" se lee enunciado 1 → sus preguntas →
           enunciado 2 → sus preguntas, y de una en una solo se ve el del
           enunciado al que pertenece la pregunta actual. */
        .stmt-panel { display: none; }
        .stmt-panel.visible { display: block; }

        /* Aviso del modo foco: el enunciado sale recortado a los hechos
           vinculados a la pregunta, con un botón para verlo entero. */
        .stmt-foco {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            background: rgba(var(--gold-rgb),0.12);
            border: 1px dashed rgba(var(--gold-rgb),0.7);
            border-radius: var(--radius); padding: 10px 14px; margin-bottom: 18px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
            letter-spacing: 0.06em; line-height: 1.6; color: var(--slate);
            position: relative; z-index: 1;
        }
        .stmt-foco .btn-foco {
            margin-left: auto; cursor: pointer; white-space: nowrap;
            font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
            letter-spacing: 0.12em; text-transform: uppercase;
            padding: 6px 12px; border-radius: var(--radius);
            border: 1.5px solid var(--blue-deep); background: transparent;
            color: var(--blue-deep); transition: all 0.2s;
        }
        .stmt-foco .btn-foco:hover { background: var(--blue-deep); color: var(--cream); }
        
        /* Clase para ocultar elementos */
        .hide { display: none; visibility: hidden; }

        /* ════════════════════════════════════════
           TARJETAS PREGUNTA
        ════════════════════════════════════════ */
        .question-card {
            background: var(--paper); border: 1px solid rgba(var(--gold-rgb),0.15);
            border-radius: var(--radius); padding: 36px 44px;
            display: none; margin-bottom: 24px;
            box-shadow: 0 8px 32px var(--shadow);
            animation: fadeUp 0.35s ease; position: relative; overflow: hidden;
        }
        .question-card::before { content: ''; position: absolute; top:0; left:0; width:6px; height:100%; background: linear-gradient(180deg, var(--gold), var(--crimson)); }
        .question-card.active { display: block; }
        /* Modo "en cadena": se ven varias tarjetas del mismo bloque a la vez.
           La tarjeta en la que está el usuario se resalta con un halo. */
        .question-card.visible { display: block; }
        .question-card.encadenada.active { box-shadow: 0 8px 32px var(--shadow), 0 0 0 2px var(--gold); }

        /* Cabecera de sección de cada bloque (encima de sus preguntas) */
        .block-header {
            display: none; align-items: center; gap: 14px; flex-wrap: wrap;
            background: var(--paper); border-left: 6px solid var(--gold);
            border-radius: var(--radius); padding: 14px 20px; margin-bottom: 20px;
            box-shadow: 0 6px 24px var(--shadow); position: relative; z-index: 1;
        }
        .block-header.visible { display: flex; }
        .block-header .bh-tipo {
            font-family: 'JetBrains Mono', monospace; font-size: 0.55rem;
            letter-spacing: 0.2em; text-transform: uppercase;
            border: 1.5px solid; border-radius: var(--radius); padding: 4px 8px;
        }
        .block-header h3 {
            font-family: 'Playfair Display', serif; font-size: 1.15rem;
            color: var(--ink); font-weight: 700; margin: 0; flex: 1;
        }
        .block-header .bh-datos {
            font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
            letter-spacing: 0.08em; color: var(--slate); text-align: right; line-height: 1.6;
        }

        /* Desglose por bloques dentro del marcador */
        .score-bloques { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
        .score-bloques .sb-fila {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            background: rgba(255,255,255,0.05); border-left: 4px solid var(--gold);
            border-radius: var(--radius); padding: 8px 12px; text-align: left;
        }
        .score-bloques .sb-nombre {
            font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
            letter-spacing: 0.14em; text-transform: uppercase; flex: 1; min-width: 120px;
        }
        .score-bloques .sb-detalle {
            font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
            color: rgba(255,255,255,0.65); letter-spacing: 0.06em;
        }
        .score-bloques .sb-puntos {
            font-family: 'Playfair Display', serif; font-size: 1.1rem;
            font-weight: 700; color: var(--cream); min-width: 92px; text-align: right;
        }
        /* Separador de bloque dentro de la corrección completa */
        .corr-bloque {
            font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
            letter-spacing: 0.2em; text-transform: uppercase;
            border-bottom: 2px solid; padding: 14px 4px 6px; margin: 22px 0 12px;
        }
        @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

        .q-header { display: flex; align-items: flex-start; gap: 18px; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid rgba(var(--gold-rgb),0.2); }
        .q-num { flex-shrink:0; font-family:'Playfair Display',serif; font-size:2.5rem; font-weight:900; color:rgba(0,0,0,0.15); line-height:1; min-width:50px; }
        .q-body { flex: 1; }
        .q-tag { font-family:'JetBrains Mono',monospace; font-size:0.55rem; letter-spacing:0.25em; color:var(--ink); text-transform:uppercase; margin-bottom:8px; display:block; }
        body.hide-qtags .q-tag { display: none; }
        .q-text { font-family:'Source Serif 4',serif; font-size:1.0rem; font-weight:600; color:var(--ink); line-height:1.6; }

        .options-grid { display:flex; flex-direction:column; gap:10px; margin-top:20px; }
        .option { display:flex; align-items:flex-start; gap:14px; padding:14px 18px; border:1.5px solid rgba(var(--gold-rgb),0.15); border-radius:var(--radius); cursor:pointer; transition:all 0.2s; font-size:0.9rem; color:var(--ink); line-height:1.5; background:rgba(255,255,255,0.5); }
        .option:hover { border-color:var(--blue-deep); background:rgba(var(--gold-rgb),0.1); transform:translateX(4px); }
        .option.selected { border-color:var(--navy-mid); background:rgba(var(--navy-rgb),0.06); font-weight:500; }
        .option.correct { border-color:var(--forest); background:rgba(var(--forest-rgb),0.10); color:var(--forest); font-weight:600; }
        .option.wrong   { border-color:var(--crimson); background:rgba(var(--crimson-rgb),0.07); color:var(--crimson); text-decoration:line-through; }
        .opt-letter { flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--navy-mid); color:var(--gold); font-family:'JetBrains Mono',monospace; font-size:0.7rem; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px; }
        /* Respuesta múltiple: la insignia pasa de redonda a cuadrada, como
           una casilla de verificación, para que se vea de un vistazo que
           se puede marcar más de una. */
        .option.multi .opt-letter { border-radius:5px; }
        .multi-aviso {
            font-family:'JetBrains Mono',monospace; font-size:0.58rem; letter-spacing:0.18em;
            text-transform:uppercase; color:var(--blue-deep); margin-top:18px;
            display:flex; align-items:center; gap:8px;
        }
        .multi-aviso::before { content:'☑'; font-size:0.9rem; }
        .multi-aviso + .options-grid { margin-top:8px; }
        .option.correct .opt-letter { background:var(--forest); color:var(--cream); }
        .option.wrong   .opt-letter { background:var(--crimson); color:var(--cream); }

        /* FEEDBACK */
        .feedback { display:none; margin-top:24px; border-radius:var(--radius); overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,0.08); }
        .feedback-header { background:var(--navy-mid); padding:12px 20px; display:flex; align-items:center; gap:10px; }
        .feedback-header span { font-family:'JetBrains Mono',monospace; font-size:0.6rem; letter-spacing:0.2em; color:var(--gold); text-transform:uppercase; }
        .feedback-body { background:var(--parch); padding:18px 20px; font-size:0.875rem; line-height:1.7; color:var(--slate); border:1px solid rgba(var(--gold-rgb),0.15); border-top:none; }
        .feedback-body .tip { margin-top:10px; padding:10px 14px; background:rgba(var(--forest-rgb),0.08); border-left:3px solid #2d8c5a; border-radius:0 var(--radius) var(--radius) 0; font-size:0.83rem; color:var(--forest); }
        .feedback-body .tip::before { content:'💡 '; }

        /* BARRA DE PROGRESO */
        .progress-bar-wrap { height:4px; background:rgba(var(--gold-rgb),0.1); border-radius:2px; margin-bottom:28px; overflow:hidden; }
        .progress-bar-fill { height:100%; background:linear-gradient(90deg, var(--gold), var(--crimson)); border-radius:2px; transition:width 0.4s; }

        /* BOTONES */
        .btn-zone { display:flex; justify-content:center; align-items:center; gap:12px; margin-top:32px; flex-wrap:wrap; }
        .btn { font-family:'JetBrains Mono',monospace; font-size:0.72rem; letter-spacing:0.15em; text-transform:uppercase; font-weight:700; padding:14px 22px; border:1.5px solid var(--blue-deep); border-radius:var(--radius); cursor:pointer; transition:all 0.2s; background:transparent; color:var(--blue-deep); white-space:nowrap; }
        .btn:hover { background:var(--blue-deep); color:var(--cream); transform:translateY(-2px); box-shadow:0 6px 20px rgba(47,111,147,0.3); }
        .btn-primary { background:var(--navy-mid); color:var(--gold); border-color:var(--navy-mid); }
        .btn-primary:hover { background:var(--navy-mid); }
        .btn-danger { background:var(--crimson); color:var(--cream); border-color:var(--crimson); display:none; }
        .btn-danger:hover { background:#a01515; border-color:#a01515; color:#fff; }
        .btn-success { background:var(--forest); color:#a7f3d0; border-color:var(--forest); display:none; }
        .btn-success:hover { background:#1f5c3a; }
        .btn-info { background:var(--navy-mid); color:var(--gold-lt); border-color:rgba(var(--gold-rgb),0.4); display:none; }
        .btn-info:hover { background:rgba(var(--gold-rgb),0.15); }
        .btn-send { background:var(--blue-deep); color:var(--cream); border-color:var(--blue-deep); display:none; }
        .btn-send:hover { background:#24576f; }
        .btn-send:disabled { opacity:0.55; cursor:not-allowed; }

        /* ════════════════════════════════════════
           OVERLAY TIEMPO AGOTADO
        ════════════════════════════════════════ */
        #overlay {
            display:none; position:fixed; inset:0;
            background:rgba(var(--navy-rgb),0.98); z-index:9999;
            flex-direction:column; align-items:center; justify-content:center;
            text-align:center; padding:40px; overflow-y:auto;
        }
        #overlay.show { display:flex; animation:fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

        .overlay-content { max-width: 680px; width: 100%; position: relative; }

        #overlay-close {
            position: fixed; top: 20px; right: 24px;
            width: 42px; height: 42px;
            border: 1.5px solid rgba(var(--gold-rgb),0.5); border-radius: 50%;
            background: var(--navy-mid); color: var(--gold-lt);
            font-size: 1.4rem; line-height: 1; font-family: 'JetBrains Mono', monospace;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10000; transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        #overlay-close:hover { background: var(--crimson); border-color: var(--crimson); color: #fff; transform: rotate(90deg); }

        /* ════════════════════════════════════════
           MODAL — ELECCIÓN DE ALEATORIEDAD AL REPETIR
        ════════════════════════════════════════ */
        #random-modal {
            display: none; position: fixed; inset: 0; z-index: 10500;
            background: rgba(26,26,46,0.72);
            align-items: center; justify-content: center; padding: 24px;
        }
        #random-modal.show { display: flex; animation: fadeIn 0.2s ease; }
        .modal-box {
            background: var(--navy-mid); border: 1.5px solid var(--gold);
            border-radius: var(--radius); padding: 28px 30px; max-width: 440px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center;
        }
        .modal-box h3 { font-family:'Playfair Display',serif; color: var(--cream); font-size: 1.2rem; margin-bottom: 10px; }
        .modal-box p { color: rgba(255,255,255,0.7); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.5; }
        .modal-box .btn { width: 100%; margin-bottom: 10px; white-space: normal; line-height: 1.4; display: inline-flex; align-items: center; justify-content: center; }
        .modal-box .btn:last-child { margin-bottom: 0; }
        /* Variantes propias del modal (las clases .btn-info / .btn-danger están
           ocultas por defecto fuera de aquí, ya que se controlan por JS en la
           botonera principal, así que no se reutilizan dentro del modal). */
        .btn-modal-a { background: var(--navy-mid); color: var(--gold); border-color: var(--navy-mid); }
        .btn-modal-a:hover { background: var(--navy-mid); }
        .btn-modal-b { background: var(--crimson); color: var(--cream); border-color: var(--crimson); }
        .btn-modal-b:hover { background: #a01515; border-color: #a01515; color: #fff; }

        /* ════════════════════════════════════════
           GREMLIN SVG ANIMADO
        ════════════════════════════════════════ */
        #gremlin-wrap {
            margin: 0 auto 20px;
            width: 220px; height: 200px;
            position: relative;
        }

        #gremlin-svg { width: 220px; height: 200px; }

        /* Oscilación cuerpo */
        @keyframes bodyShake {
            0%,100% { transform: rotate(-4deg) translateX(0); }
            25%      { transform: rotate(5deg) translateX(3px); }
            50%      { transform: rotate(-3deg) translateX(-3px); }
            75%      { transform: rotate(4deg) translateX(2px); }
        }
        #gremlin-body { transform-origin: 110px 130px; animation: bodyShake 0.35s infinite; }

        /* Tirón del cable */
        @keyframes cablePull {
            0%,100% { transform: translateX(0) scaleY(1); }
            40%      { transform: translateX(-18px) scaleY(0.85); }
            60%      { transform: translateX(-22px) scaleY(0.82); }
            80%      { transform: translateX(-10px) scaleY(0.93); }
        }
        #cable { transform-origin: 200px 155px; animation: cablePull 0.6s infinite ease-in-out; }

        /* Pantalla parpadeo */
        @keyframes screenFlicker {
            0%,90%,100% { opacity: 1; }
            92%          { opacity: 0.1; }
            95%          { opacity: 0.8; }
            97%          { opacity: 0.05; }
        }
        #screen-glow { animation: screenFlicker 1.4s infinite; }

        /* Ojos parpadeantes */
        @keyframes eyeBlink {
            0%,92%,100% { transform: scaleY(1); }
            95%          { transform: scaleY(0.05); }
        }
        #eye-l, #eye-r { transform-origin: center; animation: eyeBlink 2.3s infinite; }

        /* Texto overlay */
        #overlay h1 { font-family:'Playfair Display',serif; font-size:2.4rem; color:var(--gold); margin-bottom:10px; font-weight:900; }
        #overlay .sub { color:rgba(255,255,255,0.55); font-size:0.95rem; margin-bottom:24px; line-height:1.6; }

        /* ════════════════════════════════════════
           PANEL DE RESULTADOS (corrección completa)
        ════════════════════════════════════════ */
        #correction-panel {
            display: none; text-align: left;
            background: var(--paper); border-radius: var(--radius);
            padding: 0; margin-top: 24px;
            max-height: 55vh; overflow-y: auto;
            border: 1px solid rgba(var(--gold-rgb),0.2);
        }
        .corr-item { padding: 20px 24px; border-bottom: 1px solid rgba(var(--gold-rgb),0.1); }
        .corr-item:last-child { border-bottom: none; }
        .corr-item .ci-header { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
        .ci-badge { width: 32px; height: 32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:0.75rem; font-weight:700; flex-shrink:0; }
        .ci-badge.ok  { background:var(--forest); color:var(--cream); }
        .ci-badge.err { background:var(--crimson); color:var(--cream); }
        .ci-badge.skip { background:#374151; color:#9ca3af; }
        .ci-q { font-size:0.88rem; font-weight:600; color:var(--ink); line-height:1.4; }
        .ci-answers { font-size:0.82rem; color:#374151; margin: 6px 0 10px 44px; }
        .ci-answers .given { margin-bottom:3px; }
        .ci-answers .given.wrong { color:var(--crimson); }
        .ci-answers .correct-ans { color:var(--forest); font-weight:600; }
        .ci-law { margin-left:44px; font-size:0.8rem; background:rgba(var(--navy-rgb),0.05); border-left:3px solid var(--gold); padding:10px 14px; border-radius:0 var(--radius) var(--radius) 0; color:var(--slate); line-height:1.6; }
        .ci-tip { margin: 8px 0 0 44px; font-size:0.78rem; background:rgba(var(--forest-rgb),0.07); border-left:3px solid #2d8c5a; padding:8px 12px; border-radius:0 var(--radius) var(--radius) 0; color:var(--forest); }
        .ci-tip::before { content:'💡 '; }

        /* Score banner dentro del overlay */
        .score-banner { background:var(--navy-mid); border:1px solid var(--gold); border-radius:var(--radius); padding:20px 28px; margin:16px 0; text-align:center; }
        .score-big { font-family:'Playfair Display',serif; font-size:3.5rem; font-weight:900; color:var(--gold); line-height:1; }
        .score-lbl { font-family:'JetBrains Mono',monospace; font-size:0.6rem; letter-spacing:0.2em; color:rgba(255,255,255,0.4); margin-top:4px; }
        .score-verdict { font-size:1rem; margin-top:10px; font-weight:600; }
        .score-verdict.apto    { color:#6fcf97; }
        .score-verdict.no-apto { color:#fc8181; }

        /* ════════════════════════════════════════
           PRINT / PDF
        ════════════════════════════════════════ */
        @media print {
            body { background: white !important; color: black !important; }
            #nav-header, #timer, #overlay, #random-modal, .btn-zone, body::before { display:none !important; }
            .container { max-width:100%; padding:20px; }
            .statement { box-shadow:none; border:1px solid #ccc; }
            .question-card { display:block !important; box-shadow:none; border:1px solid #ccc; page-break-inside:avoid; margin-bottom:16px; }
            .block-header { display:flex !important; box-shadow:none; border:1px solid #ccc; page-break-after:avoid; }
            .stmt-panel { display:block !important; page-break-after:avoid; }
            .stmt-foco { display:none !important; }
            .block-header h3 { color:#000 !important; }
            .score-bloques .sb-fila { background:#f3f4f6 !important; }
            .score-bloques .sb-nombre, .score-bloques .sb-detalle, .score-bloques .sb-puntos { color:#111827 !important; }
            .question-card::before { display:none; }
            .feedback { display:block !important; }
            .inst-header { background:#f0f0f0 !important; color:black !important; }
            .inst-header h1, .inst-header .organismo { color:black !important; }
            .inst-header::before { display:none; }
            .progress-bar-wrap { display:none; }
            .fact-block { border-left-color:#999; }
            .timeline { display:none; }
            .option { border-color:#ccc; color:black !important; background:white !important; }
            .option.correct { background:#e6f4ea !important; border-color:#2d8c5a !important; color:#1a4731 !important; }
            .option.wrong   { background:#fde8e8 !important; border-color:#8b1a1a !important; color:#8b1a1a !important; }
            .option.selected:not(.correct):not(.wrong) { background:#f0f4ff !important; border-color:#3b5bdb !important; }
            .feedback-body { background:#fafafa !important; }
            .feedback-body .tip { background:#e9f5ee !important; color:#1a4731 !important; }
            .q-num { color:#ddd !important; }
            #print-title { display:block !important; }
        }
        #print-title { display:none; }

        @media (max-width: 680px) {
            .statement { padding: 28px 24px; }
            .question-card { padding: 24px 20px; }
            #timer { font-size:1.4rem; padding:8px 12px; top:calc(var(--nav-h, 56px) + 12px); right:10px; min-width:90px; }
            .statement-header { flex-direction:column; gap:12px; }
            .timeline { grid-template-columns:1fr 1fr; }
            #settings-panel { width: 240px; right: -8px; }
            #overlay-close { top: 12px; right: 12px; width: 38px; height: 38px; }

            /* La cabecera nunca baja de línea: los botones de casa y
               configuración quedan siempre visibles, y las casillas de
               pregunta pasan a desplazarse en horizontal dentro de su fila. */
            #nav-header { flex-wrap: nowrap; }
            #nav-boxes { gap: 6px; }
            .nav-row-boxes { flex-wrap: nowrap; overflow-x: auto; min-width: 0; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
            .nav-box { flex-shrink: 0; }
            .nav-group-label { flex-basis: 68px; font-size: 0.48rem; letter-spacing: 0.08em; white-space: normal; }
            .home-btn, .settings-wrap { flex-shrink: 0; }
        }
    </style>
</head>
<body>

<!-- NAVEGACIÓN -->
<nav id="nav-header">
    <div id="nav-boxes"></div>

    <button id="fold-btn" class="home-btn" onclick="togglePlegado()"
            title="Plegar: ver solo el bloque actual" aria-label="Plegar bloques"
            style="display:none;">⌃</button>

    <button id="home-btn-top" class="home-btn" onclick="goHome()"
            title="Volver al menú principal" aria-label="Volver al menú principal">🏠</button>

    <div class="settings-wrap">
        <button id="settings-toggle" onclick="toggleSettings()" title="Configuración del temporizador" aria-label="Configuración">⚙</button>
        <div id="settings-panel">
            <div class="settings-title" id="settings-title">Configuración</div>
            <div class="settings-row" id="row-tiempo">
                <label for="time-input"><span id="lbl-tiempo">Duración del examen (mm:ss)</span></label>
                <div class="time-edit-line">
                    <input type="text" id="time-input" placeholder="30:00">
                    <button class="btn-mini" onclick="applyTimer()">Aplicar</button>
                </div>
            </div>
            <div class="settings-row settings-check" id="row-corregir">
                <label>
                    <input type="checkbox" id="instant-feedback-toggle" onchange="toggleInstantFeedback(this.checked)">
                    <span id="lbl-corregir">Corregir pregunta a pregunta</span>
                </label>
            </div>
            <!--
                UNA CASILLA POR BLOQUE. El examen puede tener un bloque o
                cinco, así que estas casillas las crea sola la página al
                arrancar (ver montarOpcionesUnaEnUna): una por cada bloque
                que salga en el intento y que no esté marcado como oculto
                en el editor. Sin marcar = ese bloque se ve EN CADENA.
            -->
            <div class="settings-row" id="row-una">
                <label><span id="lbl-una">Ver las preguntas de una en una</span></label>
                <div id="una-por-bloque"></div>
            </div>
            <div class="settings-row settings-check settings-sub" id="row-foco">
                <label>
                    <input type="checkbox" id="foco-toggle" onchange="toggleModoFoco(this.checked)">
                    <span id="lbl-foco">Modo foco: solo los hechos de cada pregunta</span>
                </label>
            </div>
            <div class="settings-row settings-check" id="row-qtags">
                <label>
                    <input type="checkbox" id="hide-qtags-toggle" onchange="toggleHideQTags(this.checked)">
                    <span id="lbl-qtags">Ocultar etiquetas de pregunta (q-tag)</span>
                </label>
            </div>
        </div>
    </div>
</nav>

<!-- TEMPORIZADOR -->
<div id="timer" onclick="toggleTimerPause()" title="Clic para pausar / reanudar">
    <span class="timer-label">TIEMPO RESTANTE</span>
    <span id="timer-display">30:00</span>
</div>

<!-- ══════════════════════════════════════════
     CONTENIDO PRINCIPAL
══════════════════════════════════════════ -->
<div class="container">

    <!--
        Título, referencia, ámbito y minutos NO se editan aquí: se rellenan
        automáticamente en el arranque a partir de EXAM_CONFIG (al principio
        de la ZONA EDITABLE del bloque de JavaScript, al final de la
        página). El nº de preguntas se calcula solo, contando
        QUESTIONS_BANK. Así solo hay un sitio donde tocar
        estos datos y nunca queda desactualizado un lugar y otro no.
    -->

    <!-- Título para impresión -->
    <div id="print-title" style="text-align:center; margin-bottom:24px; font-family:'Playfair Display',serif;">
        <h1 id="print-title-h1" style="font-size:1.4rem; color:#3d2a20;"></h1>
        <p id="print-title-sub" style="font-size:0.85rem; color:#555; margin-top:4px;"></p>
        <p id="print-fecha" style="font-size:0.8rem; color:#777; margin-top:4px;"></p>
    </div>

    <!-- CABECERA INSTITUCIONAL -->
    <header class="inst-header">
        <img id="inst-logo" class="logo-img" src="" alt="">
        <div class="organismo" id="inst-organismo"></div>
        <h1 id="inst-title"></h1>
        <div class="meta-strip">
            <span class="meta-pill" id="meta-preguntas"></span>
            <span class="meta-pill" id="meta-minutos"></span>
            <span class="meta-pill" id="meta-legislacion"></span>
            <span class="meta-pill" id="meta-referencia"></span>
        </div>
    </header>

    <!--
        ENUNCIADOS
        ──────────
        Ya no hay un panel fijo de enunciado encima de la página: cada
        enunciado se pinta DENTRO del hilo de preguntas (#quiz-container),
        justo delante del grupo de preguntas al que pertenece y debajo de
        la cabecera de su bloque. Así el documento se lee en su orden
        natural: cabecera del bloque → enunciado 1 → sus preguntas →
        enunciado 2 → sus preguntas…

        Cada pregunta de QUESTIONS_BANK indica a qué enunciado pertenece
        mediante "statementId"; una pregunta con statementId null/ausente es
        una "pregunta suelta" y no muestra ningún bloque de hechos.

        Estructura disponible dentro de cada enunciado (ver STATEMENTS_BANK):
        - factBlocks[]  → bloques de hechos (borde dorado; "red:true" = borde rojo/crítico)
                          cada uno con su "id" (H1, H2…) para poder vincularle preguntas
        - timeline[]    → hitos de la línea de tiempo ("red:true" = hito crítico)
        - "hidden:true" en cualquier factBlock/hito lo omite del renderizado
          (útil para preparar variantes de un mismo supuesto sin borrar datos).

        Cada pregunta puede además vincularse a uno o varios bloques de
        hechos concretos con "factIds": en el MODO FOCO (⚙, dentro de «ver
        las preguntas de una en una») el enunciado se recorta a esos hechos.
    -->

    <!-- BARRA DE PROGRESO -->
    <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>

    <!-- PREGUNTAS -->
    <div id="quiz-container"></div>

    <!-- BOTONERA -->
    <div class="btn-zone">
        <button id="prev-btn" class="btn btn-primary" onclick="move(-1)">← Anterior</button>
        <button id="next-btn" class="btn btn-primary" onclick="move(1)">Siguiente →</button>

      "law": "Artículo 55. Estructura de la Administración General del Estado.\n1. La organización de la Administración General del Estado responde a los principios de división funcional en Departamentos ministeriales y de gestión territorial integrada en Delegaciones del Gobierno en las Comunidades Autónomas, salvo las excepciones previstas por esta Ley.\n2. La Administración General del Estado comprende:\n  a) La Organización Central, que integra los Ministerios y los servicios comunes.\n  b) La Organización Territorial.\n  c) La Administración General del Estado en el exterior.\n3. En la organización central son órganos superiores y órganos directivos:\n  a) Órganos superiores:\n\t1.º Los Ministros.\n\t2.º Los Secretarios de Estado.\n   b) Órganos directivos:\n\t1.º Los Subsecretarios y Secretarios generales.\n\t2.º Los Secretarios generales técnicos y Directores generales.\n\t3.º Los Subdirectores generales.\n4. En la organización territorial de la Administración General del Estado son órganos directivos tanto los Delegados del Gobierno en las Comunidades Autónomas, que tendrán rango de Subsecretario, como los Subdelegados del Gobierno en las provincias, los cuales tendrán nivel de Subdirector general.\n5. En la Administración General del Estado en el exterior son órganos directivos los embajadores y representantes permanentes ante Organizaciones internacionales.\n6. Los órganos superiores y directivos tienen además la condición de alto cargo, excepto los Subdirectores generales y asimilados, de acuerdo con lo previsto en la Ley 3/2015, de 30 de marzo, reguladora del ejercicio del alto cargo de la Administración General del Estado.\n7. Todos los demás órganos de la Administración General del Estado se encuentran bajo la dependencia o dirección de un órgano superior o directivo.\n8. Los estatutos de los Organismos públicos determinarán sus respectivos órganos directivos.\n9. Corresponde a los órganos superiores establecer los planes de actuación de la organización situada bajo su responsabilidad y a los órganos directivos su desarrollo y ejecución.\n10. Los Ministros y Secretarios de Estado son nombrados de acuerdo con lo establecido en la Ley 50/1997, de 27 de noviembre, del Gobierno y en la Ley 3/2015, de 30 de marzo, reguladora del ejercicio del alto cargo de la Administración General del Estado.\n11. Sin perjuicio de lo previsto en la Ley 3/2015, de 30 de marzo, reguladora del ejercicio del alto cargo de la Administración General del Estado, los titulares de los órganos superiores y directivos son nombrados, atendiendo a criterios de competencia profesional y experiencia, en la forma establecida en esta Ley, siendo de aplicación al desempeño de sus funciones:\n\ta) La responsabilidad profesional, personal y directa por la gestión desarrollada.\n\n\tb) La sujeción al control y evaluación de la gestión por el órgano superior o directivo competente, sin perjuicio del control establecido por la Ley General Presupuestaria.",

      "law": "Artículo 15\n1. El Consejo Europeo dará a la Unión los impulsos necesarios para su desarrollo y definirá sus orientaciones y prioridades políticas generales. No ejercerá función legislativa alguna.\n2. El Consejo Europeo estará compuesto por los Jefes de Estado o de Gobierno de los Estados miembros, así como por su Presidente y por el Presidente de la Comisión. Participará en sus trabajos el Alto Representante de la Unión para Asuntos Exteriores y Política de Seguridad.\n3. El Consejo Europeo se reunirá dos veces por semestre por convocatoria de su Presidente. Cuando el orden del día lo exija, los miembros del Consejo Europeo podrán decidir contar, cada uno de ellos, con la asistencia de un ministro y, en el caso del Presidente de la Comisión, con la de un miembro de la Comisión. Cuando la situación lo exija, el Presidente convocará una reunión extraordinaria del Consejo Europeo.\n4. El Consejo Europeo se pronunciará por consenso, excepto cuando los Tratados dispongan otra cosa.\n5. El Consejo Europeo elegirá a su Presidente por mayoría cualificada para un mandato de dos años y medio, que podrá renovarse una sola vez. En caso de impedimento o falta grave, el Consejo Europeo podrá poner fin a su mandato por el mismo procedimiento.\n6. El Presidente del Consejo Europeo:\n\ta) presidirá e impulsará los trabajos del Consejo Europeo;\n\tb) velará por la preparación y continuidad de los trabajos del Consejo Europeo, en cooperación con el Presidente de la Comisión y basándose en los trabajos del Consejo de Asuntos Generales;\n\tc) se esforzará por facilitar la cohesión y el consenso en el seno del Consejo Europeo;\n\td) al término de cada reunión del Consejo Europeo, presentará un informe al Parlamento Europeo.\nEl Presidente del Consejo Europeo asumirá, en su rango y condición, la representación exterior de la Unión en los asuntos de política exterior y de seguridad común, sin perjuicio de las atribuciones del Alto Representante de la Unión para Asuntos Exteriores y Política de Seguridad.\nEl Presidente del Consejo Europeo no podrá ejercer mandato nacional alguno.",

      "law": "Artículo 5. Secretaría de Estado de Migraciones.\n1. A la Secretaría de Estado de Migraciones le corresponde elaborar y desarrollar la política del Gobierno en materia de extranjería, inmigración y emigración.\n\n2. De la Secretaría de Estado de Migraciones dependen la Dirección General de Gestión Migratoria, la Dirección General de Atención Humanitaria y del Sistema de Acogida y Protección Internacional, y la Dirección General de la Ciudadanía Española en el Exterior y Políticas de Retorno.\n\n3. Depende directamente de la persona titular de la Secretaría de Estado de Migraciones, con nivel orgánico de subdirección general:\n\na) La Subdirección General de Régimen Jurídico, que ejercerá las siguientes funciones:\n\n1.º Sin perjuicio de las competencias de la Secretaría General Técnica y en coordinación con ella, la elaboración de proyectos normativos y la realización de informes sobre materias relacionadas con el ámbito migratorio.\n\n2.º Sin perjuicio de las competencias de la Secretaría General Técnica y en coordinación con ella, la preparación de propuestas normativas relacionadas con la elaboración, aprobación, transposición y aplicación de normas de la Unión Europea o de ámbito internacional, en materias de su competencia.\n\n3.º La elaboración de instrucciones de desarrollo normativo dirigidas a los órganos de la Administración General del Estado en el territorio, dentro de su ámbito funcional de competencias.\n\n4.º Sin perjuicio de las competencias de la Secretaría General Técnica, el apoyo técnico de la participación en el ámbito de la Unión Europea y de otras organizaciones internacionales en materia de migraciones, así como la coordinación, como punto de contacto nacional, de la Red Europea de Migración en España.\n\nb) El Observatorio Español del Racismo y la Xenofobia, a quien corresponde el ejercicio de las siguientes funciones:\n\n1.º La recopilación y análisis de la información sobre racismo y xenofobia para el conocimiento de la situación y de sus perspectivas de evolución, a través de la puesta en marcha de una red de información.\n\n2.º La promoción del principio de igualdad de trato y no discriminación y lucha contra el racismo y la xenofobia.\n\n3.º La colaboración y coordinación con los distintos agentes públicos y privados, nacionales e internacionales vinculados con la prevención y lucha contra el racismo y la xenofobia.\n\n4.º La realización de planes, estudios y estrategias para favorecer la inclusión de las personas migrantes, y la evaluación de estas, en coordinación con la Secretaría General de Inclusión y con aquellos departamentos con competencias en esta materia.\n\nc) El Gabinete, como órgano de asistencia inmediata a aquella, con la estructura establecida en el artículo 23.3 del Real Decreto 1009/2023, de 5 de diciembre, por el que se establece la estructura orgánica básica de los Departamentos ministeriales.\n\nd) La Subdirección General de Gestión Económica, Fondos Europeos y Contratación, que ejercerá las siguientes funciones:\n\n1.º La planificación, tramitación y seguimiento de la contratación administrativa y privada en el ámbito de competencias de la Secretaría de Estado de Migraciones.\n\n2.º La contratación de las obras, servicios y suministros necesarios para el funcionamiento de los centros de migraciones.\n\n3.º La elaboración de la propuesta de anteproyecto de presupuesto en el ámbito de la Secretaría de Estado de Migraciones, la ejecución del presupuesto de gastos y el seguimiento de la ejecución presupuestaria.\n\n4.º La gestión económica de los expedientes de gasto en el ámbito de competencias de la Secretaría de Estado de Migraciones, así como la gestión financiera y de la tesorería, incluyendo las funciones de habilitación y las inherentes a la gestión de las cajas pagadoras adscritas a aquella.\n\n5.º La coordinación, seguimiento y gestión económica de los fondos provenientes de la Unión Europea en el ámbito de competencias de la Secretaría de Estado de Migraciones.\n\n6.º La gestión integral de subvenciones y otros instrumentos de financiación en el ámbito de la Secretaría de Estado de Migraciones.\n\nDependerá de la Subdirección General de Gestión Económica, Fondos Europeos y Contratación, la División de Contratación, con el nivel que se determine en la relación de puestos de trabajo, que ejercerá las funciones referidas a la tramitación de los contratos de obras y de servicios y suministros necesarios para el funcionamiento de los centros de migraciones.\n\n4. De la Secretaría de Estado de Migraciones depende, con el rango que se determine en la correspondiente relación de puestos de trabajo, el Observatorio Permanente de la Inmigración, cuya presidencia será ejercida por la persona titular de la Secretaría de Estado de Migraciones, con las siguientes funciones y sin perjuicio de lo establecido en el Real Decreto 345/2001, de 4 de abril:\n\na) La coordinación de estudios, informes y análisis sobre políticas y estadísticas migratorias, sin perjuicio de las funciones del Observatorio Español del Racismo y la Xenofobia.\n\nb) El seguimiento y análisis de la evolución del coste y calidad de los programas y prestaciones, así como de la planificación económica, gestionados por la Secretaría de Estado de Migraciones.\n\nc) La propuesta de reformas normativas y de los procedimientos de gestión que permitan un mejor seguimiento y supervisión de los servicios y prestaciones gestionados por la Secretaría de Estado de Migraciones.\n\n5. Quedan adscritos a la Secretaría de Estado los siguientes órganos colegiados:\n\na) El Consejo General de la Ciudadanía Española en el Exterior.\n\nb) La Comisión Interministerial de Extranjería.\n\nc) La Comisión Laboral Tripartita de Inmigración.\n\nd) El Foro para la Integración Social de los Inmigrantes.",

      "respuestas": 0,
      "law": "Artículo 30. Cómputo de plazos.\n1. Salvo que por Ley o en el Derecho de la Unión Europea se disponga otro cómputo, cuando los plazos se señalen por horas, se entiende que éstas son hábiles. Son hábiles todas las horas del día que formen parte de un día hábil.\n\nLos plazos expresados por horas se contarán de hora en hora y de minuto en minuto desde la hora y minuto en que tenga lugar la notificación o publicación del acto de que se trate y no podrán tener una duración superior a veinticuatro horas, en cuyo caso se expresarán en días.\n\n2. Siempre que por Ley o en el Derecho de la Unión Europea no se exprese otro cómputo, cuando los plazos se señalen por días, se entiende que éstos son hábiles, excluyéndose del cómputo los sábados, los domingos y los declarados festivos.\n\nCuando los plazos se hayan señalado por días naturales por declararlo así una ley o por el Derecho de la Unión Europea, se hará constar esta circunstancia en las correspondientes notificaciones.\n\n3. Los plazos expresados en días se contarán a partir del día siguiente a aquel en que tenga lugar la notificación o publicación del acto de que se trate, o desde el siguiente a aquel en que se produzca la estimación o la desestimación por silencio administrativo.\n\n4. Si el plazo se fija en meses o años, éstos se computarán a partir del día siguiente a aquel en que tenga lugar la notificación o publicación del acto de que se trate, o desde el siguiente a aquel en que se produzca la estimación o desestimación por silencio administrativo.\n\nEl plazo concluirá el mismo día en que se produjo la notificación, publicación o silencio administrativo en el mes o el año de vencimiento. Si en el mes de vencimiento no hubiera día equivalente a aquel en que comienza el cómputo, se entenderá que el plazo expira el último día del mes.\n\n5. Cuando el último día del plazo sea inhábil, se entenderá prorrogado al primer día hábil siguiente.\n\n6. Cuando un día fuese hábil en el municipio o Comunidad Autónoma en que residiese el interesado, e inhábil en la sede del órgano administrativo, o a la inversa, se considerará inhábil en todo caso.\n\n7. La Administración General del Estado y las Administraciones de las Comunidades Autónomas, con sujeción al calendario laboral oficial, fijarán, en su respectivo ámbito, el calendario de días inhábiles a efectos de cómputos de plazos. El calendario aprobado por las Comunidades Autónomas comprenderá los días inhábiles de las Entidades Locales correspondientes a su ámbito territorial, a las que será de aplicación.\n\nDicho calendario deberá publicarse antes del comienzo de cada año en el diario oficial que corresponda, así como en otros medios de difusión que garanticen su conocimiento generalizado.\n\n8. La declaración de un día como hábil o inhábil a efectos de cómputo de plazos no determina por sí sola el funcionamiento de los centros de trabajo de las Administraciones Públicas, la organización del tiempo de trabajo o el régimen de jornada y horarios de las mismas.",

      "law": "Titulo II.\nArtículo 8. Concepto y clases de empleados públicos.\n1. Son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones Públicas al servicio de los intereses generales.\n2. Los empleados públicos se clasifican en:\n\ta) Funcionarios de carrera.\n\tb) Funcionarios interinos.\n\tc) Personal laboral, ya sea fijo, por tiempo indefinido o temporal.\n\td) Personal eventual.\n[...]\nCAPÍTULO II. Personal directivo\nArtículo 13. Personal directivo profesional.\nEl Gobierno y los órganos de gobierno de las comunidades autónomas podrán establecer, en desarrollo de este Estatuto, el régimen jurídico específico del personal directivo así como los criterios para determinar su condición, de acuerdo, entre otros, con los siguientes principios:\n1. Es personal directivo el que desarrolla funciones directivas profesionales en las Administraciones Públicas, definidas como tales en las normas específicas de cada Administración.\n2. Su designación atenderá a principios de mérito y capacidad y a criterios de idoneidad, y se llevará a cabo mediante procedimientos que garanticen la publicidad y concurrencia.\n3. El personal directivo estará sujeto a evaluación con arreglo a los criterios de eficacia y eficiencia, responsabilidad por su gestión y control de resultados en relación con los objetivos que les hayan sido fijados.\n4. La determinación de las condiciones de empleo del personal directivo no tendrá la consideración de materia objeto de negociación colectiva a los efectos de esta ley. Cuando el personal directivo reúna la condición de personal laboral estará sometido a la relación laboral de carácter especial de alta dirección.",

      "law": "Artículo 3. Definiciones.\nA los efectos de esta ley, se entiende por:\n\na) Discriminación directa: Situación en que se encuentra una persona o grupo en que se integra que sea, haya sido o pudiera ser tratada de manera menos favorable que otras en situación análoga o comparable por razón de orientación sexual e identidad sexual, expresión de género o características sexuales.\n\nSe considerará discriminación directa la denegación de ajustes razonables a las personas con discapacidad. A tal efecto, se entiende por ajustes razonables las modificaciones y adaptaciones necesarias y adecuadas del ambiente físico, social y actitudinal que no impongan una carga desproporcionada o indebida, cuando se requieran en un caso particular de manera eficaz y práctica, para facilitar la accesibilidad y la participación y garantizar a las personas con discapacidad el goce o ejercicio, en igualdad de condiciones con las demás, de todos los derechos.\n\nb) Discriminación indirecta: Se produce cuando una disposición, criterio o práctica aparentemente neutros ocasiona o puede ocasionar a una o varias personas una desventaja particular con respecto a otras por razón de orientación sexual, e identidad sexual, expresión de género o características sexuales.\n\nc) Discriminación múltiple e interseccional:\n\nSe produce discriminación múltiple cuando una persona es discriminada, de manera simultánea o consecutiva, por dos o más causas de las previstas en esta ley, y/o por otra causa o causas de discriminación previstas en la Ley 15/2022, de 12 de julio, integral para la igualdad de trato y la no discriminación.\n\nSe produce discriminación interseccional cuando concurren o interactúan diversas causas comprendidas en el apartado anterior, generando una forma específica de discriminación.\n\nd) Acoso discriminatorio: Cualquier conducta realizada por razón de alguna de las causas de discriminación previstas en esta ley, con el objetivo o la consecuencia de atentar contra la dignidad de una persona o grupo en que se integra y de crear un entorno intimidatorio, hostil, degradante, humillante u ofensivo.\n\ne) Discriminación por asociación y discriminación por error: Existe discriminación por asociación cuando una persona o grupo en que se integra, debido a su relación con otra sobre la que concurra alguna de las causas de discriminación por razón de orientación e identidad sexual, expresión de género o características sexuales, es objeto de un trato discriminatorio.\n\nLa discriminación por error es aquella que se funda en una apreciación incorrecta acerca de las características de la persona o personas discriminadas.\n\nf) Medidas de acción positiva: Diferencias de trato orientadas a prevenir, eliminar y, en su caso, compensar cualquier forma de discriminación o desventaja en su dimensión colectiva o social. Tales medidas serán aplicables en tanto subsistan las situaciones de discriminación o las desventajas que las justifican y habrán de ser razonables y proporcionadas en relación con los medios para su desarrollo y los objetivos que persigan.\n\ng) Intersexualidad: La condición de aquellas personas nacidas con unas características biológicas, anatómicas o fisiológicas, una anatomía sexual, unos órganos reproductivos o un patrón cromosómico que no se corresponden con las nociones socialmente establecidas de los cuerpos masculinos o femeninos.\n\nh) Orientación sexual: Atracción física, sexual o afectiva hacia una persona.\n\nLa orientación sexual puede ser heterosexual, cuando se siente atracción física, sexual o afectiva únicamente hacia personas de distinto sexo; homosexual, cuando se siente atracción física, sexual o afectiva únicamente hacia personas del mismo sexo; o bisexual, cuando se siente atracción física, sexual o afectiva hacia personas de diferentes sexos, no necesariamente al mismo tiempo, de la misma manera, en el mismo grado ni con la misma intensidad.\n\nLas personas homosexuales pueden ser gais, si son hombres, o lesbianas, si son mujeres.\n\ni) Identidad sexual: Vivencia interna e individual del sexo tal y como cada persona la siente y autodefine, pudiendo o no corresponder con el sexo asignado al nacer.\n\nj) Expresión de género: Manifestación que cada persona hace de su identidad sexual.\n\nk) Persona trans: Persona cuya identidad sexual no se corresponde con el sexo asignado al nacer.\n\nl) Familia LGTBI: Aquella en la que uno o más de sus integrantes son personas LGTBI, englobándose dentro de ellas las familias homoparentales, es decir, las compuestas por personas lesbianas, gais o bisexuales con descendientes menores de edad que se encuentran de forma estable bajo guardia, tutela o patria potestad, o con descendientes mayores de edad con discapacidad a cargo.\n\nm) LGTBIfobia: Toda actitud, conducta o discurso de rechazo, repudio, prejuicio, discriminación o intolerancia hacia las personas LGTBI por el hecho de serlo, o ser percibidas como tales.\n\nn) Homofobia: Toda actitud, conducta o discurso de rechazo, repudio, prejuicio, discriminación o intolerancia hacia las personas homosexuales por el hecho de serlo, o ser percibidas como tales.\n\nñ) Bifobia: Toda actitud, conducta o discurso de rechazo, repudio, prejuicio, discriminación o intolerancia hacia las personas bisexuales por el hecho de serlo, o ser percibidas como tales.\n\no) Transfobia: Toda actitud, conducta o discurso de rechazo, repudio, prejuicio, discriminación o intolerancia hacia las personas trans por el hecho de serlo, o ser percibidas como tales.\n\np) Inducción, orden o instrucción de discriminar: Es discriminatoria toda inducción, orden o instrucción de discriminar por cualquiera de las causas establecidas en esta ley. La inducción ha de ser concreta, directa y eficaz para hacer surgir en otra persona una actuación discriminatoria.",

      "law": "Artículo 305. Extensión.\n1. Estarán obligatoriamente incluidas en el campo de aplicación del Régimen Especial de la Seguridad Social de los Trabajadores por Cuenta Propia o Autónomos las personas físicas mayores de dieciocho años que realicen de forma habitual, personal, directa, por cuenta propia y fuera del ámbito de dirección y organización de otra persona, una actividad económica o profesional a título lucrativo, den o no ocupación a trabajadores por cuenta ajena, en los términos y condiciones que se determinen en esta ley y en sus normas de aplicación y desarrollo.\n\n2. A los efectos de esta ley se declaran expresamente comprendidos en este régimen especial:\n\na) Los trabajadores incluidos en el Sistema Especial para Trabajadores por Cuenta Propia Agrarios.\n\nb) Quienes ejerzan las funciones de dirección y gerencia que conlleva el desempeño del cargo de consejero o administrador, o presten otros servicios para una sociedad de capital, a título lucrativo y de forma habitual, personal y directa, siempre que posean el control efectivo, directo o indirecto, de aquella. Se entenderá, en todo caso, que se produce tal circunstancia, cuando las acciones o participaciones del trabajador supongan, al menos, la mitad del capital social.\n\nSe presumirá, salvo prueba en contrario, que el trabajador posee el control efectivo de la sociedad cuando concurra alguna de las siguientes circunstancias:\n\n1.º Que, al menos, la mitad del capital de la sociedad para la que preste sus servicios esté distribuido entre socios con los que conviva y a quienes se encuentre unido por vínculo conyugal o de parentesco por consanguinidad, afinidad o adopción, hasta el segundo grado.\n\n2.º Que su participación en el capital social sea igual o superior a la tercera parte del mismo.\n\n3.º Que su participación en el capital social sea igual o superior a la cuarta parte del mismo, si tiene atribuidas funciones de dirección y gerencia de la sociedad.\n\nEn los supuestos en que no concurran las circunstancias anteriores, la Administración podrá demostrar, por cualquier medio de prueba, que el trabajador dispone del control efectivo de la sociedad.\n\nc) Los socios industriales de sociedades regulares colectivas y de sociedades comanditarias a los que se refiere el artículo 1.2.a) de la Ley 20/2007, de 11 de julio, del Estatuto del trabajo autónomo.\n\nd) Los comuneros de las comunidades de bienes y los socios de sociedades civiles irregulares, salvo que su actividad se limite a la mera administración de los bienes puestos en común, a los que se refiere el artículo 1.2.b) de la Ley 20/2007, de 11 de julio.\n\ne) Los socios trabajadores de las sociedades laborales cuando su participación en el capital social junto con la de su cónyuge y parientes por consanguinidad, afinidad o adopción hasta el segundo grado con los que convivan alcance, al menos, el 50 por ciento, salvo que acrediten que el ejercicio del control efectivo de la sociedad requiere el concurso de personas ajenas a las relaciones familiares.\n\nf) Los trabajadores autónomos económicamente dependientes a los que se refiere la Ley 20/2007, de 11 de julio.\n\ng) Quienes ejerzan una actividad por cuenta propia, en las condiciones establecidas en el apartado 1, que requiera la incorporación a un colegio profesional, sin perjuicio de lo previsto en la disposición adicional decimoctava.\n\nh) Los miembros del Cuerpo Único de Notarios.\n\ni) Los miembros del Cuerpo de Registradores de la Propiedad, Mercantiles y de Bienes Muebles, así como los del Cuerpo de Aspirantes.\n\nj) Las personas incluidas en el ámbito de aplicación de la Ley 55/2003, de 16 de diciembre, del Estatuto Marco del personal estatutario de los servicios de salud, que presten servicios, a tiempo completo, en los servicios de salud de las diferentes comunidades autónomas o en los centros dependientes del Instituto Nacional de Gestión Sanitaria, por las actividades complementarias privadas que realicen y que determinen su inclusión en el sistema de la Seguridad Social, sin perjuicio de lo previsto en la disposición adicional decimoctava.\n\nk) El cónyuge y los parientes del trabajador por cuenta propia o autónomo que, conforme a lo señalado en el artículo 12.1 y en el apartado 1 de este artículo, realicen trabajos de forma habitual y no tengan la consideración de trabajadores por cuenta ajena.\n\nl) Los socios trabajadores de las cooperativas de trabajo asociado dedicados a la venta ambulante que perciban ingresos directamente de los compradores.\n\nm) Quienes ejerzan por cuenta propia cualquiera de las actividades artísticas a que se refiere el artículo 249 quater.1.\n\nn) Cualesquiera otras personas que, por razón de su actividad, sean objeto de inclusión mediante norma reglamentaria, conforme a lo dispuesto en el artículo 7.1.b).",

      "law": "Artículo 7. Extensión del campo de aplicación.\n1. Estarán comprendidos en el sistema de la Seguridad Social, a efectos de las prestaciones contributivas, cualquiera que sea su sexo, estado civil y profesión, los españoles que residan en España y los extranjeros que residan o se encuentren legalmente en España, siempre que, en ambos supuestos, ejerzan su actividad en territorio nacional y estén incluidos en alguno de los apartados siguientes:\na) Trabajadores por cuenta ajena que presten sus servicios en las condiciones establecidas por el artículo 1.1 del texto refundido de la Ley del Estatuto de los Trabajadores, en las distintas ramas de la actividad económica o asimilados a ellos, bien sean eventuales, de temporada o fijos, aun de trabajo discontinuo, e incluidos los trabajadores a distancia, y con independencia, en todos los casos, del grupo profesional del trabajador, de la forma y cuantía de la remuneración que perciba y de la naturaleza común o especial de su relación laboral.\nb) Trabajadores por cuenta propia o autónomos, sean o no titulares de empresas individuales o familiares, mayores de dieciocho años, que reúnan los requisitos que de modo expreso se determinen en esta ley y en su normativa de desarrollo.\nc) Socios trabajadores de cooperativas de trabajo asociado.\nd) Estudiantes.\ne) Funcionarios públicos, civiles y militares.\n2. Asimismo, estarán comprendidos en el campo de aplicación del sistema de la Seguridad Social, a efectos de las prestaciones no contributivas, todos los españoles residentes en territorio español.\nTambién estarán comprendidos en el campo de aplicación del sistema de la Seguridad Social, a efectos de las prestaciones no contributivas, los extranjeros que residan legalmente en territorio español, en los términos previstos en la Ley Orgánica 4/2000, de 11 de enero, sobre derechos y libertades de los extranjeros en España y su integración social y, en su caso, en los tratados, convenios, acuerdos o instrumentos internacionales aprobados, suscritos o ratificados al efecto.\n3. El Gobierno, en el marco de los sistemas de protección social pública, podrá establecer medidas de protección social en favor de los españoles no residentes en España, de acuerdo con las características de los países de residencia.\n4. El Gobierno, como medida para facilitar la plena integración social y profesional de los deportistas de alto nivel, podrá establecer la inclusión de los mismos en el sistema de la Seguridad Social.\n5. No obstante lo dispuesto en los apartados anteriores del presente artículo, el Gobierno, a propuesta del Ministerio de Empleo y Seguridad Social y oídos las organizaciones sindicales más representativas o el colegio oficial competente, podrá, a instancia de los interesados, excluir del campo de aplicación del régimen de la Seguridad Social correspondiente, a las personas cuyo trabajo por cuenta ajena, en atención a su jornada o a su retribución, pueda considerarse marginal y no constitutivo de medio fundamental de vida.\n\nArtículo 8. Prohibición de inclusión múltiple obligatoria.\n1. Las personas comprendidas en el campo de aplicación del sistema de la Seguridad Social no podrán estar incluidas por el mismo trabajo, con carácter obligatorio, en otros regímenes de previsión distintos de los que integran dicho sistema.\n2. Los sistemas de previsión obligatoria distintos de los regulados en esta ley, que pudieran tener constituidos determinados grupos profesionales, se integrarán en el Régimen General o en los regímenes especiales, según proceda, siempre que resulte obligatoria la inclusión de los grupos mencionados en el campo de aplicación de dichos regímenes.",

es de dirección y gerencia de la sociedad, ni posean su control en los términos previstos por el artículo 305.2.e).\n\ne) Como asimilados a trabajadores por cuenta ajena, los socios trabajadores de las sociedades laborales que, por su condición de administradores de las mismas, realicen funciones de dirección y gerencia de la sociedad, siendo retribuidos por ello o por su vinculación simultánea a la sociedad laboral mediante una relación laboral de carácter especial de alta dirección, y no posean su control en los términos previstos por el artículo 305.2.e).\n\nEstos socios trabajadores quedarán excluidos de la protección por desempleo y del Fondo de Garantía Salarial, salvo cuando el número de socios de la sociedad laboral no supere los veinticinco.\n\nf) El personal contratado al servicio de notarías, registros de la propiedad y demás oficinas o centros similares.\n\ng) Los trabajadores que realicen las operaciones de manipulación, empaquetado, envasado y comercialización del plátano, tanto si dichas labores se llevan a cabo en el lugar de producción del producto como fuera del mismo, ya provengan de explotaciones propias o de terceros y ya se realicen individualmente o en común mediante cualquier tipo de asociación o agrupación, incluidas las cooperativas en sus distintas clases.\n\nh) Las personas que presten servicios retribuidos en entidades o instituciones de carácter benéfico-social.\n\ni) Los laicos o seglares que presten servicios retribuidos en los establecimientos o dependencias de las entidades o instituciones eclesiásticas. Por acuerdo especial con la jerarquía eclesiástica competente se regulará la situación de los trabajadores laicos y seglares que presten sus servicios retribuidos a organismos o dependencias de la Iglesia y cuya misión primordial consista en ayudar directamente en la práctica del culto.\n\nj) Los conductores de vehículos de turismo al servicio de particulares.\n\nk) El personal civil no funcionario de las administraciones públicas y
