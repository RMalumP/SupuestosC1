/* ═══════════════════════════════════════════
   COLOR DE LAS CASILLAS DE NAVEGACIÓN TRAS CORREGIR
   ───────────────────────────────────────────
   Acierto → verde ("answered"). Fallo → rojo ("nav-wrong").
   Sin responder → sin clase, aspecto neutro ("en blanco").
═══════════════════════════════════════════ */
function updateNavResultColors() {
    questions.forEach((q, i) => {
        const correctNew = parseInt(document.getElementById(`qcard-${i}`).dataset.correct);
        const navBox = document.getElementById(`nav-${i}`);
        navBox.classList.remove('answered', 'nav-wrong');
        if (userAns[i] === undefined) return;
        navBox.classList.add(userAns[i] === correctNew ? 'answered' : 'nav-wrong');
    });
}

/* ═══════════════════════════════════════════
   CORRECCIÓN DEL EXAMEN (desde botón principal)
   Puede lanzarse en cualquier momento, incluso desde la
   pregunta 1 y sin haber respondido todas las preguntas.
═══════════════════════════════════════════ */
function evaluateExam() {
    if (evaluated) return;

    const answeredCount = Object.keys(userAns).length;
    if (answeredCount < questions.length) {
        const proceed = confirm(
            `Has respondido ${answeredCount} de ${questions.length} preguntas.\n¿Deseas corregir el examen igualmente? Las preguntas sin responder contarán como no acertadas.`
        );
        if (!proceed) return;
    }

    evaluated = true;
    clearInterval(timerInt);

    // Marcar opciones correctas / erróneas en las tarjetas visibles
    questions.forEach((q, i) => {
        const correctNew = parseInt(document.getElementById(`qcard-${i}`).dataset.correct);
        document.getElementById(`feed-${i}`).style.display = 'block';
        document.getElementById(`opt-${i}-${correctNew}`).classList.add('correct');
        if (userAns[i] !== undefined && userAns[i] !== correctNew) {
            document.getElementById(`opt-${i}-${userAns[i]}`).classList.add('wrong');
        }
    });
    updateNavResultColors();

    // Ocultar botón corregir, mostrar imprimir, repetir, enviar y menú
    setButtonsVisible(['check-btn'], false);
    setButtonsVisible(['print-btn', 'restart-btn', 'send-btn', 'home-btn-bottom'], true);

    // Banner de resultado inline
    buildInlineScore();

    jump(0);
}

/* ═══════════════════════════════════════════
   SCORE — cálculo
═══════════════════════════════════════════ */
function calcScore() {
    let score = 0;
    questions.forEach((q, i) => {
        const correctNew = parseInt(document.getElementById(`qcard-${i}`).dataset.correct);
        if (userAns[i] === correctNew) score++;
    });
    return score;
}

/* Recuento completo, tratando cada bloque como una entidad separada:
   cada uno suma y descuenta según su propio baremo (acierto / fallo /
   en blanco) y se totaliza al final. */
function calcResultados() {
    const mapa  = new Map();
    const orden = [];

    questions.forEach((q, i) => {
        const b = getBlock(q.bloqueId);
        if (!mapa.has(b.id)) {
            mapa.set(b.id, { bloque: b, total: 0, aciertos: 0, fallos: 0,
                             blancos: 0, puntos: 0, max: 0 });
            orden.push(b.id);
        }
        const r    = mapa.get(b.id);
        const card = document.getElementById(`qcard-${i}`);
        const correcta = card ? parseInt(card.dataset.correct) : -1;

        r.total++;
        r.max += b.acierto;
        if (userAns[i] === undefined)     { r.blancos++;  r.puntos -= b.blanco; }
        else if (userAns[i] === correcta) { r.aciertos++; r.puntos += b.acierto; }
        else                              { r.fallos++;   r.puntos -= b.fallo;  }
    });

    const bloques = orden.map(id => mapa.get(id));
    const tot = { total: 0, aciertos: 0, fallos: 0, blancos: 0, puntos: 0, max: 0 };
    bloques.forEach(r => {
        ['total', 'aciertos', 'fallos', 'blancos', 'puntos', 'max'].forEach(k => { tot[k] += r[k]; });
    });
    tot.bloques = bloques;
    tot.pct = tot.max > 0 ? Math.max(0, (tot.puntos / tot.max) * 100) : 0;
    tot.apto = tot.pct >= APTO_PCT;
    return tot;
}

// Desglose por bloques (solo tiene sentido si hay más de uno en el intento)
function desgloseBloquesHTML(res) {
    if (res.bloques.length < 2) return '';
    return `<div class="score-bloques">${res.bloques.map(r => `
        <div class="sb-fila blq-${r.bloque.id}">
            <span class="sb-nombre">${r.bloque.titulo}</span>
            <span class="sb-detalle">${r.aciertos} ✓ · ${r.fallos} ✗ · ${r.blancos} —</span>
            <span class="sb-puntos">${nUm(r.puntos)} / ${nUm(r.max)}</span>
        </div>`).join('')}</div>`;
}

function lineaRecuento(res) {
    return `${nUm(res.pct)}% · ${res.aciertos} ACIERTOS · ${res.fallos} FALLOS · ${res.blancos} EN BLANCO`;
}

function buildScoreBanner() {
    const res     = calcResultados();
    const emoji   = res.aciertos === res.total ? '🏆' : res.apto ? '✅' : '📚';
    const verdict = res.aciertos === res.total ? '¡Expediente magistralmente resuelto!'
                  : res.apto ? 'APTO — Buen dominio normativo'
                             : 'NO APTO — Revise cada motivación legal';

    const banner  = document.getElementById('score-banner');
    banner.style.display = 'block';
    banner.innerHTML = `
        <div style="font-size:2rem; margin-bottom:6px;">${emoji}</div>
        <div class="score-big">${nUm(res.puntos)} / ${nUm(res.max)}</div>
        <div class="score-lbl">${lineaRecuento(res)}</div>
        <div class="score-verdict ${res.apto ? 'apto':'no-apto'}" style="margin-top:10px;">${verdict}</div>
        ${desgloseBloquesHTML(res)}`;
}

function buildInlineScore() {
    const res   = calcResultados();
    const emoji = res.aciertos === res.total ? '🏆' : res.apto ? '✅' : '📚';

    const banner  = document.createElement('div');
    banner.id     = 'inline-score-banner';
    banner.style.cssText = 'background:var(--navy-mid);border:1px solid var(--gold);border-radius:4px;padding:20px 28px;margin-bottom:28px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3);position:relative;z-index:1;';
    banner.innerHTML = `
        <div style="font-size:2.2rem;margin-bottom:6px;">${emoji}</div>
        <div style="font-family:'Playfair Display',serif;font-size:3rem;color:var(--gold);font-weight:900;line-height:1;">${nUm(res.puntos)} / ${nUm(res.max)}</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.2em;color:rgba(255,255,255,0.4);margin:4px 0 10px;">${lineaRecuento(res)}</div>
        <div style="font-size:1rem;color:${res.apto?'#6fcf97':'#fc8181'};font-weight:600;">${res.apto?'APTO — Buen dominio normativo':'NO APTO — Revise la motivación de cada respuesta'}</div>
        ${desgloseBloquesHTML(res)}`;

    const container = document.querySelector('.container');
    const statement = container.querySelector('.statement');
    if (statement) {
        container.insertBefore(banner, statement.nextSibling);
    } else {
        // Si se ha eliminado la sección de enunciado (opcional en la plantilla)
        const progress = container.querySelector('.progress-bar-wrap');
        container.insertBefore(banner, progress || container.firstChild);
    }
}

/* ═══════════════════════════════════════════
   PANEL CORRECCIÓN COMPLETA (overlay)
═══════════════════════════════════════════ */
function showCorrectionPanel() {
    buildScoreBanner();
    updateNavResultColors();

    const panel  = document.getElementById('correction-panel');
    const resumenBloques = new Map(calcResultados().bloques.map(r => [r.bloque.id, r]));
    let html = '';
    let bloqueAnterior = null;

    questions.forEach((q, i) => {
        // Separador cada vez que empieza un bloque distinto
        if (q.bloqueId !== bloqueAnterior) {
            bloqueAnterior = q.bloqueId;
            const b = getBlock(q.bloqueId);
            const r = resumenBloques.get(b.id);
            html += `<div class="corr-bloque blq-${b.id}">${b.titulo} — ${r.aciertos} ✓ · ${r.fallos} ✗ · ${r.blancos} — · ${nUm(r.puntos)} / ${nUm(r.max)} puntos</div>`;
        }
        const correctNew = parseInt(document.getElementById(`qcard-${i}`).dataset.correct);
        const given      = userAns[i];
        const isCorrect  = given === correctNew;
        const isSkipped  = given === undefined;

        // Marcar visualmente en las tarjetas
        document.getElementById(`opt-${i}-${correctNew}`).classList.add('correct');
        if (!isSkipped && !isCorrect) document.getElementById(`opt-${i}-${given}`).classList.add('wrong');
        document.getElementById(`feed-${i}`).style.display = 'block';

        // Texto de la opción elegida
        const givenText = isSkipped
            ? '<em style="color:#9ca3af;">Sin responder</em>'
            : q.a[/* original idx */ [...document.querySelectorAll(`#qcard-${i} .option`)][given].querySelector('span:last-child').textContent];

        // Obtener textos de opciones del DOM
        const optEls = document.querySelectorAll(`#qcard-${i} .option span:last-child`);
        const optTexts = [...optEls].map(el => el.textContent.trim());

        const badgeClass = isSkipped ? 'skip' : isCorrect ? 'ok' : 'err';
        const badgeText  = isSkipped ? '—'   : isCorrect ? '✓'  : '✗';

        html += `
        <div class="corr-item">
            <div class="ci-header">
                <div class="ci-badge ${badgeClass}">${badgeText}</div>
                <div class="ci-q"><strong>Pregunta ${i+1}.</strong> ${q.q}</div>
            </div>
            <div class="ci-answers">
                ${!isSkipped ? `<div class="given ${isCorrect?'':'wrong'}">
                    <strong>Respuesta elegida:</strong> ${LETTERS[given]}) ${optTexts[given]}
                </div>` : `<div class="given wrong"><em>Pregunta no respondida</em></div>`}
                ${!isCorrect ? `<div class="correct-ans">
                    <strong>Respuesta correcta:</strong> ${LETTERS[correctNew]}) ${optTexts[correctNew]}
                </div>` : ''}
            </div>
            <div class="ci-law"><strong>⚖️ Normativa aplicable:</strong><br>${q.law}</div>
            ${q.tip ? `<div class="ci-tip">${q.tip}</div>` : ''}
        </div>`;
    });

    panel.innerHTML = html;
    panel.style.display = 'block';

    // Mostrar botones en overlay
    setButtonsVisible(['print-btn', 'restart-btn', 'home-btn-bottom'], true);
}

/* ═══════════════════════════════════════════
   IMPRESIÓN / PDF
═══════════════════════════════════════════ */
function printResults() {
    // Asegurarse de que todo esté corregido y visible
    if (!evaluated) evaluateExam();

    // Mostrar todas las tarjetas para imprimir
    document.querySelectorAll('.question-card').forEach(c => {
        c.style.display = 'block';
    });
    document.querySelectorAll('.feedback').forEach(f => {
        f.style.display = 'block';
    });

    // Reconstruir temporalmente el documento para impresión: cada enunciado
    // aparece justo antes del bloque de preguntas al que está vinculado
    // (en pantalla solo se muestra un enunciado a la vez).
    const statementContainer = document.getElementById('statement-container');
    const quizContainer      = document.getElementById('quiz-container');
    const printWrap = document.createElement('div');
    printWrap.id = 'print-wrap';
    let lastStatementId, lastBlockId;
    questions.forEach((q, i) => {
        // Cabecera de sección al empezar cada bloque
        if (q.bloqueId !== lastBlockId) {
            lastBlockId = q.bloqueId;
            lastStatementId = undefined;      // el enunciado se repite en la nueva sección
            const cab = document.getElementById(`bhdr-${q.bloqueId}`);
            if (cab) printWrap.appendChild(cab);
        }
        const sid = q.statementId || null;
        if (sid !== lastStatementId) {
            lastStatementId = sid;
            if (sid) {
                const stmt = STATEMENTS_BANK.find(s => s.id === sid);
                if (stmt) {
                    const tmp = document.createElement('div');
                    tmp.innerHTML = renderStatementHTML(stmt);
                    printWrap.appendChild(tmp.firstElementChild);
                }
            }
        }
        printWrap.appendChild(document.getElementById(`qcard-${i}`));
    });
    statementContainer.style.display = 'none';
    quizContainer.style.display = 'none';
    quizContainer.insertAdjacentElement('afterend', printWrap);

    // Ocultar el overlay temporalmente (sin tocar el display inline,
    // para no romper el cierre posterior con classList en closeOverlay)
    const overlayWasShown = document.getElementById('overlay').classList.contains('show');
    document.getElementById('overlay').classList.remove('show');

    window.print();

    // Restaurar tras impresión: devolver cada tarjeta a quiz-container en
    // su orden original y eliminar el contenedor temporal de impresión.
    setTimeout(() => {
        // Devolver cabeceras de bloque y tarjetas a su sitio, en el mismo
        // orden en que se crearon (cabecera del bloque y luego sus preguntas).
        let bloqueRestaurado;
        questions.forEach((q, i) => {
            if (q.bloqueId !== bloqueRestaurado) {
                bloqueRestaurado = q.bloqueId;
                const cab = document.getElementById(`bhdr-${q.bloqueId}`);
                if (cab) quizContainer.appendChild(cab);
            }
            quizContainer.appendChild(document.getElementById(`qcard-${i}`));
        });
        printWrap.remove();
        quizContainer.style.display = '';
        statementContainer.style.display = '';
        document.querySelectorAll('.question-card').forEach(c => { c.style.display = ''; });
        if (questions.length) jump(current);
        if (evaluated && overlayWasShown) {
            document.getElementById('overlay').classList.add('show');
        }
    }, 1000);
}

/* ═══════════════════════════════════════════
   ENVÍO DE RESULTADOS A GOOGLE FORMS
═══════════════════════════════════════════ */
function enviarResultados() {
    if (!evaluated) return;

    if (!ENVIO.url) {
        alert('Este supuesto no tiene configurada la dirección de envío de resultados.');
        return;
    }

    const sendBtn = document.getElementById('send-btn');

    // Identificador del examen: título de la página
    const examId = document.title.trim();

    // Nombre del usuario
    let userName = prompt('Introduce tu nombre para el envío de resultados:', '');
    if (userName === null) userName = '';
    userName = userName.trim();
    if (!userName) userName = 'Anónimo';

    // Estadísticas (globales y por bloque)
    const res      = calcResultados();
    const total    = res.total;
    const correct  = res.aciertos;
    const wrong    = res.fallos;
    const blank    = res.blancos;

    // Tiempos (formato mm:ss)
    const tiempoAsignado = formatTime(examDurationSeconds);
    const elapsedSeconds = Math.max(0, Math.min(examDurationSeconds, examDurationSeconds - timeLeft));
    const tiempoEmpleado = formatTime(elapsedSeconds);

    const FORM_ACTION_URL = ENVIO.url;

    // Cada dato va a la casilla que se le haya asignado en el editor.
    // Las casillas que se dejen vacías simplemente no se envían.
    const fieldMap = {};
    const anota = (casilla, valor) => {
        const nombre = String(casilla || '').trim();
        if (nombre) fieldMap[nombre] = valor;
    };

    anota(ENVIO.examen,         examId);
    anota(ENVIO.usuario,        userName);
    anota(ENVIO.tiempoAsignado, tiempoAsignado);
    anota(ENVIO.tiempoEmpleado, tiempoEmpleado);

    // Un juego de casillas por cada bloque que haya salido en el intento
    res.bloques.forEach(r => {
        const casillas = r.bloque.envio || {};
        anota(casillas.preguntas, r.total);
        anota(casillas.aciertos,  r.aciertos);
        anota(casillas.fallos,    r.fallos);
        anota(casillas.blancos,   r.blancos);
        anota(casillas.puntos,    nUm(r.puntos));
    });

    // Iframe oculto de destino para evitar navegar fuera de la página (y problemas de CORS)
    let iframe = document.getElementById('hidden-send-frame');
    if (!iframe) {
        iframe = document.createElement('iframe');
        iframe.id = 'hidden-send-frame';
        iframe.name = 'hidden-send-frame';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
    }

    // Formulario oculto que replica los campos del Google Form
    const form = document.createElement('form');
    form.action = FORM_ACTION_URL;
    form.method = 'POST';
    form.target = 'hidden-send-frame';
    form.style.display = 'none';

    Object.keys(fieldMap).forEach(entryName => {
        const input = document.createElement('input');
        input.type  = 'hidden';
        input.name  = entryName;
        input.value = fieldMap[entryName];
        form.appendChild(input);
    });

    document.body.appendChild(form);

    if (sendBtn) {
        sendBtn.disabled = true;
        sendBtn.textContent = '✔ Resultados enviados';
    }

    form.submit();
    form.remove();

    const desglose = res.bloques.length < 2 ? '' :
        '\n\nPor bloques:' + res.bloques.map(r =>
            '\n · ' + r.bloque.titulo + ': ' + r.aciertos + ' ✓ · ' + r.fallos +
            ' ✗ · ' + r.blancos + ' — · ' + nUm(r.puntos) + ' / ' + nUm(r.max) + ' puntos').join('');

    alert('✅ Resultados enviados correctamente.\n\nExamen: ' + examId +
          '\nUsuario: ' + userName +
          '\nAciertos: ' + correct + ' / ' + total +
          '\nFallos: ' + wrong +
          '\nEn blanco: ' + blank +
          '\nPuntuación: ' + nUm(res.puntos) + ' / ' + nUm(res.max) +
          '\nTiempo empleado: ' + tiempoEmpleado + ' de ' + tiempoAsignado +
          desglose);
}

//       'full'    → también se baraja qué preguntas salen y en qué orden
//                    (respetando siempre el vínculo pregunta-enunciado y
//                    renumerando 1..N de forma correlativa y visible).
function confirmRestart(mode) {
    closeRandomModal();
    if (timerInt) clearInterval(timerInt);
    // Limpiar banner inline
    const old = document.getElementById('inline-score-banner');
    if (old) old.remove();
    // Ocultar overlay
    document.getElementById('overlay').classList.remove('show');
    // Reinicializar el intento. Para 'answers' se reutiliza el conjunto de
    // preguntas ya cargado (questions); para 'full' se recalcula desde cero
    // a partir de QUESTIONS_BANK dentro de buildQuestionOrder().
    init(mode, questions);
}

/* ═══════════════════════════════════════════
   VOLVER AL MENÚ PRINCIPAL
═══════════════════════════════════════════ */
function goHome() {
    if (!evaluated) {
        const leave = confirm(
            'Vas a salir del expediente dejando el test a medias: se perderá el progreso del intento actual.\n\n¿Seguro que quieres volver al menú principal?'
        );
        if (!leave) return;
    }
    window.location.href = (ajusteInterfaz('botonCasa').url || '../index.html');
}

/* ═══════════════════════════════════════════
   ARRANQUE INICIAL
═══════════════════════════════════════════ */
// Inicializar contexto de audio al primer clic del usuario
document.addEventListener('click', () => {
    try { getAudioCtx(); } catch(e) {}
}, { once: true });

applyExamConfig();
init('default');
</script>
